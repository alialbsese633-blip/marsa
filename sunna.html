  x.fillStyle=GOLD;octagram(x,W/2,1056,13,true);
  x.font='500 34px SunnaPlex';x.fillStyle=GOLD;
  var s=p.src;if(x.measureText(s).width>900){x.font='500 26px SunnaPlex'}if(x.measureText(s).width>900){x.font='500 22px SunnaPlex'}
  x.fillText(s,W/2,1112);
  x.font='400 26px SunnaPlex';x.fillStyle=SOFT;x.fillText(p.foot,W/2,1160);
  /* التذييل: حقوق السنة الغراء */
  x.fillStyle=GOLD;x.font='700 66px SunnaAmiri';x.fillText(C.sig,W/2,1243);
  x.globalAlpha=.8;octagram(x,W/2-150,1243,9,true);octagram(x,W/2+150,1243,9,true);x.globalAlpha=1;
  return c;
}

/* ===== المشاركة ===== */
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.className='toast on';clearTimeout(toast.t);toast.t=setTimeout(function(){t.className='toast'},2400)}
function blobOf(c){return new Promise(function(res){c.toBlob(res,'image/png')})}
async function fileOf(i,n){await loadFonts();var b=await blobOf(render(i));return new File([b],'sunna-'+dkey()+'-'+(n||1)+'.png',{type:'image/png'})}
function download(file){var a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500)}
async function shareImages(idxs){
  try{
    var files=[];for(var k=0;k<idxs.length;k++)files.push(await fileOf(idxs[k],k+1));
    if(navigator.canShare&&navigator.canShare({files:files})){await navigator.share({files:files});return true}
    files.forEach(download);toast('حُفظت الصورة — أرسلها من معرض الصور');return false;
  }catch(e){if(e&&e.name==='AbortError')return null;toast('تعذّرت المشاركة');return null}
}
async function shareText(i){
  var t=msgText(i);
  try{if(navigator.share){await navigator.share({text:t});return true}}catch(e){if(e&&e.name==='AbortError')return null}
  window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');return false;
}
function copyText(i){
  var t=msgText(i);
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast('تم النسخ ✓')},fb)}else fb();
  function fb(){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity=0;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('تم النسخ ✓')}catch(e){toast('تعذّر النسخ')}a.remove()}
}

/* ===== واجهة: اليوم ===== */
var DAYN=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
function hijri(){try{return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'}).format(new Date())}catch(e){return ''}}
function swHtml(i){
  var cur=themeOf(i).id;
  return '<div class="sws"><small>النموذج:</small>'+THEMES.map(function(t){return '<button class="sw'+(t.id===cur?' on':'')+'" data-a="th" data-th="'+t.id+'" title="'+t.n+'" style="background:linear-gradient(135deg,'+t.bg[0]+' 55%,'+t.gold+' 56%)"></button>'}).join('')+'</div>';
}
function setTheme(i,id){S.th=S.th||{};S.th[i]=id;save()}
function viewToday(){
  var list=todayList(),k=dkey(),need=list.length,done=sentCount(k),d=new Date();
  var h='<div class="card hero"><div class="mute">'+DAYN[d.getDay()]+' · '+esc(hijri())+'</div><h1>رسائل اليوم 🌙</h1>'
   +'<div class="mute">'+(done>=need?'أحسنت! أرسلت رسائل اليوم كلها — جزاك الله خيراً.':'أرسل '+ar(need)+' رسائل اليوم إلى مجتمع «السنة الغراء».')+'</div>'
   +'<div class="prog"><i style="width:'+Math.round(done/need*100)+'%"></i></div>'
   +'<div class="stats"><div class="stat"><b>'+ar(done)+'/'+ar(need)+'</b><small>أُرسل اليوم</small></div><div class="stat"><b>'+ar(streak())+'</b><small>أيام متتالية</small></div><div class="stat"><b>'+ar(totalSent())+'</b><small>مجموع المرسَل</small></div></div></div>';
  h+='<div class="row" style="margin:0 0 4px"><button class="btn pri" id="allShare">📲 شارك صور اليوم دفعة واحدة</button><a class="btn" href="'+esc(C.link)+'" target="_blank" rel="noopener">💬 افتح المجتمع في واتساب</a></div>';
  list.forEach(function(it){
    var r=ROWS[it.idx],sent=isSent(k,it.slot);
    var ci=canImg(it.idx),pp=refParts(r);
    h+='<div class="card msg" data-slot="'+it.slot+'" data-i="'+it.idx+'">'+(ci?'<div class="pv" id="pv'+it.slot+'"></div>':'<div class="textpv"><div class="k">'+esc(pp.kind+(r[7]?' — '+r[7]:''))+'</div><div class="tt">'+esc(r[2])+'</div><div class="sr">'+esc(pp.srcTxt)+'</div></div>')+'<div class="body">'
     +'<span class="chip '+(it.type==='q'?'q':'')+'">'+esc(CATS[r[4]])+'</span> '+(sent?'<span class="done-badge">✓ أُرسلت</span>':'')
     +'<div class="row">'+(ci?'<button class="btn pri sm" data-a="img">📲 صورة</button>':'')+'<button class="btn '+(ci?'':'pri ')+'sm" data-a="txt">📝 '+(ci?'نص':'مشاركة كنص')+'</button><button class="btn sm" data-a="cp">📋 نسخ</button>'
     +'<button class="btn sm '+(sent?'':'ok')+'" data-a="sent">'+(sent?'↩︎ إلغاء الإرسال':'✅ تم الإرسال')+'</button><button class="btn sm" data-a="swap">🔄 بدّلها</button></div>'+(ci?swHtml(it.idx):'')+'</div></div>';
  });
  h+='<div class="note">اضغط «صورة» ثم اختر واتساب ثم مجتمع «السنة الغراء». الرسائل مأخوذة من صحيح البخاري وصحيح مسلم والمصحف، ويُختم كل تصميم بعبارة «'+esc(C.sig)+'».</div>';
  app.innerHTML=h;
  loadFonts().then(function(){list.forEach(function(it){var pv=document.getElementById('pv'+it.slot);if(pv){pv.innerHTML='';pv.appendChild(render(it.idx))}})});
  document.getElementById('allShare').onclick=async function(){
    var im=list.filter(function(x){return canImg(x.idx)});
    var ok=await shareImages(im.map(function(x){return x.idx}));
    if(ok){im.forEach(function(x){setSent(x.slot,true)});toast('سُجّلت كمُرسلة ✓ — الرسائل النصية أرسلها بزر «مشاركة كنص»');viewToday()}
  };
  [].forEach.call(app.querySelectorAll('.msg'),function(el){
    var slot=+el.dataset.slot,idx=+el.dataset.i;
    el.onclick=async function(e){
      var b=e.target.closest('button');if(!b)return;var a=b.dataset.a,ok;
      if(a==='img'){ok=await shareImages([idx]);if(ok){setSent(slot,true);toast('سُجّلت كمُرسلة ✓');viewToday()}}
      else if(a==='txt'){ok=await shareText(idx);if(ok){setSent(slot,true);viewToday()}}
      else if(a==='cp')copyText(idx);
      else if(a==='sent'){setSent(slot,!isSent(k,slot));viewToday()}
      else if(a==='swap'){swapSlot(slot);viewToday()}
      else if(a==='th'){setTheme(idx,b.dataset.th);viewToday()}
    };
  });
}

/* ===== واجهة: المكتبة ===== */
var NORM=null;
function nrm(s){return s.replace(/[ؐ-ًؚ-ٰٟۖ-ۭـ‏]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')}
var LF={q:'',cat:-1,t:'',lim:30};
function viewLib(){
  if(!NORM)NORM=ROWS.map(function(r){return nrm(r[2])});
  var h='<h1>المكتبة 📚</h1><div class="mute">'+ar(ROWS.length)+' رسالة: أحاديث من البخاري ومسلم، آيات، قصص صحيحة، ودرر من أقوال السلف — ابحث أو اختر تصنيفاً.</div>'
   +'<div class="f"><input type="search" id="q" placeholder="ابحث في النصوص…" value="'+esc(LF.q)+'"></div>'
   +'<div class="tabs" id="tt"><a class="tab '+(LF.t===''?'on':'')+'" data-t="">الكل</a><a class="tab '+(LF.t==='h'?'on':'')+'" data-t="h">أحاديث</a><a class="tab '+(LF.t==='q'?'on':'')+'" data-t="q">آيات</a><a class="tab '+(LF.t==='s'?'on':'')+'" data-t="s">قصص</a><a class="tab '+(LF.t==='d'?'on':'')+'" data-t="d">درر</a></div>'
   +'<div class="tabs" id="cc"><a class="tab '+(LF.cat<0?'on':'')+'" data-c="-1">كل التصنيفات</a>'+CATS.map(function(c,i){return '<a class="tab '+(LF.cat===i?'on':'')+'" data-c="'+i+'">'+esc(c)+'</a>'}).join('')+'</div>'
   +'<div id="res"></div>';
  app.innerHTML=h;drawRes();
  var q=document.getElementById('q');q.oninput=function(){LF.q=q.value;LF.lim=30;drawRes()};
  document.getElementById('tt').onclick=function(e){var a=e.target.closest('.tab');if(!a)return;LF.t=a.dataset.t;LF.lim=30;viewLib()};
  document.getElementById('cc').onclick=function(e){var a=e.target.closest('.tab');if(!a)return;LF.cat=+a.dataset.c;LF.lim=30;viewLib()};
}
function drawRes(){
  var qn=nrm(LF.q.trim()),out=[];
  for(var i=0;i<ROWS.length;i++){var r=ROWS[i];if(LF.t&&r[0]!==LF.t)continue;if(LF.cat>=0&&r[4]!==LF.cat)continue;if(qn&&NORM[i].indexOf(qn)<0&&nrm(r[3]).indexOf(qn)<0)continue;out.push(i)}
  var el=document.getElementById('res'),h='<div class="mute" style="margin:8px 0">'+ar(out.length)+' نتيجة</div>';
  if(!out.length)h+='<div class="empty">لا توجد نتائج</div>';
  out.slice(0,LF.lim).forEach(function(i){
    var r=ROWS[i],p=refParts(r);
    h+='<div class="card lib-item" data-i="'+i+'"><span class="chip '+(r[0]==='q'?'q':'')+'">'+esc(CATS[r[4]])+'</span>'
     +(r[7]?'<b>'+esc(r[7])+'</b>':'')+'<div class="t '+(r[0]==='q'?'q':'')+'">'+(r[0]==='q'?'﴿ '+esc(r[2])+' ﴾':(r[0]==='d'?'« '+esc(r[2])+' »':esc(r[2])))+'</div><div class="src">'+esc(r[0]==='d'?r[1]+' — ':(p.who&&r[0]==='h'?p.who+' — ':''))+esc(p.srcTxt)+(r[0]==='h'&&r[1]==='البخاري'&&r[5]?' — رقم '+ar(r[5]):'')+'</div>'
     +'<div class="row">'+(canImg(i)?'<button class="btn pri sm" data-a="pv">🖼️ معاينة وإرسال</button>':'<button class="btn pri sm" data-a="tx">📝 مشاركة كنص</button>')+'<button class="btn sm" data-a="cp">📋 نسخ</button></div></div>';
  });
  if(out.length>LF.lim)h+='<div style="text-align:center"><button class="btn" id="more">عرض المزيد</button></div>';
  el.innerHTML=h;
  var m=document.getElementById('more');if(m)m.onclick=function(){LF.lim+=30;drawRes()};
  el.onclick=function(e){var b=e.target.closest('button');if(!b||b.id==='more')return;var i=+b.closest('.lib-item').dataset.i;if(b.dataset.a==='cp')copyText(i);else if(b.dataset.a==='pv')openPv(i);else if(b.dataset.a==='tx')shareText(i)};
}
function openPv(i){
  var box=document.getElementById('box'),m=document.getElementById('modal');
  box.innerHTML='<div id="mpv"></div><div class="body"><div id="msw">'+swHtml(i)+'</div><div class="row" style="margin-top:12px"><button class="btn pri sm" data-a="img">📲 صورة</button><button class="btn sm" data-a="txt">📝 نص</button><button class="btn sm" data-a="cp">📋 نسخ</button><button class="btn sm" data-a="x">إغلاق</button></div></div>';
  m.classList.add('on');
  loadFonts().then(function(){var p=document.getElementById('mpv');if(p)p.appendChild(render(i))});
  box.onclick=function(e){var b=e.target.closest('button');if(!b)return;var a=b.dataset.a;
    if(a==='th'){setTheme(i,b.dataset.th);document.getElementById('msw').innerHTML=swHtml(i);var p2=document.getElementById('mpv');p2.innerHTML='';p2.appendChild(render(i));return}
    if(a==='x')m.classList.remove('on');else if(a==='img')shareImages([i]);else if(a==='txt')shareText(i);else if(a==='cp')copyText(i)};
  m.onclick=function(e){if(e.target===m)m.classList.remove('on')};
}

/* ===== واجهة: الإعدادات والتذكير ===== */
function ics(){
  var base=location.href.split('#')[0],now=new Date(),st=dkey(now).replace(/-/g,''),stamp=now.toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Marsa//Sunna//AR','CALSCALE:GREGORIAN'];
  C.times.forEach(function(t,i){
    var hm=t.replace(':','')+'00';
    L.push('BEGIN:VEVENT','UID:sunna-'+(i+1)+'@marsa','DTSTAMP:'+stamp,'DTSTART:'+st+'T'+hm,'DURATION:PT10M','RRULE:FREQ=DAILY',
      'SUMMARY:🌙 السنة الغراء — رسالة '+ar(i+1),'DESCRIPTION:افتح مرسى ثم السنة الغراء وأرسل رسالتك إلى المجتمع','URL:'+base,
      'BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:🌙 وقت رسائل السنة الغراء','END:VALARM','END:VEVENT');
  });
  L.push('END:VCALENDAR');return L.join('\r\n');
}
function viewSet(){
  var h='<h1>الإعدادات ⚙️</h1>'
   +'<div class="card"><h2>التذكير اليومي</h2><div class="mute">يضيف ٣ تذكيرات متكررة كل يوم في تقويم الآيفون، وعند ضغط التنبيه يفتح هذه الصفحة.</div>'
   +'<div class="f"><label>أوقات التذكير</label><div class="times">'+C.times.map(function(t,i){return '<input type="time" data-ti="'+i+'" value="'+t+'">'}).join('')+'</div></div>'
   +'<button class="btn pri" id="icsb">🔔 أضف التذكيرات إلى التقويم</button></div>'
   +'<div class="card"><h2>الرسائل</h2><div class="f"><label>التوزيع اليومي</label><select id="mix">'+Object.keys(MIXES).map(function(k){return '<option value="'+k+'"'+(C.mix===k?' selected':'')+'>'+MIXES[k].n+'</option>'}).join('')+'</select></div>'
   +'<div class="f"><label>نموذج التصميم الافتراضي</label><select id="thm">'+THEMES.map(function(t){return '<option value="'+t.id+'"'+(C.theme===t.id?' selected':'')+'>'+t.n+'</option>'}).join('')+'<option value="rot"'+(C.theme==='rot'?' selected':'')+'>تبديل تلقائي بين النماذج</option></select></div>'
   +'<div class="f"><label>عبارة الحقوق أسفل التصميم</label><input type="text" id="sig" value="'+esc(C.sig)+'"></div>'
   +'<div class="f"><label>رابط المجتمع</label><input type="text" id="lnk" value="'+esc(C.link)+'" style="direction:ltr"></div></div>'
   +'<div class="card"><h2>معلومات</h2><div class="mute">المكتبة: '+ar(POOL.h.length)+' حديثاً (البخاري ومسلم) و'+ar(POOL.q.length)+' آية و'+ar(POOL.s.length)+' قصة صحيحة و'+ar(POOL.d.length)+' درّة — الأحاديث والآيات تكفي نحو '+ar(Math.floor(ROWS.length/3))+' يوماً بدون تكرار. حالة «تم الإرسال» محفوظة على هذا الجهاز.</div>'
   +'<div class="row"><button class="btn sm" id="rst">إعادة ضبط سجل الإرسال</button></div></div>';
  app.innerHTML=h;
  [].forEach.call(app.querySelectorAll('input[type=time]'),function(el){el.onchange=function(){C.times[+el.dataset.ti]=el.value||C.times[+el.dataset.ti];save()}});
  document.getElementById('mix').onchange=function(){C.mix=this.value;save();toast('تم الحفظ ✓')};
  document.getElementById('thm').onchange=function(){C.theme=this.value;S.th={};save();toast('تم الحفظ ✓')};
  document.getElementById('sig').onchange=function(){C.sig=this.value.trim()||'السنة الغراء';save();toast('تم الحفظ ✓')};
  document.getElementById('lnk').onchange=function(){C.link=this.value.trim()||COMMUNITY;save();toast('تم الحفظ ✓')};
  document.getElementById('icsb').onclick=function(){download(new File([ics()],'sunna-reminders.ics',{type:'text/calendar'}));toast('افتح الملف ثم اضغط «إضافة الكل»')};
  document.getElementById('rst').onclick=function(){if(confirm('مسح سجل «تم الإرسال» من هذا الجهاز؟')){S.sent={};S.sw={};S.rp={h:0,q:0};save();toast('تمت إعادة الضبط')}};
}

/* ===== التوجيه ===== */
function route(){
  var h=(location.hash||'#today').slice(1);
  if(h==='lib')viewLib();else if(h==='set')viewSet();else viewToday();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();
})();
</script>
