<script>
(function(){

/* ===== الصلاحية: القسم خاص بعلي ===== */

var allowed=U&&(U.role==='hr'||/علي|Ali/i.test(U.name||''));

/* ===== البيانات ===== */
var D=window.SUNNA, ROWS=D.rows, CATS=D.cats;
var POOL={h:[],q:[],s:[],d:[],w:[],k:[]};ROWS.forEach(function(r,i){if(POOL[r[0]])POOL[r[0]].push(i)});

/* ===== الحالة (على هذا الجهاز) ===== */
var MIXES={E:{n:'آية + حديث + فائدة من كتب العلماء',s:['q','h','k']},A:{n:'آية + حديثان',s:['q','h','h']},B:{n:'ثلاثة أحاديث',s:['h','h','h']},C:{n:'ثلاث آيات',s:['q','q','q']},D:{n:'متنوع: آية + حديث + (قصة أو درّة أو حكمة بالتناوب)',s:['q','h','x']}};
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
var S=load();S.sent=S.sent||{};S.sw=S.sw||{};S.rp=S.rp||{h:0,q:0,s:0,d:0,w:0};
S.cfg=S.cfg||{};var C=S.cfg;C.sig=C.sig||'السنة الغراء';C.mix=C.mix||'A';C.times=C.times||['08:00','13:30','19:30'];C.link=C.link||COMMUNITY;C.theme=C.theme||'rot';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
save();

function pad(n){return ('0'+n).slice(-2)}
function dkey(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function dayNo(d){d=d||new Date();return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(2026,10,8))/864e5)}
function mod(a,n){return ((a%n)+n)%n}

/* رسائل اليوم: ترتيب ثابت لكل يوم (نفس الرسائل على أي جهاز) */
function todayList(){
  var n=dayNo(), slots=MIXES[C.mix].s.map(function(t){return t==='x'?['s','d','w','k'][mod(n,4)]:t}), k=dkey(), out=[], cnt={h:0,q:0,s:0,d:0,w:0,k:0}, seen={h:0,q:0,s:0,d:0,w:0,k:0};
  slots.forEach(function(t){cnt[t]++});
  slots.forEach(function(t,i){
    var idx=POOL[t][mod(n*cnt[t]+seen[t],POOL[t].length)];seen[t]++;
    var sw=S.sw[k+'|'+i];if(sw!=null&&ROWS[sw])idx=sw;
    out.push({slot:i,idx:idx,type:t});
  });
  return out;
}
function swapSlot(slot){
  var list=todayList(),cur=list[slot],t=cur.type,used={};list.forEach(function(x){used[x.idx]=1});
  var p=POOL[t],g=0,idx;
  do{idx=p[mod(p.length-1-(S.rp[t]||0),p.length)];S.rp[t]=(S.rp[t]||0)+1;g++}while(used[idx]&&g<50);
  S.sw[dkey()+'|'+slot]=idx;
  delete (S.sent[dkey()]||{})[slot];
  save();
}
function isSent(k,slot){return !!(S.sent[k]&&S.sent[k][slot])}
function setSent(slot,v){var k=dkey();S.sent[k]=S.sent[k]||{};if(v){var it=todayList()[slot];S.sent[k][slot]=it?{i:it.idx}:1}else delete S.sent[k][slot];save()}
function sentCount(k){return S.sent[k]?Object.keys(S.sent[k]).length:0}
function totalSent(){var t=0;for(var k in S.sent)t+=Object.keys(S.sent[k]).length;return t}
function streak(){var n=0,d=new Date();var need=MIXES[C.mix].s.length;for(;;){var c=sentCount(dkey(d));if(c>=need){n++}else if(!(n===0&&dkey(d)===dkey())){break}d.setDate(d.getDate()-1);if(n>2000)break}return n}

/* ===== نصوص الرسالة ===== */
function refParts(r){
  if(r[0]==='u')return {lead:r[6],who:'',src:r[1],srcTxt:r[1],kind:r[3],foot:''};
  if(r[0]==='q'){var rg=r[6]?('الآيات '+ar(r[5])+'–'+ar(r[6])):('الآية '+ar(r[5]));return {lead:'قَالَ اللَّهُ تَعَالَى:',who:'',src:'سورة '+r[3]+' · '+rg,srcTxt:'سورة '+r[3]+'، '+rg,kind:r[7]||'آيات كريمة',foot:'المصحف المرتّل برواية حفص عن عاصم'}}
  if(r[0]==='s')return {lead:r[8]||'قَالَ رَسُولُ اللَّهِ ﷺ:',who:r[7],src:'رواه '+r[1]+' · كتاب '+r[3],srcTxt:'رواه '+r[1]+' — كتاب '+r[3],kind:'قصة من السنة',foot:'من الصحيحين · تحرّي الصحة والتوثيق'};
  if(r[0]==='k'){var by=(r[7]||'').replace(/ ?\(.*\)$/,'');return {lead:by?(by.indexOf('من ')===0?'وقد قيل:':'قال '+by+':'):'قال ابن القيم رحمه الله:',who:'',src:(by?'نقله ابن القيم في ':'ابن القيم · ')+'«'+r[1]+'» ص '+ar(r[5]),srcTxt:(by?'نقله ابن القيم في ':'ابن القيم، ')+'«'+r[1]+'» ص '+ar(r[5])+' (ط. عالم الفوائد)',kind:'فوائد من كتب العلماء',foot:''}}
  if(r[0]==='w')return {lead:'',who:'',src:'من الحِكَم والمواعظ',srcTxt:'من الحِكَم والمواعظ',kind:'اقتباس إيماني',foot:'كلمات تُذكِّر وتُهذِّب'};
  if(r[0]==='d')return {lead:'قَالَ '+r[1]+':',who:'',src:'المصدر: '+r[3],srcTxt:'المصدر: '+r[3],kind:'دُرَّة من الدُّرَر',foot:'من أقوال السلف الصالح'};
  var who=r[6]?('عَنْ '+r[6]):'';
  return {lead:'قَالَ رَسُولُ اللَّهِ ﷺ:',who:who,src:'رواه '+r[1]+' · كتاب '+r[3],srcTxt:'رواه '+r[1]+' — كتاب '+r[3],kind:'حديث شريف',foot:'من الصحيحين · تحرّي الصحة والتوثيق'};
}
function noteOf(i){var t=ROWS[i][0];return t==='d'?'⚠️ تنبيه: هذا قول مأثور عن السلف — راجع المصدر المذكور قبل نشره.':(t==='w'?'ℹ️ عبارة وعظية عامة، ليست حديثاً ولا آية، ولا تُنسب لأحد.':'')}
function canImg(i){var r=ROWS[i];return r[2].length<=820}
function msgText(i){
  var r=ROWS[i],p=refParts(r),t;
  if(r[0]==='u')t=(r[7]?r[7]+'\n\n':'')+(r[6]?r[6]+'\n':'')+(r[8]==='q'?'﴿ '+r[2]+' ﴾':'«'+r[2]+'»')+(r[1]?'\n\n📚 '+r[1]:'');
  else if(r[0]==='q')t=(r[7]?'🤲 '+r[7]+'\n\n':'')+'قال الله تعالى:\n﴿ '+r[2]+' ﴾\n\n📖 '+p.srcTxt;
  else if(r[0]==='s')t='📖 '+r[7]+'\n\n'+p.lead.replace('ﷺ:','ﷺ:')+'\n«'+r[2]+'»\n\n📚 '+p.srcTxt;
  else if(r[0]==='w')t='✨ «'+r[2]+'»\n\n📚 '+p.srcTxt;
  else if(r[0]==='k')t='📚 فوائد من كتب العلماء'+(r[6]?' — '+r[6]:'')+'\n\n'+p.lead+'\n«'+r[2]+'»\n\n📖 '+p.srcTxt;
  else if(r[0]==='d')t=p.lead+'\n«'+r[2]+'»\n\n📚 '+p.srcTxt;
  else t=(p.who?p.who+'\n':'')+'قال رسول الله ﷺ:\n«'+r[2]+'»\n\n📚 '+p.srcTxt;

/* ===== الخطوط ===== */
var fontsReady=null;
function loadFonts(){
  if(fontsReady)return fontsReady;
  var list=['700 60px SunnaAmiri','400 40px SunnaAmiri','400 40px SunnaQuran','500 30px SunnaPlex','700 30px SunnaPlex'];

/* ===== التصميم الموحّد: يرسم الصورة 1080×1350 ===== */
var W=1080,H=1350;
var THEMES=[
 {id:'z',n:'زمردي',bg:['#0C4433','#061F18'],glow:'rgba(60,150,115,.28)',gold:'#D9B45F',text:'#F8F1DC',soft:'#A9C9B9',frame:'ornate',pat:'stars',pa:.075},
 {id:'l',n:'ليلي',bg:['#10224A','#070F26'],glow:'rgba(90,120,220,.25)',gold:'#E3C170',text:'#F4F1E6',soft:'#A9B8DC',frame:'ornate',pat:'dots',pa:.16},
 {id:'r',n:'رملي',bg:['#FBF4E3','#EDDDB5'],glow:'rgba(255,255,255,.7)',gold:'#9C6F1A',text:'#1F3A2E',soft:'#6B6A4E',frame:'ornate',pat:'stars',pa:.1},
 {id:'w',n:'عنابي',bg:['#5A1426','#2B0812'],glow:'rgba(210,90,110,.22)',gold:'#E8C27A',text:'#FBEFE0',soft:'#D8A9B3',frame:'ornate',pat:'stars',pa:.07},
 {id:'f',n:'أسود ذهبي',bg:['#161616','#050505'],glow:'rgba(255,255,255,.05)',gold:'#D4AF5A',text:'#F5EFE0',soft:'#9A968A',frame:'thin',pat:'none',pa:0},
 {id:'b',n:'بحري',bg:['#0F5C63','#083038'],glow:'rgba(120,210,200,.22)',gold:'#F0CF85',text:'#F4FBF9',soft:'#A7D4D4',frame:'thin',pat:'dots',pa:.14},
 {id:'a',n:'أبيض',bg:['#FFFFFF','#EEF3F0'],glow:'rgba(255,255,255,0)',gold:'#0E5A44',text:'#10292B',soft:'#5E7475',frame:'thin',pat:'none',pa:0}
];
function themeOf(i){
  var id=S.th&&S.th[i];if(!id&&C.theme==='rot')return THEMES[mod(i,THEMES.length)];
  id=id||C.theme||'z';for(var k=0;k<THEMES.length;k++)if(THEMES[k].id===id)return THEMES[k];return THEMES[0];
}
function octagram(x,cx,cy,r,fill){
  for(var k=0;k<2;k++){
    x.beginPath();
    for(var j=0;j<4;j++){var a=Math.PI/4*k+Math.PI/2*j+Math.PI/4,px=cx+r*Math.cos(a),py=cy+r*Math.sin(a);if(j===0)x.moveTo(px,py);else x.lineTo(px,py)}
    x.closePath();if(fill)x.fill();else x.stroke();
  }
}
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function wrap(x,text,maxW){
  var words=text.split(/\s+/),lines=[],cur='';
  for(var i=0;i<words.length;i++){var t=cur?cur+' '+words[i]:words[i];if(x.measureText(t).width>maxW&&cur){lines.push(cur);cur=words[i]}else cur=t}
  if(cur)lines.push(cur);return lines;
}
var LAY=[{id:'c',n:'كلاسيكي',ic:'▤'},{id:'r',n:'جانبي',ic:'▥'},{id:'p',n:'بطاقة',ic:'▣'},{id:'m',n:'بارز',ic:'◫'},{id:'ph',n:'صورة طبيعية',ic:'🏞'}];

var BGIMGS=[],BGEL={};
try{BGIMGS=JSON.parse(localStorage.getItem('sunna_bg')||'[]')}catch(e){BGIMGS=[]}
function bgImgEl(k){if(BGEL[k])return BGEL[k];var im=new Image();im.src=BGIMGS[k];BGEL[k]=im;return im}

async function shareText(i){
  var t=msgText(i);
  try{if(navigator.share){await navigator.share({text:t});return true}}catch(e){if(e&&e.name==='AbortError')return null}
  window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');return false;
}
async function copyImage(i){
  try{
    await loadFonts();
    var item=new ClipboardItem({'image/png':blobOf(render(i))});
    await navigator.clipboard.write([item]);toast('تم نسخ الصورة ✓ — الصقها في واتساب');
  }catch(e){toast('متصفحك لا يدعم نسخ الصورة — استخدم زر «صورة»')}
}
function copyText(i){
  var t=msgText(i);
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast('تم النسخ ✓')},fb)}else fb();
  function fb(){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity=0;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('تم النسخ ✓')}catch(e){toast('تعذّر النسخ')}a.remove()}
}

/* ===== واجهة: اليوم ===== */
var DAYN=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
function hijri(){try{return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'}).format(new Date())}catch(e){return ''}}
function swHtml(i){return swHtml0(i)+bgSwHtml(i)}
function swHtml0(i){
  var cur=themeOf(i).id;
  var cl=layoutOf(i).id;
  return '<div class="sws"><small>الألوان:</small>'+THEMES.map(function(t){return '<button class="sw'+(t.id===cur?' on':'')+'" data-a="th" data-th="'+t.id+'" title="'+t.n+'" style="background:linear-gradient(135deg,'+t.bg[0]+' 55%,'+t.gold+' 56%)"></button>'}).join('')+'</div><div class="sws"><small>الشكل:</small>'+LAY.map(function(l){return '<button class="btn sm'+(l.id===cl?' pri':'')+'" data-a="ly" data-ly="'+l.id+'">'+l.ic+' '+l.n+'</button>'}).join('')+'</div>';
}
function setTheme(i,id){S.th=S.th||{};S.th[i]=id;save()}
function setLay(i,id){S.ly=S.ly||{};S.ly[i]=id;save()}
function viewToday(){
  var list=todayList(),k=dkey(),need=list.length,done=sentCount(k),d=new Date();
  var h='<div class="card hero"><div class="mute">'+DAYN[d.getDay()]+' · '+esc(hijri())+'</div><h1>رسائل اليوم 🌙</h1>'
   +'<div class="mute">'+(done>=need?'أحسنت! أرسلت رسائل اليوم كلها — جزاك الله خيراً.':'أرسل '+ar(need)+' رسائل اليوم إلى مجتمع «السنة الغراء».')+'</div>'
   +'<div class="prog"><i style="width:'+Math.round(done/need*100)+'%"></i></div>'
   +'<div class="stats"><div class="stat"><b>'+ar(done)+'/'+ar(need)+'</b><small>أُرسل اليوم</small></div><div class="stat"><b>'+ar(streak())+'</b><small>أيام متتالية</small></div><div class="stat"><b>'+ar(totalSent())+'</b><small>مجموع المرسَل</small></div></div></div>';
  h+='<div class="row" style="margin:0 0 4px"><button class="btn pri" id="allShare">📲 شارك صور اليوم دفعة واحدة</button><a class="btn" href="'+esc(C.link)+'" target="_blank" rel="noopener">💬 افتح المجتمع في واتساب</a></div>';
  list.forEach(function(it){
    var r=ROWS[it.idx],sent=isSent(k,it.slot);
    var ci=canImg(it.idx),pp=refParts(r);
    h+='<div class="card msg" data-slot="'+it.slot+'" data-i="'+it.idx+'">'+(ci?'<div class="pv" id="pv'+it.slot+'"></div>':'<div class="textpv"><div class="k">'+esc(pp.kind+(r[7]?' — '+r[7]:''))+'</div><div class="tt">'+esc(r[2])+'</div><div class="sr">'+esc(pp.srcTxt)+'</div></div>')+'<div class="body">'
     +'<span class="chip '+(it.type==='q'?'q':'')+'">'+esc(CATS[r[4]])+'</span> '+'<span class="src">'+esc(pp.foot)+'</span> '+(sent?'<span class="done-badge">✓ أُرسلت</span>':'')
     +'<div class="row">'+(ci?'<button class="btn pri sm" data-a="img">📲 صورة</button><button class="btn sm" data-a="ci">🖼️ نسخ الصورة</button>':'')+'<button class="btn '+(ci?'':'pri ')+'sm" data-a="txt">📝 '+(ci?'نص':'مشاركة كنص')+'</button><button class="btn sm" data-a="cp">📋 نسخ النص</button>'
     +'<button class="btn sm '+(sent?'':'ok')+'" data-a="sent">'+(sent?'↩︎ إلغاء الإرسال':'✅ تم الإرسال')+'</button><button class="btn sm" data-a="swap">🔄 بدّلها</button></div>'+(ci?swHtml(it.idx):'')+(noteOf(it.idx)?'<div class="note" style="margin-top:10px">'+noteOf(it.idx)+'</div>':'')+'</div></div>';
  });
  h+=todayExtras();
  h+='<div class="note">اضغط «صورة» ثم اختر واتساب ثم مجتمع «السنة الغراء». الرسائل مأخوذة من صحيح البخاري وصحيح مسلم والمصحف، ويُختم كل تصميم بعبارة «'+esc(C.sig)+'».</div>';
  app.innerHTML=h;bindTxt(app);
  loadFonts().then(function(){list.forEach(function(it){var pv=document.getElementById('pv'+it.slot);if(pv){pv.innerHTML='';pv.appendChild(render(it.idx))}})});
  document.getElementById('allShare').onclick=async function(){
    var im=list.filter(function(x){return canImg(x.idx)});
    var ok=await shareImages(im.map(function(x){return x.idx}));
    if(ok){im.forEach(function(x){setSent(x.slot,true)});toast('سُجّلت كمُرسلة ✓ — الرسائل النصية أرسلها بزر «مشاركة كنص»');viewToday()}
  };
  [].forEach.call(app.querySelectorAll('.msg'),function(el){
    var slot=+el.dataset.slot,idx=+el.dataset.i;
    el.onclick=async function(e){
      var b=e.target.closest('button');if(!b)return;var a=b.dataset.a,ok;
      if(a==='img'){ok=await shareImages([idx]);if(ok){setSent(slot,true);toast('سُجّلت كمُرسلة ✓');viewToday()}}
      else if(a==='txt'){ok=await shareText(idx);if(ok){setSent(slot,true);viewToday()}}
      else if(a==='cp')copyText(idx);
      else if(a==='sent'){setSent(slot,!isSent(k,slot));viewToday()}
      else if(a==='swap'){swapSlot(slot);viewToday()}
      else if(a==='th'){setTheme(idx,b.dataset.th);viewToday()}
      else if(a==='ly'){setLay(idx,b.dataset.ly);viewToday()}
      else if(a==='bg'){S.bgp=S.bgp||{};S.bgp[idx]=+b.dataset.bg;save();viewToday()}
      else if(a==='ci')copyImage(idx)
    };
  });
}

/* ===== واجهة: المكتبة ===== */
var NORM=null;
function nrm(s){return s.replace(/[ؐ-ًؚ-ٰٟۖ-ۭـ‏]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')}
var LF={q:'',cat:-1,t:'',lim:30};
function viewLib(){
  if(!NORM)NORM=ROWS.map(function(r){return nrm(r[2])});
  var h='<h1>المكتبة 📚</h1><div class="mute">'+ar(ROWS.length)+' رسالة: أحاديث من البخاري ومسلم، آيات، قصص صحيحة، ودرر من أقوال السلف — ابحث أو اختر تصنيفاً.</div>'
   +'<div class="f"><input type="search" id="q" placeholder="ابحث في النصوص…" value="'+esc(LF.q)+'"></div>'
   +'<div class="tabs" id="tt"><a class="tab '+(LF.t===''?'on':'')+'" data-t="">الكل</a><a class="tab '+(LF.t==='h'?'on':'')+'" data-t="h">أحاديث</a><a class="tab '+(LF.t==='q'?'on':'')+'" data-t="q">آيات</a><a class="tab '+(LF.t==='s'?'on':'')+'" data-t="s">قصص</a><a class="tab '+(LF.t==='d'?'on':'')+'" data-t="d">درر</a><a class="tab '+(LF.t==='w'?'on':'')+'" data-t="w">حِكَم</a><a class="tab '+(LF.t==='k'?'on':'')+'" data-t="k">كتب العلماء</a></div>'
   +'<div class="tabs" id="cc"><a class="tab '+(LF.cat<0?'on':'')+'" data-c="-1">كل التصنيفات</a>'+CATS.map(function(c,i){return '<a class="tab '+(LF.cat===i?'on':'')+'" data-c="'+i+'">'+esc(c)+'</a>'}).join('')+'</div>'
   +'<div id="res"></div>';
  app.innerHTML=h;drawRes();
  var q=document.getElementById('q');q.oninput=function(){LF.q=q.value;LF.lim=30;drawRes()};
  document.getElementById('tt').onclick=function(e){var a=e.target.closest('.tab');if(!a)return;LF.t=a.dataset.t;LF.lim=30;viewLib()};
  document.getElementById('cc').onclick=function(e){var a=e.target.closest('.tab');if(!a)return;LF.cat=+a.dataset.c;LF.lim=30;viewLib()};
}
function drawRes(){
  var qn=nrm(LF.q.trim()),out=[];
  for(var i=0;i<NORM.length;i++){var r=ROWS[i];if(r[0]==='u')continue;if(LF.t&&r[0]!==LF.t)continue;if(LF.cat>=0&&r[4]!==LF.cat)continue;if(qn&&NORM[i].indexOf(qn)<0&&nrm(r[3]).indexOf(qn)<0)continue;out.push(i)}
  var el=document.getElementById('res'),h='<div class="mute" style="margin:8px 0">'+ar(out.length)+' نتيجة</div>';
  if(!out.length)h+='<div class="empty">لا توجد نتائج</div>';
  out.slice(0,LF.lim).forEach(function(i){
    var r=ROWS[i],p=refParts(r);
    h+='<div class="card lib-item" data-i="'+i+'"><span class="chip '+(r[0]==='q'?'q':'')+'">'+esc(CATS[r[4]])+'</span>'
     +(r[0]==='k'?'<b>📚 '+esc(r[6])+'</b>':(r[7]?'<b>'+esc(r[7])+'</b>':''))+'<div class="t '+(r[0]==='q'?'q':'')+'">'+(r[0]==='q'?'﴿ '+esc(r[2])+' ﴾':((r[0]==='d'||r[0]==='w'||r[0]==='k')?'« '+esc(r[2])+' »':esc(r[2])))+'</div><div class="src">'+(noteOf(i)?'<div style="color:#8A5A00;margin-bottom:4px">'+noteOf(i)+'</div>':'')+esc(r[0]==='d'?r[1]+' — ':(p.who&&r[0]==='h'?p.who+' — ':''))+esc(p.srcTxt)+(r[0]==='h'&&r[1]==='البخاري'&&r[5]?' — رقم '+ar(r[5]):'')+'</div>'
     +'<div class="row">'+(canImg(i)?'<button class="btn pri sm" data-a="pv">🖼️ معاينة وإرسال</button>':'<button class="btn pri sm" data-a="tx">📝 مشاركة كنص</button>')+'<button class="btn sm" data-a="cp">📋 نسخ</button><button class="btn sm" data-a="fv">'+(S.fav[favKey(i)]?'⭐ محفوظة':'☆ مفضلة')+'</button></div></div>';
  });
  if(out.length>LF.lim)h+='<div style="text-align:center"><button class="btn" id="more">عرض المزيد</button></div>';
  el.innerHTML=h;
  var m=document.getElementById('more');if(m)m.onclick=function(){LF.lim+=30;drawRes()};
  el.onclick=function(e){var b=e.target.closest('button');if(!b||b.id==='more')return;var i=+b.closest('.lib-item').dataset.i;if(b.dataset.a==='fv'){b.textContent=toggleFav(i)?'⭐ محفوظة':'☆ مفضلة';toast('تم ✓')}else if(b.dataset.a==='cp')copyText(i);else if(b.dataset.a==='pv')openPv(i);else if(b.dataset.a==='tx')shareText(i)};
}
function openPv(i){
  var box=document.getElementById('box'),m=document.getElementById('modal');
  box.innerHTML='<div id="mpv"></div><div class="body"><div id="msw">'+swHtml(i)+'</div>'+(noteOf(i)?'<div class="note" style="margin-top:10px">'+noteOf(i)+'</div>':'')+'<div class="row" style="margin-top:12px"><button class="btn pri sm" data-a="img">📲 صورة</button><button class="btn sm" data-a="txt">📝 نص</button><button class="btn sm" data-a="ci">🖼️ نسخ الصورة</button><button class="btn sm" data-a="cp">📋 نسخ النص</button><button class="btn sm" data-a="x">إغلاق</button></div></div>';
  m.classList.add('on');
  loadFonts().then(function(){var p=document.getElementById('mpv');if(p)p.appendChild(render(i))});
  box.onclick=function(e){var b=e.target.closest('button');if(!b)return;var a=b.dataset.a;
    if(a==='th'||a==='ly'||a==='bg'){if(a==='th')setTheme(i,b.dataset.th);else if(a==='bg'){S.bgp=S.bgp||{};S.bgp[i]=+b.dataset.bg;save()}else setLay(i,b.dataset.ly);document.getElementById('msw').innerHTML=swHtml(i);var p2=document.getElementById('mpv');p2.innerHTML='';p2.appendChild(render(i));return}
    if(a==='x')m.classList.remove('on');else if(a==='img')shareImages([i]);else if(a==='ci')copyImage(i);else if(a==='txt')shareText(i);else if(a==='cp')copyText(i)};
  m.onclick=function(e){if(e.target===m)m.classList.remove('on')};
}

/* ===== واجهة: الإعدادات والتذكير ===== */
function ics(){
  var base=location.href.split('#')[0],now=new Date(),st=dkey(now).replace(/-/g,''),stamp=now.toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Marsa//Sunna//AR','CALSCALE:GREGORIAN'];
  C.times.forEach(function(t,i){
    var hm=t.replace(':','')+'00';
    L.push('BEGIN:VEVENT','UID:sunna-'+(i+1)+'@marsa','DTSTAMP:'+stamp,'DTSTART:'+st+'T'+hm,'DURATION:PT10M','RRULE:FREQ=DAILY',
      'SUMMARY:🌙 السنة الغراء — رسالة '+ar(i+1),'DESCRIPTION:افتح مرسى ثم السنة الغراء وأرسل رسالتك إلى المجتمع','URL:'+base,
      'BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:🌙 وقت رسائل السنة الغراء','END:VALARM','END:VEVENT');
  });
  [['5:30','🌅 أذكار الصباح'],['16:45','🌙 أذكار المساء']].forEach(function(e,i){
    var hm=e[0].replace(':','').padStart(4,'0')+'00';
    L.push('BEGIN:VEVENT','UID:sunna-ad'+i+'@marsa','DTSTAMP:'+stamp,'DTSTART:'+st+'T'+hm,'DURATION:PT10M','RRULE:FREQ=DAILY','SUMMARY:'+e[1]+' — السنة الغراء','DESCRIPTION:افتح الأذكار وانسخ النص وأرسله إلى المجتمع','URL:'+base+'#ad','BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:'+e[1],'END:VALARM','END:VEVENT');
  });
  [['FR','0900','🕌 جمعة مباركة — سورة الكهف والصلاة على النبي ﷺ','more/occ'],['SU,WE','2030','🍽️ تذكير المجتمع بصيام الاثنين/الخميس','more/occ'],['SA','1000','🏆 أرسل تحدّي الأسبوع','more/chal']].forEach(function(e,i){
    L.push('BEGIN:VEVENT','UID:sunna-w'+i+'@marsa','DTSTAMP:'+stamp,'DTSTART:'+st+'T'+e[1]+'00','DURATION:PT10M','RRULE:FREQ=WEEKLY;BYDAY='+e[0],'SUMMARY:'+e[2],'DESCRIPTION:افتح السنة الغراء وانسخ الرسالة الجاهزة','URL:'+base+'#'+e[3],'BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:'+e[2],'END:VALARM','END:VEVENT');
  });
  L.push('END:VCALENDAR');return L.join('\r\n');
}

var KREC=null,KURL={};
function khUrl(rec,n){
  var k=rec+'|'+n;
  if(KURL[k])return Promise.resolve(KURL[k]);
  if(rec.indexOf('i:')===0){var u='https://cdn.islamic.app/quran/audio-surah/'+rec.slice(2)+'/'+n+'.mp3';KURL[k]=u;return Promise.resolve(u)}
  return fetch('https://api.quran.com/api/v4/chapter_recitations/'+rec.slice(2)+'/'+n).then(function(r){return r.json()}).then(function(j){
    var u=j&&j.audio_file&&j.audio_file.audio_url;if(!u)throw new Error('no url');KURL[k]=u;return u});
}
function khTim(rec,n){
  if(rec.indexOf('q:')!==0)return Promise.resolve(null);
  return fetch('https://api.quran.com/api/v4/chapter_recitations/'+rec.slice(2)+'/'+n+'?segments=true').then(function(r){return r.json()}).then(function(j){
    var t=j&&j.audio_file&&j.audio_file.timestamps;if(!t||!t.length)return null;
    return t.map(function(x){return{v:+String(x.verse_key).split(':')[1],f:x.timestamp_from/1000,t:x.timestamp_to/1000}})}).catch(function(){return null});
}
function mmss(x){x=Math.round(x);var m=Math.floor(x/60),s=x%60;return ar(m)+':'+ar((s<10?'0':'')+s)}
function khParts(D,tm){
  var MAX=300,P=[];
  if(D<=MAX+5)return[{f:0,t:D,a:0,b:0}];
  if(tm&&tm.length){
    var cur={f:0,t:0,a:tm[0].v,b:tm[0].v};
    tm.forEach(function(x,i){
      if(x.t-cur.f>MAX&&cur.b>=cur.a&&i>0&&cur.t>cur.f){P.push(cur);cur={f:cur.t,t:x.t,a:x.v,b:x.v}}
      else{cur.t=x.t;cur.b=x.v}});
    cur.t=D;P.push(cur);return P;
  }
  var k=Math.ceil(D/MAX),w=D/k;
  for(var i=0;i<k;i++)P.push({f:i*w,t:(i+1)*w,a:0,b:0});
  return P;
}
function khRecs(){
  if(KREC)return Promise.resolve(KREC);

    var a=(j.reciters||[]).map(function(x){return{v:'q:'+x.id,n:(x.translated_name&&x.translated_name.name)||x.name}});
    KREC=a.length?a.concat(KFALL):KFALL;return KREC}).catch(function(){KREC=KFALL;return KREC});
}

function hj(d){
  try{var f=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'numeric',year:'numeric'}).formatToParts(d||new Date()),o={};
    f.forEach(function(p){if(p.type==='day')o.d=+p.value;if(p.type==='month')o.m=+p.value;if(p.type==='year')o.y=parseInt(p.value)});return o}catch(e){return {}}
}

/* ===== المسابقة اليومية ===== */
function rnd(seed){var x=Math.sin(seed*9301+49297)*233280;return x-Math.floor(x)}
function pickQ(n,filter){var c=[];for(var i=0;i<ROWS.length;i++)if(filter(ROWS[i]))c.push(i);return c.length?c[Math.floor(rnd(n)*c.length)]:-1}
var LET=['أ','ب','ج','د'];
function quizOf(n){
  var kind=mod(n,3),q,a,title;
  if(kind===0){
    var i=pickQ(n,function(r){return r[0]==='q'&&r[2].length<260&&nrm(r[2]).indexOf(nrm(r[3]))<0}),r=ROWS[i];
    var opts=[r[3]],k=1;while(opts.length<4&&k<400){var o=ROWS[pickQ(n*31+k,function(x){return x[0]==='q'})][3];if(opts.indexOf(o)<0)opts.push(o);k++}
    opts=shuffle(opts,n);
    title='في أي سورة وردت هذه الآيات؟';
    q='❓ مسابقة السنة الغراء\n\nفي أي سورة وردت هذه الآية الكريمة؟\n\n﴿ '+r[2]+' ﴾\n\n'+opts.map(function(o,j){return LET[j]+') سورة '+o}).join('\n');
    a='✅ إجابة المسابقة\n\nالآية من سورة '+r[3]+' — '+refParts(r).srcTxt.replace('سورة '+r[3]+'، ','')+'\n\nالإجابة الصحيحة: ('+LET[opts.indexOf(r[3])]+') سورة '+r[3]+'\n\nبارك الله في كل من شارك 🌷';
  }else if(kind===1){
    var i=pickQ(n,function(r){return r[0]==='h'&&r[2].length>=60&&r[2].length<=170&&(r[1]==='الأربعون النووية'||/الأخلاق|الرقائق|الذكر|الإيمان/.test(CATS[r[4]]))}),r=ROWS[i],w=r[2].split(' '),cut=Math.max(3,Math.round(w.length*0.5));
    title='أكمل الحديث الشريف';
    q='❓ مسابقة السنة الغراء\n\nأكمل الحديث الشريف:\nقال رسول الله ﷺ:\n«'+w.slice(0,cut).join(' ')+' …»\n\nاكتب التكملة في المجتمع ✍️';
    a='✅ إجابة المسابقة\n\nقال رسول الله ﷺ:\n«'+r[2]+'»\n\n📚 '+refParts(r).srcTxt+'\n\nبارك الله في كل من شارك 🌷';
  }else{
    var i=pickQ(n,function(r){return r[0]==='h'&&r[6]&&r[2].length<=220&&/الأخلاق|الرقائق|الذكر|الإيمان|الصلاة/.test(CATS[r[4]])}),r=ROWS[i];
    var names={};ROWS.forEach(function(x){if(x[0]==='h'&&x[6])names[x[6]]=(names[x[6]]||0)+1});
    var top=Object.keys(names).sort(function(p,q2){return names[q2]-names[p]}).slice(0,25);
    var opts=[r[6]],k=1;while(opts.length<4&&k<200){var o=top[Math.floor(rnd(n*17+k)*top.length)];if(opts.indexOf(o)<0)opts.push(o);k++}
    opts=shuffle(opts,n);
    title='من راوي الحديث؟';
    q='❓ مسابقة السنة الغراء\n\nمن الصحابي راوي هذا الحديث؟\n\nقال رسول الله ﷺ:\n«'+r[2]+'»\n\n'+opts.map(function(o,j){return LET[j]+') '+o}).join('\n');
    a='✅ إجابة المسابقة\n\nراوي الحديث: '+r[6]+'\n📚 '+refParts(r).srcTxt+'\n\nالإجابة الصحيحة: ('+LET[opts.indexOf(r[6])]+')\n\nبارك الله في كل من شارك 🌷';
  }
  return {title:title,q:sig(q),a:sig(a)};
}
function shuffle(a,n){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(rnd(n*7+i)*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

    x.fillStyle='rgba(255,255,255,.85)';x.font='500 24px SunnaPlex';x.fillText('بصوت الشيخ '+VREC[rc].n,VW/2,205);
    var txt='﴿\u00a0'+parts[cur]+'\u00a0﴾',size,lines,lh;
    for(size=58;size>=24;size-=2){x.font='400 '+size+'px '+fam;lines=wrap(x,txt,620);lh=size*1.9;if(lines.length*lh<=760)break}
    var al=Math.max(0,Math.min(1,(now-times[cur]+0.05)/0.5));x.globalAlpha=al;
    x.fillStyle='#FFFFFF';var y0=VH/2+20-lines.length*lh/2+lh/2;lines.forEach(function(l,k){x.fillText(l,VW/2,y0+k*lh)});x.globalAlpha=1;
    x.fillStyle='rgba(255,255,255,.8)';x.font='500 24px SunnaPlex';x.fillText('الآية '+ar(a0+cur),VW/2,1110);
    x.fillStyle='#F3D58A';x.font='700 44px SunnaAmiri';x.fillText(C.sig,VW/2,1180);x.shadowBlur=0;
    var pr=Math.min(1,now/total);x.fillStyle='rgba(255,255,255,.25)';x.fillRect(80,1230,VW-160,4);x.fillStyle='#F3D58A';x.fillRect(VW-80-(VW-160)*pr,1230,(VW-160)*pr,4);
    return now;
  }
  await loadFonts();
  return new Promise(function(res,rej){
    rec.onstop=function(){res({blob:new Blob(chunks,{type:(mime||'video/webm').split(';')[0]}),mime:mime})};
    rec.onerror=function(e){rej(e.error||e)};
    T0=ac.currentTime+0.25;frame();rec.start(1000);
    bufs.forEach(function(b,k){var src=ac.createBufferSource();src.buffer=b;src.connect(gain);src.start(T0+times[k])});
    (function loop(){var now=frame();onProg('جارٍ التسجيل… '+ar(Math.round(Math.min(100,now/total*100)))+'٪ (لا تغلق الصفحة)');
      if(now>=total){rec.stop();return}setTimeout(loop,33)})();
  });
}
function vidList(){var o=[];for(var i=0;i<ROWS.length;i++){var r=ROWS[i];if(r[0]==='q'&&r[9]&&r[2].length<=420)o.push(i)}return o}
function vidCaption(i,rc){var r=ROWS[i];return '🎬 تلاوة عطرة\n\n﴿ '+r[2]+' ﴾\n\n📖 '+refParts(r).srcTxt+'\n🎙️ بصوت الشيخ '+VREC[rc].n+'\n\n'+C.sig}
function moreVid(b){
  var L=vidList(),today=L[mod(dayNo(),L.length)];
  app.innerHTML=b+'<h1>مقاطع قرآنية 🎬</h1><div class="mute">'+ar(L.length)+' مقطعاً بآيات كاملة. اختر القارئ ثم «اصنع الفيديو»: يُركَّب الفيديو على جهازك (تلاوة + الآيات + خلفية) بمدة التلاوة، وجاهز لواتساب والحالة.</div>'
   +'<div class="card"><div class="f"><label>القارئ</label><select id="vrc">'+VREC.map(function(x,k){return '<option value="'+k+'"'+(S.vrec===k?' selected':'')+'>'+x.n+'</option>'}).join('')+'</select></div>'
   +'<div class="f"><label>الخلفية</label><select id="vbg"><option value="">تلقائي (تتغيّر مع كل مقطع)</option>'+SCENES.concat(BGIMGS.map(function(_,k){return 'صورتي '+ar(k+1)})).map(function(n,k){return '<option value="'+k+'"'+(S.vbg===k?' selected':'')+'>'+n+'</option>'}).join('')+'</select></div>'
   +'<label class="mute"><input type="checkbox" id="vmu"'+(S.vmute?' checked':'')+'> كتم الصوت أثناء التسجيل</label></div>'
   +'<div id="vres"></div>';
  document.getElementById('vrc').onchange=function(){S.vrec=+this.value;save()};
  document.getElementById('vbg').onchange=function(){S.vbg=this.value===''?null:+this.value;save()};
  document.getElementById('vmu').onchange=function(){S.vmute=this.checked;save()};
  var order=[today].concat(L.filter(function(i){return i!==today}));
  document.getElementById('vres').innerHTML=order.map(function(i,k){var r=ROWS[i];return '<div class="card lib-item" data-i="'+i+'">'+(k===0?'<span class="chip q">⭐ مقطع اليوم</span> ':'')+(S.vm[favKey(i)]?'<span class="done-badge">✓ صُنع</span>':'')
    +'<b>'+esc(refParts(r).srcTxt)+'</b><div class="t q" style="font-size:18px">﴿ '+esc(r[2].length>160?r[2].slice(0,160)+'…':r[2])+' ﴾</div><div class="row"><button class="btn pri sm" data-a="mk">🎬 اصنع الفيديو</button><button class="btn sm" data-a="cp">📋 نسخ النص</button></div></div>'}).join('');
  document.getElementById('vres').onclick=function(e){var bt=e.target.closest('button');if(!bt)return;var i=+bt.closest('.lib-item').dataset.i;
    if(bt.dataset.a==='cp')copyStr(vidCaption(i,S.vrec||0));else vidOpen(i)};
}
function vidOpen(i){
  var box=document.getElementById('box'),m=document.getElementById('modal'),rc=S.vrec||0;
  if(!vidMime()){toast('متصفحك لا يدعم صنع الفيديو — حدّث المتصفح');return}
  var AC=window.AudioContext||window.webkitAudioContext,ac=new AC();ac.resume&&ac.resume();
  box.innerHTML='<div class="body"><canvas id="vcv" style="width:100%;max-height:60vh;object-fit:contain;border-radius:14px;background:#000"></canvas><div class="mute" id="vst" style="margin:10px 0">يبدأ…</div><div class="row" id="vbt"><button class="btn sm" data-a="x">إغلاق</button></div></div>';
  m.classList.add('on');var cv=document.getElementById('vcv'),st=document.getElementById('vst'),busy=true;
  box.onclick=function(e){var b=e.target.closest('button');if(!b)return;if(b.dataset.a==='x'){if(busy&&!confirm('إيقاف صنع الفيديو؟'))return;busy=false;try{ac.close()}catch(_){}m.classList.remove('on')}};
  makeVideo(i,rc,ac,function(t){if(st)st.textContent=t},cv).then(function(res){
    busy=false;try{ac.close()}catch(_){}
    var ext=/mp4/.test(res.mime)?'mp4':'webm',r=ROWS[i],f=new File([res.blob],'quran-'+r[9]+'-'+r[5]+'.'+ext,{type:res.blob.type});
    S.vm[favKey(i)]=1;save();
    var url=URL.createObjectURL(f);
    cv.outerHTML='<video src="'+url+'" controls playsinline style="width:100%;max-height:60vh;border-radius:14px;background:#000"></video>';
    st.textContent='✓ الفيديو جاهز ('+ar(Math.round(res.blob.size/1024/1024*10)/10)+' م.ب)'+(ext==='webm'?' — صيغة WebM قد لا تُقبل في واتساب الآيفون':'');
    document.getElementById('vbt').innerHTML='<button class="btn pri sm" data-a="sh">📲 مشاركة</button><button class="btn sm" data-a="dl">⬇️ تنزيل</button><button class="btn sm" data-a="cp">📋 نسخ النص</button><button class="btn sm" data-a="x">إغلاق</button>';
    box.onclick=function(e){var b=e.target.closest('button');if(!b)return;var a=b.dataset.a;
      if(a==='x')m.classList.remove('on');else if(a==='dl')download(f);else if(a==='cp')copyStr(vidCaption(i,rc));
      else if(a==='sh'){if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(function(){});else{download(f);toast('تم التنزيل — أرسله من المعرض')}}};
  }).catch(function(e){busy=false;try{ac.close()}catch(_){}
    if(st)st.textContent='تعذّر صنع الفيديو: لم يُجلب صوت التلاوة من مواقع القرّاء ('+(e&&e.message||e)+'). جرّب قارئاً آخر أو تحقق من الإنترنت.'});
}

/* ===== التوجيه ===== */
function route(){
  var h=(location.hash||'#today').slice(1);
  var md=document.getElementById('modal');if(md)md.classList.remove('on');app.onclick=null;
  try{ go(h) }catch(e){
    app.innerHTML='<div class="card"><h2>حدث خطأ في الصفحة</h2><div class="mute">أرسل لقطة شاشة لهذه الرسالة:</div><pre style="direction:ltr;white-space:pre-wrap;font-size:12px">'+esc((e&&e.stack)||e)+'</pre><button class="btn" id="fix">إصلاح وإعادة المحاولة</button></div>';
    document.getElementById('fix').onclick=function(){S.sw={};S.th={};S.ly={};save();location.reload()};
  }
  window.scrollTo(0,0);
}
function go(h){
  if(h==='more'||h.indexOf('more/')===0)viewMore(h.split('/')[1]);else if(h==='ad')viewAd();else if(h==='kh')viewKh();else if(h==='lib')viewLib();else if(h==='set')viewSet();else viewToday();
  window.scrollTo(0,0);
}
window.SG={ROWS:ROWS,S:S,render:render,pickQ:pickQ,quizOf:quizOf};
window.addEventListener('hashchange',route);
route();
})();
</script>
