/* ===== المشاركة ===== */
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.className='toast on';clearTimeout(toast.t);toast.t=setTimeout(function(){t.className='toast'},2400)}
function blobOf(c){return new Promise(function(res){c.toBlob(res,'image/png')})}
async function fileOf(i,n){await loadFonts();var b=await blobOf(render(i));return new File([b],'sunna-'+dkey()+'-'+(n||1)+'.png',{type:'image/png'})}
function download(file){var a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500)}
async function shareImages(idxs){
  try{
    var files=[];for(var k=0;k<idxs.length;k++)files.push(await fileOf(idxs[k],k+1));
    if(navigator.canShare&&navigator.canShare({files:files})){await navigator.share({files:files});return true}
    files.forEach(download);toast('حُفظت الصورة — أرسلها من معرض الصور');return false;
  }catch(e){if(e&&e.name==='AbortError')return null;toast('تعذّرت المشاركة');return null}
}
async function shareText(i){
  var t=msgText(i);
  try{if(navigator.share){await navigator.share({text:t});return true}}catch(e){if(e&&e.name==='AbortError')return null}
  window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');return false;
}
async function copyImage(i){
  try{
    await loadFonts();
    var item=new ClipboardItem({'image/png':blobOf(render(i))});
    await navigator.clipboard.write([item]);toast('تم نسخ الصورة ✓ — الصقها في واتساب');
  }catch(e){toast('متصفحك لا يدعم نسخ الصورة — استخدم زر «صورة»')}
}
function copyText(i){
  var t=msgText(i);
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast('تم النسخ ✓')},fb)}else fb();
  function fb(){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity=0;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('تم النسخ ✓')}catch(e){toast('تعذّر النسخ')}a.remove()}
}

   +'<div class="card"><h2>التذكير اليومي</h2><div class="mute">يضيف ٣ تذكيرات متكررة كل يوم في تقويم الآيفون، وعند ضغط التنبيه يفتح هذه الصفحة.</div>'
   +'<div class="f"><label>أوقات التذكير</label><div class="times">'+C.times.map(function(t,i){return '<input type="time" data-ti="'+i+'" value="'+t+'">'}).join('')+'</div></div>'
   +'<button class="btn pri" id="icsb">🔔 أضف التذكيرات إلى التقويم</button></div>'
   +'<div class="card"><h2>الرسائل</h2><div class="f"><label>التوزيع اليومي</label><select id="mix">'+Object.keys(MIXES).map(function(k){return '<option value="'+k+'"'+(C.mix===k?' selected':'')+'>'+MIXES[k].n+'</option>'}).join('')+'</select></div>'
   +'<div class="f"><label>نموذج التصميم الافتراضي</label><select id="thm">'+THEMES.map(function(t){return '<option value="'+t.id+'"'+(C.theme===t.id?' selected':'')+'>'+t.n+'</option>'}).join('')+'<option value="rot"'+(C.theme==='rot'?' selected':'')+'>تبديل تلقائي بين النماذج</option></select></div>'
   +'<div class="f"><label>الشكل الافتراضي للتصميم</label><select id="lay"><option value="rot"'+((!C.layout||C.layout==='rot')?' selected':'')+'>تبديل تلقائي بين الأشكال</option>'+LAY.map(function(l){return '<option value="'+l.id+'"'+(C.layout===l.id?' selected':'')+'>'+l.n+'</option>'}).join('')+'</select></div>'
   +'<div class="f"><label>عبارة الحقوق أسفل التصميم</label><input type="text" id="sig" value="'+esc(C.sig)+'"></div>'
   +'<div class="f"><label>رابط المجتمع</label><input type="text" id="lnk" value="'+esc(C.link)+'" style="direction:ltr"></div></div>'
   +'<div class="card"><h2>معلومات</h2><div class="mute">المكتبة: '+ar(POOL.h.length)+' حديثاً (البخاري ومسلم) و'+ar(POOL.q.length)+' مقطعاً من القرآن (آيات كاملة المعنى) و'+ar(POOL.s.length)+' قصة صحيحة و'+ar(POOL.d.length)+' درّة و'+ar(POOL.w.length)+' حكمة — الأحاديث والآيات تكفي نحو '+ar(Math.floor(ROWS.length/3))+' يوماً بدون تكرار. حالة «تم الإرسال» محفوظة على هذا الجهاز.</div>'
   +'<div class="row"><button class="btn sm" id="rst">إعادة ضبط سجل الإرسال</button></div></div>';
  app.innerHTML=h;
  [].forEach.call(app.querySelectorAll('input[type=time]'),function(el){el.onchange=function(){C.times[+el.dataset.ti]=el.value||C.times[+el.dataset.ti];save()}});
  document.getElementById('mix').onchange=function(){C.mix=this.value;save();toast('تم الحفظ ✓')};
  document.getElementById('thm').onchange=function(){C.theme=this.value;S.th={};save();toast('تم الحفظ ✓')};
  document.getElementById('lay').onchange=function(){C.layout=this.value;S.ly={};save();toast('تم الحفظ ✓')};
  document.getElementById('sig').onchange=function(){C.sig=this.value.trim()||'السنة الغراء';save();toast('تم الحفظ ✓')};
  document.getElementById('lnk').onchange=function(){C.link=this.value.trim()||COMMUNITY;save();toast('تم الحفظ ✓')};
  document.getElementById('icsb').onclick=function(){download(new File([ics()],'sunna-reminders.ics',{type:'text/calendar'}));toast('افتح الملف ثم اضغط «إضافة الكل»')};
  document.getElementById('rst').onclick=function(){if(confirm('مسح سجل «تم الإرسال» من هذا الجهاز؟')){S.sent={};S.sw={};S.rp={h:0,q:0};save();toast('تمت إعادة الضبط')}};
}


/* ===== الختمة ===== */
var SN=["الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"];
var KFALL=[{v:'i:ar.alafasy',n:'مشاري العفاسي'},{v:'i:ar.saadalghamdi',n:'سعد الغامدي'}];
S.kh=S.kh||{rec:'i:ar.alafasy',done:{},last:1};
var KREC=null,KURL={};
function khUrl(rec,n){
  var k=rec+'|'+n;
  if(KURL[k])return Promise.resolve(KURL[k]);
  if(rec.indexOf('i:')===0){var u='https://cdn.islamic.app/quran/audio-surah/'+rec.slice(2)+'/'+n+'.mp3';KURL[k]=u;return Promise.resolve(u)}
  return fetch('https://api.quran.com/api/v4/chapter_recitations/'+rec.slice(2)+'/'+n).then(function(r){return r.json()}).then(function(j){
    var u=j&&j.audio_file&&j.audio_file.audio_url;if(!u)throw new Error('no url');KURL[k]=u;return u});
}
function khTim(rec,n){
  if(rec.indexOf('q:')!==0)return Promise.resolve(null);
  return fetch('https://api.quran.com/api/v4/chapter_recitations/'+rec.slice(2)+'/'+n+'?segments=true').then(function(r){return r.json()}).then(function(j){
    var t=j&&j.audio_file&&j.audio_file.timestamps;if(!t||!t.length)return null;
    return t.map(function(x){return{v:+String(x.verse_key).split(':')[1],f:x.timestamp_from/1000,t:x.timestamp_to/1000}})}).catch(function(){return null});
}
function mmss(x){x=Math.round(x);var m=Math.floor(x/60),s=x%60;return ar(m)+':'+ar((s<10?'0':'')+s)}
function khParts(D,tm){
  var MAX=300,P=[];
  if(D<=MAX+5)return[{f:0,t:D,a:0,b:0}];
  if(tm&&tm.length){
    var cur={f:0,t:0,a:tm[0].v,b:tm[0].v};
    tm.forEach(function(x,i){
      if(x.t-cur.f>MAX&&cur.b>=cur.a&&i>0&&cur.t>cur.f){P.push(cur);cur={f:cur.t,t:x.t,a:x.v,b:x.v}}
      else{cur.t=x.t;cur.b=x.v}});
    cur.t=D;P.push(cur);return P;
  }
  var k=Math.ceil(D/MAX),w=D/k;
  for(var i=0;i<k;i++)P.push({f:i*w,t:(i+1)*w,a:0,b:0});
  return P;
}
function khRecs(){
  if(KREC)return Promise.resolve(KREC);
  return fetch('https://api.quran.com/api/v4/resources/chapter_reciters?language=ar').then(function(r){return r.json()}).then(function(j){
    var a=(j.reciters||[]).map(function(x){return{v:'q:'+x.id,n:(x.translated_name&&x.translated_name.name)||x.name}});
    KREC=a.length?a.concat(KFALL):KFALL;return KREC}).catch(function(){KREC=KFALL;return KREC});
}
function viewKh(){
  var K=S.kh,cnt=Object.keys(K.done).length,pct=Math.round(cnt*100/114);
  var nxt=0;for(var i=1;i<=114;i++){if(!K.done[i]){nxt=i;break}}
  var h='<h1>الختمة 🎧</h1><div class="card hero"><h2>تقدّمك: '+ar(cnt)+' من ١١٤ سورة</h2><div class="mute">اسمع كل سورة كاملة بصوت القارئ الذي تختاره، وعلّم ما أتممت.</div><div class="prog"><i style="width:'+pct+'%"></i></div>'
   +'<div class="row">'+(nxt?'<button class="btn gold" id="knx">▶ تابع: سورة '+SN[nxt-1]+'</button>':'<span class="chip">🎉 ما شاء الله، ختمت القرآن! تقبّل الله منك</span>')+'</div></div>'
   +'<div class="card"><div class="f"><label>القارئ</label><select id="krc"></select></div>'
   +'<audio id="kau" controls preload="none" style="width:100%"></audio><div class="mute" id="kst">اختر سورة من القائمة للاستماع.</div><div class="tabs" style="flex-wrap:wrap" id="kpt"></div>'
   +'<div class="row"><button class="btn ok sm" id="kdn">✓ علّم السورة كمسموعة</button><button class="btn pri sm" id="kcp">📋 نسخ النص</button><button class="btn sm" id="kshr">📤 مشاركة</button><button class="btn sm" id="krs">إعادة الختمة</button></div></div>'
   +'<div class="card"><div class="tabs" style="flex-wrap:wrap" id="ksl"></div></div>'
   +'<div class="note">الصوت يُبثّ مباشرة من مواقع التلاوات العامة (يحتاج إنترنت)، ولا يُخزَّن في التطبيق.</div>';
  app.innerHTML=h;
  var au=document.getElementById('kau'),st=document.getElementById('kst'),sel=document.getElementById('krc');
  function paint(){
    document.getElementById('ksl').innerHTML=SN.map(function(nm,i){var n=i+1;return '<a class="tab '+(K.done[n]?'on':'')+'" data-n="'+n+'" style="'+(K.last===n&&!K.done[n]?'border-color:var(--gold)':'')+'">'+(K.done[n]?'✓ ':'')+ar(n)+'. '+nm+'</a>'}).join('');
    [].forEach.call(document.querySelectorAll('#ksl .tab'),function(a){a.onclick=function(){play(+a.dataset.n)}});
    var c=Object.keys(K.done).length;document.querySelector('.hero h2').textContent='تقدّمك: '+ar(c)+' من ١١٤ سورة';document.querySelector('.prog i').style.width=Math.round(c*100/114)+'%';
  }
  var PT=[],PI=0;
  function selPart(i){PI=i;var q=PT[i];if(!q)return;au.currentTime=q.f+0.05;au.play().catch(function(){});drawParts()}
  function drawParts(){
    var el=document.getElementById('kpt');
    if(PT.length<2){el.innerHTML='';return}
    el.innerHTML=PT.map(function(q,i){return '<a class="tab '+(i===PI?'on':'')+'" data-p="'+i+'">الجزء '+ar(i+1)+'</a>'}).join('');
    [].forEach.call(el.querySelectorAll('.tab'),function(a){a.onclick=function(){selPart(+a.dataset.p)}});
  }
  function partLabel(){var q=PT[PI]||{};var t='سورة '+SN[K.last-1];
    if(PT.length>1){t+=' — الجزء '+ar(PI+1)+' من '+ar(PT.length);if(q.a)t+=' (الآيات '+ar(q.a)+(q.b>q.a?'–'+ar(q.b):'')+')';t+='\nمن الدقيقة '+mmss(q.f)+' إلى '+mmss(q.t)}
    return t}
  au.onloadedmetadata=function(){var n=K.last;khTim(K.rec,n).then(function(tm){if(K.last!==n)return;PT=khParts(au.duration,tm);PI=0;drawParts()})};
  au.ontimeupdate=function(){var q=PT[PI];if(q&&PT.length>1&&au.currentTime>=q.t-0.1&&PI<PT.length-1){PI++;drawParts()}};
  function play(n){
    PT=[];PI=0;drawParts();K.last=n;save();st.textContent='جارٍ التحميل: سورة '+SN[n-1]+'…';
    khUrl(K.rec,n).then(function(u){au.src=u;au.play().catch(function(){});st.textContent='سورة '+SN[n-1]+' ('+ar(n)+')'}).catch(function(){st.textContent='تعذّر تحميل التلاوة — جرّب قارئاً آخر.'});
    paint();
  }
  function done(n){K.done[n]=1;save();paint()}
  khRecs().then(function(a){
    if(!a.some(function(r){return r.v===K.rec})){K.rec=a[0].v;save()}
    sel.innerHTML=a.map(function(r){return '<option value="'+r.v+'"'+(K.rec===r.v?' selected':'')+'>'+esc(r.n)+'</option>'}).join('');
  });
  sel.onchange=function(){K.rec=sel.value;save();if(au.getAttribute('src'))play(K.last)};
  au.onended=function(){done(K.last);if(K.last<114)play(K.last+1)};
  var nb=document.getElementById('knx');if(nb)nb.onclick=function(){play(nxt)};
  document.getElementById('kdn').onclick=function(){done(K.last);toast('تم ✓ تقبّل الله')};
  function ktext(u){return '🎧 سلسلة ختم القرآن الكريم صوتياً\n\n'+partLabel()+'\n'+u+'\n\n'+C.sig}
  document.getElementById('kcp').onclick=function(){
    khUrl(K.rec,K.last).then(function(u){var t=ktext(u);
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){toast('تم نسخ النص ✓')},function(){toast('تعذّر النسخ')});else toast('تعذّر النسخ')})};
  document.getElementById('kshr').onclick=function(){
    khUrl(K.rec,K.last).then(function(u){var t=ktext(u);
      if(navigator.share)navigator.share({text:t}).catch(function(){});else window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank')})};
  document.getElementById('krs').onclick=function(){if(confirm('بدء ختمة جديدة وتصفير التقدّم؟')){K.done={};K.last=1;save();viewKh()}};
  paint();
}

/* ===== التوجيه ===== */
function route(){
  var h=(location.hash||'#today').slice(1);
  if(h==='kh')viewKh();else if(h==='lib')viewLib();else if(h==='set')viewSet();else viewToday();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();
})();
