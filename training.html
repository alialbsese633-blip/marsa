<body>
<div id="root"></div>
<script src="hr-config.js"></script>
<script src="config.js"></script>
<script>
/* TDSync — طبقة المزامنة مع قاعدة البيانات المشتركة (Google Sheets عبر Apps Script)
 * - حفظ تلقائي بعد كل تغيير (بدون زر حفظ)
 * - يعمل بدون إنترنت: التغييرات تُحفظ على الجهاز وتُرسل تلقائياً عند عودة الاتصال
 * - كل جهاز يرسل فقط ما تغيّر فيه، فلا يمسح عمل الآخرين
 */
(function () {
  var cfg = window.TD_CONFIG || {};
  var API = String(cfg.API_URL || '').trim();
  var T = { enabled: !!API, pin: null, emp: null };
  window.TDSync = T;
  if (!API) return;

  var LS_SNAP = 'nassayem_td_snap';
  var LS_EMP = 'nassayem_td_emp';   // دخول الموظف على هذا الجهاز (المعرّف + الرمز) حتى لا يعيد كتابته كل مرة
  var POLL_MS = 30000;
  var COLS = [['emp', 'employees'], ['mod', 'modules'], ['frm', 'forms'], ['tsk', 'tasks'], ['ann', 'announcements']];

  var getState = null, setState = null;
  var snap = null;          // آخر نسخة معروفة من الخادم (key -> نص JSON)
  var lastRev = -1;
  var attached = false, flushTimer = null, retryTimer = null, retryN = 0, snapTimer = null, discards = 0;
  var Q = Promise.resolve();

  try { snap = JSON.parse(localStorage.getItem(LS_SNAP) || 'null'); } catch (e) { snap = null; }
  T.synced = !!snap;                                  // هل لدينا نسخة معروفة من الخادم؟
  try { T.pushAppId = localStorage.getItem('nassayem_td_pushapp') || ''; } catch (e) { T.pushAppId = ''; }
  var subs = [];
  function notify() { setTimeout(function () { subs.forEach(function (f) { try { f(); } catch (e) {} }); }, 80); }
  try { var se = JSON.parse(localStorage.getItem(LS_EMP) || 'null'); if (se && se.id && se.pin) T.emp = { id: String(se.id), pin: String(se.pin) }; } catch (e) {}

  /* ---------- دخول موحّد (مرسى): الجلسة تأتي من شاشة الدخول الرئيسية ---------- */
  (function () {
    var tok = null, mu = null;
    try { tok = localStorage.getItem('marsa_token'); mu = JSON.parse(localStorage.getItem('marsa_user') || 'null'); } catch (e) {}
    if (!tok || !mu) { location.replace('./'); return; }
    T.sso = tok;
    if (mu.role === 'hr' || mu.role === 'gm') { T.pin = '__sso__'; T.emp = null; }
    else if (mu.empId) { T.emp = { id: String(mu.empId), pin: 'sso' }; }
    var HR = String((window.HR_CONFIG || {}).API_URL || '').trim();
    if (HR) fetch(HR, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'me', t: tok }) })
      .then(function (r) { return r.json(); })
      .then(function (r) { if (!r || !r.ok) { try { localStorage.removeItem('marsa_token'); localStorage.removeItem('marsa_user'); } catch (e) {} location.replace('./'); } })
      .catch(function () {});
  })();
  T.ssoLogout = function () { if (!T.sso) return; try { localStorage.removeItem('marsa_token'); localStorage.removeItem('marsa_user'); } catch (e) {} location.replace('./'); };

  /* ---------- أدوات ---------- */
  function canon(v) {
    if (v === null || typeof v !== 'object') return JSON.stringify(v);
    if (Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
    var ks = Object.keys(v).filter(function (k) { return v[k] !== undefined; }).sort();
    return '{' + ks.map(function (k) { return JSON.stringify(k) + ':' + canon(v[k]); }).join(',') + '}';
  }
  function enqueue(fn) { var p = Q.then(fn); Q = p.catch(function () {}); return p; }
  function isEn() { return document.documentElement.lang === 'en'; }
  function saveSnapSoon() {
    clearTimeout(snapTimer);
    snapTimer = setTimeout(saveSnap, 800);
  }
  function saveSnap() { try { localStorage.setItem(LS_SNAP, JSON.stringify(snap)); } catch (e) {} }

  /* ---------- تحويل الحالة إلى مستندات (key -> نص) والعكس ---------- */
  function flatten(st) {
    var m = {}, ord = {};
    COLS.forEach(function (c) {
      var arr = st[c[1]] || [];
      ord[c[0]] = arr.map(function (x) { return x.id; });
      arr.forEach(function (x) { m[c[0] + ':' + x.id] = canon(x); });
    });
    m.ord = canon(ord);
    var s = Object.assign({}, st.settings || {});
    delete s.pin;                                   // الرمز السري لا يُخزَّن مع البيانات أبداً
    m.settings = canon(s);
    Object.keys(st.results || {}).forEach(function (id) { m['res:' + id] = canon(st.results[id] || {}); });
    Object.keys(st.taskDone || {}).forEach(function (id) { m['tdn:' + id] = canon(st.taskDone[id] || {}); });
    (st.responses || []).forEach(function (r) { m['rsp:' + r.id] = canon(r); });
    return m;
  }

  function parse(s, dflt) { try { return JSON.parse(s); } catch (e) { return dflt; } }

  function unflatten(m, prev) {
    var st = { version: 1 };
    var ord = parse(m.ord || '{}', {});
    COLS.forEach(function (c) {
      var p = c[0], items = [];
      Object.keys(m).forEach(function (k) {
        if (k.indexOf(p + ':') === 0) { var it = parse(m[k], null); if (it && it.id != null) items.push(it); }
      });
      var pos = {};
      (ord[p] || []).forEach(function (id, i) { pos[id] = i; });
      items.sort(function (a, b) {
        var x = a.id in pos ? pos[a.id] : 1e9, y = b.id in pos ? pos[b.id] : 1e9;
        return x - y || String(a.id).localeCompare(String(b.id));
      });
      st[c[1]] = items;
    });
    st.announcements.sort(function (a, b) { return String(b.at || '').localeCompare(String(a.at || '')) || String(b.id).localeCompare(String(a.id)); });   // الأحدث أولاً
    st.results = {}; st.taskDone = {}; st.responses = [];
    Object.keys(m).forEach(function (k) {
      if (k.indexOf('res:') === 0) st.results[k.slice(4)] = parse(m[k], {});
      else if (k.indexOf('tdn:') === 0) st.taskDone[k.slice(4)] = parse(m[k], {});
      else if (k.indexOf('rsp:') === 0) { var r = parse(m[k], null); if (r) st.responses.push(r); }
    });
    st.responses.sort(function (a, b) {
      return String(b.at || '').localeCompare(String(a.at || '')) || String(b.id).localeCompare(String(a.id));
    });
    st.settings = Object.assign({}, prev && prev.settings, parse(m.settings || '{}', {}), { pin: '' });
    return st;
  }

  function diff(flat, base) {
    var ops = [];
    Object.keys(flat).forEach(function (k) { if (flat[k] !== base[k]) ops.push({ k: k, v: flat[k] }); });
    Object.keys(base).forEach(function (k) { if (!(k in flat)) ops.push({ k: k, del: 1 }); });
    return ops;
  }

  /* ---------- الشبكة ---------- */
  function withTimeout(url, opt) {
    var ctl = typeof AbortController === 'function' ? new AbortController() : null;
    var t = setTimeout(function () { if (ctl) ctl.abort(); }, 25000);
    opt = opt || {}; if (ctl) opt.signal = ctl.signal;
    return fetch(url, opt).then(function (r) { clearTimeout(t); return r.text(); })
      .then(function (txt) { return JSON.parse(txt); })
      .catch(function (e) { clearTimeout(t); throw e; });
  }
  function apiGet(action) {
    return withTimeout(API + (API.indexOf('?') < 0 ? '?' : '&') + 'action=' + action + '&_=' + Date.now(), { cache: 'no-store' });
  }
  function apiPost(body) {
    if (T.sso) body.sso = T.sso;
    return withTimeout(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  }

  /* ---------- شريط الحالة + شاشة التحميل الأولى ---------- */
  var pillEl = null, pillTimer = null, overlayEl = null;
  function ensurePill() {
    if (pillEl || !document.body) return;
    pillEl = document.createElement('div');
    pillEl.setAttribute('role', 'status');
    pillEl.style.cssText = 'position:fixed;bottom:12px;inset-inline-start:12px;z-index:70;max-width:min(92vw,360px);' +
      'padding:8px 12px;border-radius:12px;font:500 12px/1.5 "IBM Plex Sans Arabic",Segoe UI,Tahoma,sans-serif;' +
      'color:#fff;box-shadow:0 8px 24px -10px rgba(15,46,46,.55);transition:opacity .4s;pointer-events:none;opacity:0';
    document.body.appendChild(pillEl);
  }
  var TXT = {
    saved: ['✓ تم الحفظ', '✓ Saved'],
    saving: ['جارٍ الحفظ…', 'Saving…'],
    offline: ['لا يوجد اتصال — تغييراتك محفوظة على جهازك وستُرسل تلقائياً', 'Offline — your changes are kept on this device and will sync automatically'],
    authfail: ['لم يُحفظ التغيير: أعد الدخول لصفحة الإدارة بالرمز', 'Change not saved: sign in to Admin again'],
    empauth: ['لم يُحفظ التغيير: أعد الدخول برمزك الخاص', 'Change not saved: please sign in again with your PIN'],
    locked: ['تم إيقاف المحاولات مؤقتاً (5 دقائق)', 'Attempts paused for 5 minutes'],
    error: ['تعذّر الحفظ، سنعيد المحاولة', 'Could not save, will retry']
  };
  var COL = { saved: '#15803D', saving: '#B45309', offline: '#B91C1C', authfail: '#B91C1C', empauth: '#B91C1C', locked: '#B91C1C', error: '#B91C1C' };
  function setStatus(s) {
    ensurePill(); if (!pillEl) return;
    pillEl.textContent = TXT[s][isEn() ? 1 : 0];
    pillEl.style.background = COL[s];
    pillEl.style.opacity = '1';
    clearTimeout(pillTimer);
    if (s === 'saved') pillTimer = setTimeout(function () { pillEl.style.opacity = '0'; }, 2200);
    else if (s === 'authfail' || s === 'empauth' || s === 'locked') pillTimer = setTimeout(function () { pillEl.style.opacity = '0'; }, 9000);
  }

  function showOverlay(err) {
    if (!document.body) return;
    if (!overlayEl) {
      overlayEl = document.createElement('div');
      overlayEl.style.cssText = 'position:fixed;inset:0;z-index:80;background:#F3F6F6;display:flex;flex-direction:column;' +
        'align-items:center;justify-content:center;gap:14px;font:500 15px/1.6 "IBM Plex Sans Arabic",Segoe UI,Tahoma,sans-serif;color:#194747;text-align:center;padding:24px';
      document.body.appendChild(overlayEl);
    }
    overlayEl.innerHTML = '';
    var msg = document.createElement('div');
    msg.textContent = err ? (isEn() ? 'Could not reach the server. Check your internet connection.' : 'تعذّر الاتصال بالخادم. تأكد من اتصال الإنترنت.')
      : (isEn() ? 'Loading…' : 'جارٍ التحميل…');
    overlayEl.appendChild(msg);
    if (err) {
      var b = document.createElement('button');
      b.textContent = isEn() ? 'Try again' : 'إعادة المحاولة';
      b.style.cssText = 'background:#287070;color:#fff;border:0;border-radius:12px;padding:10px 20px;font:inherit;cursor:pointer';
      b.onclick = function () { showOverlay(false); pull(true); };
      overlayEl.appendChild(b);
    }
  }
  function hideOverlay() { if (overlayEl) { overlayEl.remove(); overlayEl = null; } }

  /* ---------- سحب البيانات من الخادم ودمجها ---------- */
  function seed() {
    var flat = flatten(getState());
    var ops = Object.keys(flat).map(function (k) { return { k: k, v: flat[k], nx: 1 }; });
    return apiPost({ action: 'push', ops: ops });
  }

  function pull(force, discard) {
    return enqueue(function () {
      if (!setState || !getState) return;
      var first = !snap;
      var step = Promise.resolve();
      if (!force && !first) {
        step = apiGet('rev').then(function (r) { return r && r.ok && r.rev === lastRev ? 'same' : 'go'; });
      } else step = Promise.resolve('go');
      return step.then(function (dec) {
        if (dec === 'same') { return; }

    els.panel.innerHTML = '<div class="tdx-sheet" role="dialog" aria-modal="true"><div class="tdx-head"><h3>📢 ' + esc(t('adminTools')) + '</h3><button class="tdx-x" data-act="close" aria-label="' + esc(t('close')) + '" type="button">✕</button></div><div class="tdx-body">' +
      '<div id="tdx-push-status" class="tdx-mut" style="padding:0 4px"></div>' +
      '<div class="tdx-h4">' + esc(t('composeTitle')) + '</div><div class="tdx-card">' +
      '<label class="tdx-lbl" for="tdx-f-title">' + esc(t('fTitle')) + '</label><input id="tdx-f-title" class="tdx-in" maxlength="80" autocomplete="off">' +
      '<label class="tdx-lbl" for="tdx-f-body">' + esc(t('fBody')) + '</label><textarea id="tdx-f-body" class="tdx-in" rows="3" maxlength="600"></textarea>' +
      '<label class="tdx-lbl" for="tdx-f-level">' + esc(t('fLevel')) + '</label><select id="tdx-f-level" class="tdx-in"><option value="info">' + esc(t('lvlInfo')) + '</option><option value="urgent">' + esc(t('lvlUrgent')) + '</option></select>' +
      '<label class="tdx-lbl" for="tdx-f-until">' + esc(t('fUntil')) + '</label><input id="tdx-f-until" class="tdx-in" type="date" dir="ltr">' +
      '<div id="tdx-f-msg" class="tdx-mut" style="min-height:20px;margin-top:6px"></div>' +
      '<button class="tdx-btn" data-act="publish" type="button" style="width:100%;margin-top:4px">' + esc(t('publish')) + '</button></div>' +
      '<div class="tdx-h4">' + esc(t('listTitle')) + '</div><div id="tdx-a-list" style="display:flex;flex-direction:column;gap:8px">' + annListHtml(st) + '</div>' +
      '<div class="tdx-h4">' + esc(t('remindTitle')) + '</div><div class="tdx-mut" style="margin:-4px 2px 2px">' + esc(t('remindSub')) + '</div><div id="tdx-a-remind" style="display:flex;flex-direction:column;gap:8px">' + remindHtml(st) + '</div>' +
      '</div></div>';
  }
  function loadPushStatus() {
    if (!T.pushStatus) return;
    T.pushStatus().then(function (r) { var el = $('tdx-push-status'); if (el && r) el.textContent = t(r.configured ? 'pushAdminOn' : 'pushAdminOff'); });
  }
  function refreshAdminLists() {
    var st = stateNow(), a = $('tdx-a-list'), r = $('tdx-a-remind');
    if (a) a.innerHTML = annListHtml(st); if (r) r.innerHTML = remindHtml(st);
  }

  function copyText(txt, done) {
    var fb = function () { try { var ta = document.createElement('textarea'); ta.value = txt; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done(true); } catch (e) { done(false); } };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function () { done(true); }, fb); else fb();
  }

  function publish() {
    var ti = ($('tdx-f-title').value || '').trim(), bo = ($('tdx-f-body').value || '').trim(), lv = $('tdx-f-level').value === 'urgent' ? 'urgent' : 'info', un = $('tdx-f-until').value || '';
    var msg = $('tdx-f-msg');
    if (!ti) { msg.style.color = '#B91C1C'; msg.textContent = t('needTitle'); return; }
    var st = stateNow(), an = st.settings && st.settings.adminName;
    var ann = { id: 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), title: ti, body: bo, level: lv, at: new Date().toISOString(), by: an ? nm(an) : '', until: un };
    T.update(function (prev) { return Object.assign({}, prev, { announcements: [ann].concat(prev.announcements || []) }); });
    $('tdx-f-title').value = ''; $('tdx-f-body').value = ''; $('tdx-f-until').value = ''; $('tdx-f-level').value = 'info';
    msg.style.color = '#15803D'; msg.textContent = t('published');
    setTimeout(refreshAdminLists, 120);
  }

  function onPanelClick(e) {
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b) { var card = e.target.closest && e.target.closest('[data-item]'); if (card && panelKind === 'emp') { markRead([card.getAttribute('data-item')]); tick(); } return; }
    var act = b.getAttribute('data-act');
    if (act === 'close') closePanel();
    else if (act === 'readall') { markRead((curCalc ? curCalc.items : []).map(function (x) { return x.id; })); tick(); }
    else if (act === 'perm') {
      try {
        Notification.requestPermission().then(function () {
          var id = T.emp && T.emp.id; if (id && curCalc) { var m = jget('td_notif_' + id, {}); curCalc.unread.forEach(function (x) { m[x.id] = 1; }); jset('td_notif_' + id, m); }
          tick();
        });
      } catch (er) {}
    }
    else if (act === 'pushperm') {
      var os = PUSH.os; if (!os) return;
      Promise.resolve(os.Notifications.requestPermission()).then(function () { return os.User.PushSubscription.optIn(); }).catch(function () {}).then(function () {
        pushRefresh(); if (T.emp) { try { os.login(T.emp.id); PUSH.login = T.emp.id; } catch (e) {} } tick();
      });
    }
    else if (act === 'cert') openCertificate();
    else if (act === 'publish') publish();
    else if (act === 'delann') {
      if (!window.confirm(t('delConfirm'))) return; var did = b.getAttribute('data-id');
      T.update(function (prev) { return Object.assign({}, prev, { announcements: (prev.announcements || []).filter(function (a) { return a.id !== did; }) }); });
      setTimeout(refreshAdminLists, 120);
    }
    else if (act === 'copyrem') {
      var rs = reminders(stateNow()), r = rs[+b.getAttribute('data-i')]; if (!r) return;
      copyText(remindText(r), function (ok) { var o = b.textContent; b.textContent = ok ? t('copied') : '✗'; setTimeout(function () { b.textContent = o; }, 1500); });
    }
  }

  /* ---------- الشهادة ---------- */
  function openCertificate() {
    var st = stateNow(), id = T.emp && T.emp.id; if (!id) return;
    var c = certOf(st, id); if (!c) return;
    var me = (st.employees || []).filter(function (e) { return e.id === id; })[0]; if (!me) return;
    var ar = lang() === 'ar', an = st.settings && st.settings.adminName;
    var rows = c.rows.map(function (r) { return '<tr><td>' + esc(r.title) + '</td><td class="n">' + esc(r.score) + '%</td></tr>'; }).join('');
    var d = new Date().toLocaleDateString(ar ? 'ar-OM-u-nu-latn' : 'en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
    var html = '<!doctype html><html lang="' + lang() + '" dir="' + (ar ? 'rtl' : 'ltr') + '"><head><meta charset="utf-8"><title>' + esc(t('certHead')) + ' - ' + esc(nm(me.name)) + '</title><style>' +
      '@page{size:A4 landscape;margin:0}*{box-sizing:border-box}body{margin:0;background:#e5eaea;font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;color:#0f172a}' +
      '.bar{padding:12px;text-align:center}.bar button{background:#287070;color:#fff;border:0;border-radius:12px;padding:10px 22px;font:inherit;font-weight:700;cursor:pointer}' +
      '.page{width:297mm;min-height:200mm;margin:0 auto 20px;background:#fff;padding:14mm;position:relative}' +
      '.frame{border:3px solid #287070;outline:1px solid #b7d8d8;outline-offset:-9px;height:100%;min-height:172mm;padding:12mm 16mm;text-align:center;display:flex;flex-direction:column;justify-content:space-between}' +
      '.co{color:#287070;font-weight:700;font-size:20px;letter-spacing:.5px}.prog{color:#64748b;font-size:14px;margin-top:2px}' +
      'h1{font-size:44px;margin:14px 0 4px;color:#194747}.sub{color:#475569;font-size:17px}.name{font-size:38px;font-weight:700;margin:12px 0;color:#0F6E6E;border-bottom:2px solid #b7d8d8;display:inline-block;padding:0 28px 6px}' +
      'table{margin:10px auto 0;border-collapse:collapse;min-width:60%;font-size:14px}td,th{border:1px solid #d9e2e2;padding:6px 14px}th{background:#F0F7F7}td.n{text-align:center;width:90px}' +
      '.meta{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px;font-size:14px;color:#334155}.sig{border-top:1px solid #94a3b8;padding-top:6px;min-width:180px}' +
      '@media print{body{background:#fff}.bar{display:none}.page{margin:0;width:auto}}</style></head><body><div class="bar"><button onclick="window.print()">' + esc(t('certPrint')) + '</button></div>' +
      '<div class="page"><div class="frame"><div><div class="co">' + esc(t('certCompany')) + '</div><div class="prog">' + esc(t('certProgram')) + '</div><h1>' + esc(t('certHead')) + '</h1><div class="sub">' + esc(t('certBody1')) + '</div>' +
      '<div class="name">' + esc(nm(me.name)) + '</div><div class="sub">' + esc(t('certBody2')) + '</div></div>' +
      '<table><thead><tr><th>' + esc(t('certModule')) + '</th><th>' + esc(t('certScore')) + '</th></tr></thead><tbody>' + rows + '</tbody></table>' +
      '<div class="meta"><div>' + esc(t('certDate')) + ': <b>' + esc(d) + '</b></div><div>' + esc(t('certAvg')) + ': <b>' + esc(c.avg) + '%</b></div><div class="sig">' + esc(an ? nm(an) : '') + '<br>' + esc(t('certSign')) + '</div></div></div></div></body></html>';
    var w = window.open('', '_blank');
    if (!w) return;
    w.document.open(); w.document.write(html); w.document.close();
  }

  /* ---------- الدورة الرئيسية ---------- */
  function tick() {
    var mode = modeNow(); ensureUI(mode);
    pushInit(); pushSyncLogin();
    if (mode === 'emp' && T.synced) {
      var id = T.emp.id, c = compute(id, stateNow()); curCalc = c;
      handleNew(id, c); setBadge(c.unread.length); syncBanner(c);
      if (panelKind === 'emp') renderEmp();
    } else {
      curCalc = null; setBadge(0); syncBanner(null);
      if (mode === 'admin' && panelKind === 'admin') refreshAdminLists();
    }
  }
  T.on(tick);
  setInterval(tick, 60000);                                     // مرور الوقت (مواعيد الغد/اليوم) بدون حاجة لتغيّر البيانات
  // تنبيهات الجهاز تعمل والتطبيق في الخلفية: نفحص الخادم كل دقيقتين عندما تكون الصفحة مخفية والتنبيهات مفعّلة
  setInterval(function () {
    if (document.hidden && T.emp && !pushActive() && 'Notification' in window && Notification.permission === 'granted') { try { T.pullNow(); } catch (e) {} }
  }, 120000);
  new MutationObserver(function () { if (els.fab) { els.fab.removeAttribute('data-mode'); } tick(); if (panelKind === 'admin') { /* يحافظ على ما كُتب */ } else if (panelKind === 'emp') renderEmp(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) tick(); });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', tick); else tick();
  window.TDX = { compute: compute, reminders: reminders, certOf: certOf, tick: tick };   // للاختبار
})();

</script>
