html[lang=en]{--font:"Inter","IBM Plex Sans Arabic",-apple-system,"Segoe UI",sans-serif}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%;background:radial-gradient(1200px 500px at 90% -10%,#E2EFEF 0,transparent 60%),var(--paper);color:var(--ink);font:16px/1.6 var(--font);-webkit-font-smoothing:antialiased}

.bar-in{max-width:1080px;margin:0 auto;padding:8px 20px;display:flex;align-items:center;gap:10px;min-height:64px}
.bar img{height:48px;width:auto}.sp{flex:1}
.lang{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font:600 14px var(--font);color:var(--ink);cursor:pointer;box-shadow:var(--sh);display:flex;gap:6px;align-items:center;transition:transform .15s,box-shadow .15s}
.lang:hover{transform:translateY(-1px);box-shadow:var(--sh2)}.lang:active{transform:scale(.96)}
.wrap{max-width:1080px;margin:0 auto;padding:6px 20px 40px}
.hello{margin:28px 0 24px;animation:up .5s ease both}
.hello h1{margin:0;font-size:clamp(28px,6vw,42px);line-height:1.2;font-weight:700}
.hello p{margin:6px 0 0;color:var(--mute);font-size:15px}
.hello .intro{margin:14px 0 0;max-width:60ch;color:var(--ink);font-size:15.5px;line-height:1.85}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:0 0 12px;font-size:15px;font-weight:700;color:var(--ink)}
.sec-h small{font-weight:500;color:var(--mute);font-size:13px}
.depts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;animation:up .5s ease both}
.dept{position:relative;display:flex;flex-direction:column;min-height:228px;padding:22px 24px 20px;border-radius:24px;background:var(--c);color:#fff;text-decoration:none;overflow:hidden;isolation:isolate;box-shadow:0 1px 2px rgba(16,41,43,.08),0 14px 30px -18px var(--c);transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s}

.dept:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(16,41,43,.1),0 22px 40px -18px var(--c)}
.dept:active{transform:scale(.99)}
.dept:focus-visible{outline:3px solid #18A4B8;outline-offset:3px}
.dept .hd{display:flex;align-items:flex-start;gap:14px}
.dept .ic{font-size:30px;line-height:1;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:rgba(255,255,255,.14);flex:none}
.dept h2{margin:2px 0 0;font-size:clamp(22px,2.6vw,28px);font-weight:700;line-height:1.25;letter-spacing:-.2px}
.dept .en{font-size:13px;opacity:.72;margin-top:2px}
.dept .desc{margin:14px 0 0;font-size:14.5px;line-height:1.75;opacity:.9;max-width:44ch}
.dept .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:16px}
.dept .chips span{font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.16)}
.dept .enter{position:absolute;inset-inline-end:20px;bottom:18px;width:42px;height:42px;border-radius:50%;background:#fff;color:var(--c);display:grid;place-items:center;font-size:20px;font-weight:700;transition:transform .2s}
.dept:hover .enter{transform:translateX(-4px)}html[dir=ltr] .dept:hover .enter{transform:translateX(4px)}
.dept .chips{padding-inline-end:52px}

.svc-row .chev,.mng .ar{display:grid;place-items:center}

.svc{margin-top:30px;animation:up .5s .1s ease both}
.svc-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden}
.svc-row{display:flex;align-items:center;gap:14px;padding:14px 18px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);min-height:76px;transition:background .15s}
.svc-row:nth-child(odd){border-inline-end:1px solid var(--line)}
a.svc-row:hover{background:#F6FAFA}a.svc-row:focus-visible{outline:3px solid #18A4B8;outline-offset:-3px}
.svc-row .si{font-size:20px;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--t);flex:none}
.svc-row b{display:block;font-size:15px;font-weight:600}.svc-row small{display:block;color:var(--mute);font-size:12.5px;line-height:1.5;margin-top:1px}
.svc-row .st{margin-inline-start:auto;flex:none;font-size:12px;font-weight:600;color:var(--mute)}
.svc-row .st.soon{background:#F4ECE0;color:#7A5426;padding:3px 9px;border-radius:999px}
.svc-row .chev{margin-inline-start:auto;color:#9AB0B0;font-size:20px;flex:none}
.svc-row.off{cursor:default}.svc-row.off .si{filter:grayscale(.6);opacity:.75}

body.leaving .wrap{opacity:0;transform:translateY(-6px);transition:opacity .22s,transform .22s}

  function fetchEss(){if(!TOKEN)return;api({action:'essCfg',t:TOKEN}).then(function(r){if(r&&r.ok){ESS=r.cfg||{open:{}};paint()}}).catch(function(){})}
  try{TOKEN=localStorage.getItem('marsa_token')}catch(e){}
  function api(b){return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)}).then(function(r){return r.json()})}
  function saveSess(tok,u){TOKEN=tok;USER=u;try{localStorage.setItem('marsa_token',tok);localStorage.setItem('marsa_user',JSON.stringify(u))}catch(e){}}
  function clearSess(){TOKEN=null;USER=null;try{localStorage.removeItem('marsa_token');localStorage.removeItem('marsa_user')}catch(e){}}
  function authHTML(L){
    if(MODE==='loading')return '<div class="spin"></div>';
    if(MODE==='must')return '<form class="auth" id="chgF"><h2>🔑 '+L.chg+'</h2><div class="note">'+L.chgP+'</div><label>'+L.old+'</label><input id="aO" type="password" autocomplete="current-password"><label>'+L.nw+'</label><input id="aN" type="password" autocomplete="new-password"><div class="err" id="aE">'+esc(ERR)+'</div><button id="aB">'+L.save+'</button></form>';
    return '<form class="auth" id="sinF"><h2>🔐 '+L.sin+'</h2><p>'+L.sinP+'</p><label>'+L.u+'</label><input id="aU" autocapitalize="none" autocomplete="username"><label>'+L.p+'</label><input id="aP" type="password" autocomplete="current-password"><div class="err" id="aE">'+esc(ERR)+'</div><button id="aB">'+L.go+'</button></form>';
  }
  function bindAuth(L){
    var f=document.getElementById('sinF'),c=document.getElementById('chgF');
    if(f)f.onsubmit=function(e){e.preventDefault();var b=document.getElementById('aB');b.disabled=true;
      api({action:'login',u:document.getElementById('aU').value.trim(),p:document.getElementById('aP').value}).then(function(r){
        if(!r.ok){ERR=r.error==='locked'?L.locked:L.bad;paint();return}saveSess(r.token,r.user);ERR='';MODE=r.user.must?'must':'in';paint();fetchEss()}).catch(function(){ERR=L.net;paint()})};
    if(c)c.onsubmit=function(e){e.preventDefault();var b=document.getElementById('aB');b.disabled=true;
      api({action:'changePassword',t:TOKEN,old:document.getElementById('aO').value,password:document.getElementById('aN').value}).then(function(r){
        if(!r.ok){ERR=r.message||L.bad;paint();return}saveSess(r.token,r.user);ERR='';MODE='in';paint();fetchEss()}).catch(function(){ERR=L.net;paint()})};
  }
  function paint(){
    var L=I[LANG],d=new Date();document.documentElement.lang=LANG;document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
    document.getElementById('greet').textContent=d.getHours()<12?L.m:L.e;
    document.getElementById('today').textContent=L.days[d.getDay()]+' '+d.getDate()+' '+L.months[d.getMonth()]+' '+d.getFullYear();
    document.getElementById('intro').textContent=L.intro;document.getElementById('fco').textContent=L.co;document.getElementById('fby').textContent=L.by;document.getElementById('langTxt').textContent=L.btn;
    document.title=(LANG==='ar'?'مرسى':'Marsa')+' | Marsa';
    var who=document.getElementById('who');who.classList.toggle('on',MODE==='in'||MODE==='must');document.getElementById('outBtn').textContent=L.out;document.getElementById('whoNm').textContent=USER?USER.name:'';
    if(MODE!=='in'){document.getElementById('sections').innerHTML='<div style="grid-column:1/-1">'+authHTML(L)+'</div>';bindAuth(L);return}
    if(USER)document.getElementById('greet').textContent=(d.getHours()<12?L.m:L.e)+'، '+String(USER.name||'').split(' ')[0];
    document.getElementById('intro').textContent=L.introIn;
    var vis=SECTIONS.filter(function(x){return !x.roles||(USER&&x.roles.indexOf(USER.role)>=0)}),ar=LANG==='ar';
    function st(x){return {locked:x.gate&&!essAdmin()&&!essOpen(x.gate),staffOff:x.gate&&essAdmin()&&!essOpen(x.gate)}}
    var depts=vis.filter(function(x){return x.main}).map(function(x){var k=st(x),main=ar?x.ar:x.en,alt=ar?x.en:x.ar,chips=(ar?x.chips:x.chipsEn)||[];
      var inner='<div class="hd"><div class="ic" aria-hidden="true">'+x.ic+'</div><div><h2>'+esc(main)+'</h2><div class="en">'+esc(alt)+'</div></div></div>'+
        '<p class="desc">'+esc(ar?x.dar:x.den)+'</p>'+(x.ready&&!k.locked?'<div class="hint"><i></i>'+esc(L.ready)+'</div>':'')+
        '<div class="chips">'+chips.map(function(c){return '<span>'+esc(c)+'</span>'}).join('')+'</div>';
      if(k.locked)return '<div class="dept soon" role="note" style="--c:'+x.c+'"><span class="tag">🛠️ '+L.soon+'</span>'+inner+'</div>';
      return '<a class="dept" href="'+esc(x.href)+'" style="--c:'+x.c+'" aria-label="'+esc(main)+'">'+(k.staffOff?'<span class="tag">🛠️ '+L.staffOff+'</span>':x.isNew?'<span class="tag">✨ '+L.newT+'</span>':'')+inner+'<span class="enter" aria-hidden="true">'+CHEV+'</span></a>';
    }).join('');
    var svc=vis.filter(function(x){return !x.main}).map(function(x){var k=st(x),main=ar?x.ar:x.en;
      var inner='<span class="si" style="--t:'+x.t+'" aria-hidden="true">'+x.ic+'</span><span><b>'+esc(main)+'</b><small>'+esc(ar?x.dar:x.den)+'</small></span>';
      if(k.locked)return '<div class="svc-row off">'+inner+'<span class="st soon">'+L.soonS+'</span></div>';
      return '<a class="svc-row" href="'+esc(x.href)+'">'+inner+(k.staffOff?'<span class="st soon">'+L.soonS+'</span>':'<span class="chev" aria-hidden="true">'+CHEV+'</span>')+'</a>';
    }).join('');
    document.getElementById('sections').innerHTML=
      (depts?'<h2 class="sec-h">'+L.depts+'</h2><div class="depts">'+depts+'</div>':'')+
      (svc?'<section class="svc"><h2 class="sec-h">'+L.svc+' <small>'+L.svcS+'</small></h2><div class="svc-list">'+svc+'</div></section>':'')+
      (essAdmin()?'<a class="mng" href="ess.html?s=manage"><span class="mi">⚙️</span><span><b>'+L.mng+'</b><small>'+L.mngS+'</small></span><span class="ar">'+CHEV+'</span></a>':'');
  }
  document.getElementById('outBtn').onclick=function(){if(TOKEN)api({action:'logout',t:TOKEN}).catch(function(){});clearSess();MODE='login';paint()};
  document.getElementById('langBtn').onclick=function(){LANG=LANG==='ar'?'en':'ar';try{localStorage.setItem('marsa_lang',LANG)}catch(e){}paint()};
  document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a.dept,a.svc-row,a.mng');if(!a||e.metaKey||e.ctrlKey)return;e.preventDefault();document.body.classList.add('leaving');setTimeout(function(){location.href=a.getAttribute('href')},200)});
  window.addEventListener('pageshow',function(){document.body.classList.remove('leaving')});
  paint();
  if(!API){MODE='login';ERR='hr-config.js';paint()}
  else if(TOKEN){api({action:'me',t:TOKEN}).then(function(r){if(r&&r.ok){USER=r.user;try{localStorage.setItem('marsa_user',JSON.stringify(r.user))}catch(e){}MODE=r.user.must?'must':'in';fetchEss()}else{clearSess();MODE='login'}paint()}).catch(function(){MODE='login';ERR=I[LANG].net;paint()})}
  else{MODE='login';paint()}
})();
</script>
<script>
if("serviceWorker"in navigator&&/^https?:/.test(location.protocol)){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
