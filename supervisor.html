<style>
@font-face{font-family:'Readex';src:url(fonts/readex-ar-400.woff2) format('woff2');font-weight:400;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:'Readex';src:url(fonts/readex-la-400.woff2) format('woff2');font-weight:400;font-display:swap;unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:'Readex';src:url(fonts/readex-ar-500.woff2) format('woff2');font-weight:500;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:'Readex';src:url(fonts/readex-la-500.woff2) format('woff2');font-weight:500;font-display:swap;unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:'Readex';src:url(fonts/readex-ar-700.woff2) format('woff2');font-weight:700;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:'Readex';src:url(fonts/readex-la-700.woff2) format('woff2');font-weight:700;font-display:swap;unicode-range:U+0000-00FF,U+2000-206F}
:root{--teal:#2b8c89;--teal-d:#1f6664;--teal-l:#e8f4f3;--ink:#1d2b2b;--mut:#5f6f6f;--line:#d9e2e2;--bg:#f5f7f7;--ok:#2e7d32;--warn:#b26a00;--bad:#b3261e}
*{box-sizing:border-box}
body{margin:0;font-family:Readex,Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}
header{background:#fff;border-bottom:3px solid var(--teal);padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header img{width:62px;height:62px}
header h1{margin:0;font-size:20px;color:var(--teal-d)}
header .sub{color:var(--mut);font-size:13px}
.weekbar{margin-inline-start:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.weekbar button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}
.weekbar .lbl{font-weight:700;min-width:210px;text-align:center}
nav{display:flex;gap:4px;background:#fff;padding:0 20px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{border:0;background:none;padding:12px 16px;font:inherit;font-weight:700;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--teal-d);border-color:var(--teal)}
main{max-width:1080px;margin:0 auto;padding:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:17px;color:var(--teal-d)}
.card .hint{color:var(--mut);font-size:13px;margin:0 0 12px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px;font-weight:500}
input,select,textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal-l);border-color:var(--teal)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr}.weekbar{margin:0}}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--teal-l);color:var(--teal-d);font-weight:700;text-align:right;padding:8px;border:1px solid var(--line)}
td{padding:6px;border:1px solid var(--line);vertical-align:top}
td input,td select,td textarea{border:0;padding:4px;background:transparent}
td textarea{min-height:38px}
.btn{border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.p{background:var(--teal);color:#fff}
.btn.s{background:#fff;border:1px solid var(--teal);color:var(--teal-d)}
.btn.x{background:none;color:var(--bad);padding:4px 8px;font-size:18px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.days{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.days button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer;min-width:92px}
.days button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.days small{display:block;font-size:11px;opacity:.8}
.days .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-inline-start:4px;vertical-align:middle}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:700px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font-size:24px;color:var(--teal-d)}
.kpi span{font-size:13px;color:var(--mut)}
.bar{height:8px;background:#e7ecec;border-radius:6px;overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--teal)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid var(--line)}
.st-done{color:var(--ok)}.st-prog{color:var(--warn)}.st-no{color:var(--bad)}
.saveinfo{font-size:13px;color:var(--mut)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
.empty{color:var(--mut);text-align:center;padding:14px}
pre.sum{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font-family:inherit;font-size:14px;margin:0}
footer{text-align:center;color:var(--mut);font-size:12px;padding:20px}
.tip{background:var(--teal-l);border-inline-start:4px solid var(--teal);padding:10px 14px;border-radius:8px;font-size:14px;margin-bottom:14px}
details.sec{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
details.sec>summary{cursor:pointer;padding:13px 16px;font-weight:700;color:var(--teal-d);font-size:16px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.sec>summary::after{content:'+';font-size:20px;color:var(--teal)}
details.sec[open]>summary::after{content:'−'}
details.sec>div{padding:0 16px 16px}
.big{font-size:30px;font-weight:800;color:var(--teal-d)}
.rep{background:#fff;color:#111;padding:28px 32px;border:1px solid var(--line);font-size:12.5px;line-height:1.55;width:794px;margin:0 auto}
.rep .rh{display:flex;align-items:center;gap:14px;border-bottom:2px solid #1f6664;padding-bottom:10px;margin-bottom:12px}
.rep .rh img{width:58px;height:58px}.rep h1{font-size:18px;margin:0;color:#111}.rep .meta{font-size:11.5px;color:#444}
.rep h3{font-size:13.5px;color:#1f6664;margin:16px 0 6px;border-bottom:1px solid #ccc;padding-bottom:3px;page-break-after:avoid}
.rep table{font-size:11.5px;page-break-inside:auto}.rep tr{page-break-inside:avoid}.rep th{background:#eef3f3;color:#111;padding:5px 6px}.rep td{padding:4px 6px}
.rep .sig{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:34px;text-align:center;font-size:12px}.rep .sig div{border-top:1px solid #333;padding-top:6px}
@media print{body{background:#fff}header,nav,.noprint,footer,#saveBtn,#saveInfo{display:none!important}main{padding:0;max-width:none}.rep{border:0;padding:0;width:auto}}
.chips{display:flex;flex-wrap:wrap;gap:4px;align-items:center}.chip{background:var(--teal-l);color:var(--teal-d);border-radius:12px;padding:1px 4px 1px 8px;font-size:13px;white-space:nowrap}.chip b{cursor:pointer;color:var(--bad);margin-inline-start:4px;padding:0 3px}
select.addx{width:auto;border:1px dashed var(--teal)!important;font-size:12px;padding:2px 4px!important;color:var(--teal-d)}
tr.rowlate td{background:#fff6f5}tr.rowdone td{opacity:.55}tr.rowdone textarea{text-decoration:line-through}
.pill{display:inline-block;background:var(--teal-l);color:var(--teal-d);border-radius:10px;padding:0 8px;font-size:12px;margin:1px}

/* ===== هوية نسائم صلالة ===== */
:root{--teal:#2b8c89;--teal-d:#1a5d5b;--teal-l:#e6f3f2;--gold:#c9a96e;--bg:#f2f6f6}
body{background:var(--bg);-webkit-tap-highlight-color:transparent}
header{position:relative;overflow:hidden;background:linear-gradient(135deg,#123f3e 0%,#1a5d5b 45%,#2b8c89 100%);border-bottom:0;color:#fff;padding:18px 22px 22px}
header::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 12% 120%,rgba(255,255,255,.12) 0,transparent 42%),radial-gradient(circle at 92% -30%,rgba(201,169,110,.28) 0,transparent 40%);pointer-events:none}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
header img{width:56px;height:56px;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
header h1{color:#fff;font-size:20px;letter-spacing:.2px}
header .sub{color:rgba(255,255,255,.82)}
header .slogan{display:inline-block;margin-top:4px;font-size:12px;color:var(--gold);font-weight:500}
.weekbar{position:relative;z-index:1}
.weekbar button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:10px}
.weekbar .lbl{color:#fff}
.userbox{position:relative;z-index:1;display:flex;align-items:center;gap:8px;font-size:13px;color:#fff;background:rgba(0,0,0,.18);padding:5px 6px 5px 12px;border-radius:20px}
.userbox button{background:none;border:0;color:var(--gold);font:inherit;cursor:pointer;padding:2px 6px}
nav{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);box-shadow:0 2px 10px rgba(16,60,59,.06);gap:6px;padding:8px 14px;border-bottom:0}
nav button{border:0;border-radius:22px;padding:8px 16px;color:var(--mut)}
nav button.on{background:var(--teal-d);color:#fff;border:0}
.card,.kpi,details.sec{border:1px solid #dfe9e8;border-radius:14px;box-shadow:0 1px 3px rgba(16,60,59,.05),0 6px 18px rgba(16,60,59,.04)}
.kpi{position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--teal),var(--gold))}
.card h2,details.sec>summary{color:var(--teal-d)}
.btn{border-radius:10px}
.btn.p{background:linear-gradient(135deg,var(--teal-d),var(--teal));box-shadow:0 3px 10px rgba(26,93,91,.25)}
th{background:var(--teal-l)}
.tip{border-inline-start-color:var(--gold);background:#fbf7ef}
.days button{border-radius:12px}
.days button.on{background:linear-gradient(135deg,var(--teal-d),var(--teal))}
footer{padding:26px 10px 90px}
footer b{color:var(--teal-d)}
/* شريط الحفظ */
#syncBar{position:fixed;bottom:14px;inset-inline-start:14px;z-index:8;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #dfe9e8;border-radius:24px;padding:6px 8px 6px 14px;box-shadow:0 6px 20px rgba(16,60,59,.15);font-size:13px}
#syncBar .dot{width:9px;height:9px;border-radius:50%;background:#9aa}
#syncBar.ok .dot{background:#2e7d32}#syncBar.busy .dot{background:var(--gold)}#syncBar.err .dot{background:var(--bad)}
#syncBar button{padding:6px 14px}
/* شاشة الدخول */
#login{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#0f3534 0%,#1a5d5b 55%,#2b8c89 100%)}
#login::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 10%,rgba(201,169,110,.25),transparent 40%),radial-gradient(circle at 10% 90%,rgba(255,255,255,.08),transparent 45%)}
#login .box{position:relative;width:100%;max-width:360px;background:#fff;border-radius:22px;padding:30px 26px 24px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#login img{width:110px;margin:-4px auto 6px;display:block}
#login h2{margin:6px 0 2px;color:var(--teal-d);font-size:19px}
#login p{margin:0 0 18px;color:var(--mut);font-size:13px}
#login input{text-align:center;font-size:24px;letter-spacing:10px;padding:12px;border-radius:12px;border:1.5px solid #cfe0df}
#login .btn{width:100%;margin-top:12px;padding:12px;font-size:16px}
#login .err{color:var(--bad);font-size:13px;min-height:20px;margin-top:8px}
#login .gold{color:var(--gold);font-size:12px;margin-top:14px}
@media(max-width:700px){
 header{padding:14px 14px 18px;gap:10px}header img{width:44px;height:44px}header h1{font-size:17px}
 .weekbar{width:100%;justify-content:space-between;flex-wrap:nowrap;gap:6px}.weekbar .lbl{min-width:0;font-size:12.5px;flex:1}.weekbar button{padding:5px 9px;font-size:13px;white-space:nowrap}
 nav{padding:6px 8px}nav button{padding:7px 12px;font-size:13px}
 main{padding:12px}.card{padding:14px}
}
@media(max-width:760px){
 table.acttbl thead{display:none}
 table.acttbl,table.acttbl tbody{display:block;border:0}
 table.acttbl tr{display:grid;grid-template-columns:34px 1fr 1fr 34px;gap:4px 8px;border:1px solid #dfe9e8;border-radius:12px;padding:10px;margin-bottom:10px;background:#fff;position:relative}
 table.acttbl tr.rowlate{border-color:#f1b5ae;background:#fff6f5}
 table.acttbl td{display:block;border:0;padding:0;background:transparent!important}
 table.acttbl td[data-l]:not([data-l="تم"])::before{content:attr(data-l);display:block;font-size:11px;color:var(--mut)}
 table.acttbl td[data-l="تم"]{grid-row:1;grid-column:1;padding-top:4px}table.acttbl td[data-l="تم"] input{width:22px;height:22px}
 table.acttbl td.c-t{grid-row:1;grid-column:2/4}table.acttbl td.c-t textarea{font-weight:700;font-size:15px}
 table.acttbl td.c-del{grid-row:1;grid-column:4}
 table.acttbl td.c-d,table.acttbl td.c-x{grid-column:1/5}
 table.acttbl td[data-l="البناية"]{grid-column:1/3}
 table.acttbl td[data-l="يوم التنفيذ"]{grid-column:3/5}
 table.acttbl td[data-l="الحالة"]{grid-column:1/5}
 table.acttbl select,table.acttbl textarea{background:#f6f9f9!important;border-radius:8px!important;padding:6px 8px!important}
}
@media print{#syncBar,#login,.userbox{display:none!important}header{background:#fff!important}}
</style>

function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

/* ---- editable table helper ---- */
function listTable(arr,cols,addLabel){
 let h='<div style="overflow-x:auto"><table><thead><tr><th style="width:30px">#</th>'+cols.map(c=>`<th${c.w?` style="min-width:${c.w}"`:''}>${c.label}</th>`).join('')+'<th style="width:36px"></th></tr></thead><tbody>';
 if(!arr.length)h+=`<tr><td colspan="${cols.length+2}" class="empty">لا يوجد بنود بعد</td></tr>`;
 arr.forEach((r,i)=>{h+=`<tr><td>${i+1}</td>`+cols.map(c=>{const v=r[c.k]??'',a=`data-i="${i}" data-k="${c.k}"`;
  if(c.type==='select'){const opts=typeof c.opts==='function'?c.opts():c.opts;return `<td><select ${a}>${opts.map(o=>{const val=Array.isArray(o)?o[0]:o,lab=Array.isArray(o)?o[1]:o;return `<option value="${esc(val)}"${val==v?' selected':''}>${esc(lab)}</option>`}).join('')}</select></td>`}
  if(c.type==='area')return `<td><textarea ${a}>${esc(v)}</textarea></td>`;
  if(c.type==='num')return `<td><input type="number" min="0" step="${c.step||5}" ${a} value="${esc(v)}"></td>`;
  return `<td><input ${a} value="${esc(v)}"></td>`}).join('')+`<td><button class="btn x" data-del="${i}" title="حذف">×</button></td></tr>`});
 return h+`</tbody></table></div><div class="row"><button class="btn s" data-add>+ ${addLabel}</button></div>`;
}

}

const TODAY=(()=>{const d=new Date();d.setHours(12,0,0,0);return d})();
const pd=s=>{if(!s)return null;const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const dLabel=s=>{const d=pd(s);return d?DAYN[(d.getDay()+6)%7]+' '+d.getDate()+'/'+(d.getMonth()+1):'بدون موعد'};

const execs=a=>Array.isArray(a.exec)?a.exec:(a.exec?String(a.exec).split(/\s*\+\s*/).filter(x=>x&&x!=='يُحدد'):[]);
function dateOpts(cur){const o=[['','— بدون موعد —']];const st=addD(monday(TODAY),-7);for(let i=0;i<28;i++){const d=addD(st,i),v=iso(d);if(((d.getDay()+6)%7)===OFF)continue;o.push([v,dLabel(v)])}
 if(cur&&!o.some(x=>x[0]===cur))o.push([cur,dLabel(cur)]);return o.map(([v,l])=>`<option value="${v}"${v===cur?' selected':''}>${l}${v===iso(TODAY)?' (اليوم)':''}</option>`).join('')}

function actRow(a){const i=S.actions.indexOf(a),late=isLate(a);
 return `<tr class="${a.s==='تم'?'rowdone':late?'rowlate':''}">
 <td data-l="تم"><input type="checkbox" data-done="${i}"${a.s==='تم'?' checked':''} title="تم"></td>
 <td data-l="البناية"><select data-f2="b" data-i="${i}">${ACT_B.map(o=>`<option value="${o}"${o===a.b?' selected':''}>${SHORT(o)}</option>`).join('')}</select></td>
 <td data-l="المهمة" class="c-t"><textarea data-f2="t" data-i="${i}" placeholder="اكتب المهمة">${esc(a.t)}</textarea>${a.kind==='جانبية'?'<span class="pill">جانبية</span>':''}${late?'<span class="pill" style="background:#fde8e6;color:var(--bad)">متأخرة</span>':''}</td>

 <td class="c-del"><button class="btn x" data-delx="${i}" title="حذف">×</button></td></tr>`}
const ACT_HEAD='<thead><tr><th style="width:30px">✓</th><th style="width:105px">البناية</th><th style="min-width:170px">المهمة</th><th style="min-width:150px">التفاصيل</th><th style="min-width:170px">المنفّذ</th><th style="width:150px">يوم التنفيذ</th><th style="width:90px">الحالة</th><th style="width:34px"></th></tr></thead>';

 const keys=Object.keys(per);if(!keys.length)tt+='<tr><td colspan="6" class="empty">لا توجد إدخالات يومية لهذا الأسبوع</td></tr>';
 keys.forEach(k=>{const t=taskById(k),p=per[k],a=Math.round(p.min/p.n),e=t?+t.est||0:0,d=a-e;
  tt+=`<tr><td>${t?esc(t.t):'مهام غير مسجلة'}</td><td>${p.n}</td><td>${hrs(p.min)}</td><td>${hrs(a)}</td><td>${t?hrs(e):'—'}</td><td class="${t&&d>0?'st-no':'st-done'}">${t?(d>0?'+':'')+d+' د':'—'}</td></tr>`});
 tt+='</tbody></table></div>';
 // per area
 const ar={};items.forEach(x=>{const t=taskById(x.task),k=t?t.area:'أخرى';ar[k]=(ar[k]||0)+(+x.min||0)});
 let at='';Object.entries(ar).sort((a,b)=>b[1]-a[1]).forEach(([k,m])=>{const p=totMin?Math.round(m/totMin*100):0;at+=`<tr><td>${k}</td><td>${hrs(m)}</td><td><div class="bar"><i style="width:${p}%"></i></div>${p}%</td></tr>`});
 const ov=S.tasks.filter(t=>t.ov&&t.ov!=='لا يوجد'),dv=S.tasks.filter(t=>t.dev);
 el.innerHTML=`<div class="kpis">
 <div class="kpi"><b>${hrs(totMin)}</b><span>إجمالي وقت العمل المسجل</span></div>
 <div class="kpi"><b>${daysIn} / 6</b><span>أيام تم إدخالها</span></div>
 <div class="kpi"><b>${done} / ${items.length}</b><span>أعمال منجزة</span></div>
 <div class="kpi"><b>${avg}%</b><span>متوسط إنجاز الأهداف</span></div></div>
 <div class="kpis">
 <div class="kpi"><b>${items.length?Math.round(done/items.length*100):0}%</b><span>نسبة الإنجاز الأسبوعية</span></div>
 <div class="kpi"><b>${nAbs}</b><span>حالات غياب/تأخير</span></div>
 <div class="kpi"><b>${nComp}</b><span>شكاوى نزلاء</span></div>
 <div class="kpi"><b>${nFault}</b><span>أعطال (مفتوح: ${nOpen})</span></div></div>
 <div class="card"><h2>الوقت حسب المهمة (الفعلي مقابل المتوقع)</h2>${tt}</div>
 <div class="card"><h2>توزيع الوقت حسب المجال</h2><table><thead><tr><th>المجال</th><th>الوقت</th><th style="width:200px">النسبة</th></tr></thead><tbody>${at||'<tr><td colspan="3" class="empty">—</td></tr>'}</tbody></table></div>
 <div class="grid2"><div class="card"><h2>المهام المتداخلة</h2>${ov.length?ov.map(t=>`<p style="margin:6px 0"><b>${esc(t.t)}</b> <span class="pill">${esc(t.ov)}</span><br><span class="saveinfo">${esc(t.ovd)}</span></p>`).join(''):'<p class="empty">لا يوجد</p>'}</div>
 <div class="card"><h2>أفكار التطوير</h2>${dv.length?dv.map(t=>`<p style="margin:6px 0"><b>${esc(t.t)}</b><br><span class="saveinfo">${esc(t.dev)}</span></p>`).join(''):'<p class="empty">لا يوجد</p>'}</div></div>
 <div class="card"><h2>تقييم الأسبوع (في اجتماع الاثنين التالي)</h2>
 <div class="grid3"><div><label>التقييم العام</label><select data-f="score">${['','ممتاز','جيد جداً','جيد','يحتاج تحسين'].map(o=>`<option${o==w.review.score?' selected':''}>${o}</option>`).join('')}</select></div></div>
 <div class="grid2">${field(w.review,'mgr','ملاحظات الإدارة')}${field(w.review,'next','ما ننقله للأسبوع القادم')}</div></div>
 <div class="card"><h2>ملخص جاهز للنسخ (واتساب)</h2><pre class="sum" id="sum"></pre><div class="row"><button class="btn s" id="cp">نسخ الملخص</button></div></div>`;
 bindFields(el,w.review);
 const s=`*خطة العمل الأسبوعية – الإشراف العام*\nأسبوع ${fmt(wk)} – ${fmt(addD(wk,6))}\n\n*الأهداف:*\n`+(w.goals.map((g,i)=>`${i+1}. ${g.t} — ${g.pct||0}%`).join('\n')||'—')+
 `\n\n*نسبة الإنجاز:* ${items.length?Math.round(done/items.length*100):0}%\n*وقت العمل المسجل:* ${hrs(totMin)}\n*أيام الإدخال:* ${daysIn} من 6\n*الأعمال المنجزة:* ${done} من ${items.length}\n*غياب/تأخير:* ${nAbs} · *شكاوى:* ${nComp} · *أعطال:* ${nFault} (مفتوح ${nOpen})`+(w.review.score?`\n*التقييم:* ${w.review.score}`:'')+(w.review.next?`\n\n*للأسبوع القادم:*\n${w.review.next}`:'');
 el.querySelector('#sum').textContent=s;
 el.querySelector('#cp').onclick=()=>navigator.clipboard.writeText(s).then(()=>toast('تم نسخ الملخص')).catch(()=>toast('حدد النص وانسخه يدوياً'));
};

/* ---- 5. REPORT ---- */
function rateAvg(o){const v=['lobby','elev','facade','wc'].map(k=>o?.[k]).filter(Boolean);if(!v.length)return '—';const sc={'ممتاز':4,'جيد':3,'مقبول':2,'ضعيف':1},a=v.reduce((s,x)=>s+sc[x],0)/v.length;return a>=3.5?'ممتاز':a>=2.5?'جيد':a>=1.5?'مقبول':'ضعيف'}
function repHTML(){const w=W();let items=[],daysIn=0,abs=[],comp=[],flt=[],lin=[],recs=[];const lastU={};
 [0,1,2,3,5,6].forEach(i=>{const d=w.days[i];if(!d)return;if(d.items?.length)daysIn++;items=items.concat(d.items||[]);
  const dn=DAYN[i]+' '+fmt(addD(wk,i)).slice(0,-5);
  (d.absent||[]).forEach(x=>abs.push({...x,dn}));(d.comp||[]).forEach(x=>comp.push({...x,dn}));(d.faults||[]).forEach(x=>flt.push({...x,dn}));(d.linen||[]).forEach(x=>lin.push({...x,dn}));
  (d.units||[]).forEach(u=>{if((+u.ready)+(+u.cleaning)+(+u.maint))lastU[u.b]={...u,dn}});if(d.rec?.mgmt)recs.push(dn+': '+d.rec.mgmt)});
 const done=items.filter(x=>x.s==='تم').length,pct=items.length?Math.round(done/items.length*100):0,tot=items.reduce((a,x)=>a+(+x.min||0),0);
 const T=(h,rows,empty)=>`<table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${h.length}" style="text-align:center;color:#777">${empty||'لا يوجد'}</td></tr>`}</tbody></table>`;
 const dayRows=[0,1,2,3,5,6].map(i=>{const d=w.days[i]||{},it=d.items||[];return [DAYN[i]+' '+fmt(addD(wk,i)),SCHED[i].filter(x=>!x.startsWith('الاجتماع')).map(SHORT).join('، '),`${it.filter(x=>x.s==='تم').length} / ${it.length}`,hrs(it.reduce((a,x)=>a+(+x.min||0),0)),rateAvg(d.clean),(d.absent||[]).length,(d.comp||[]).length,(d.faults||[]).length]});
 const ovd=S.tasks.filter(t=>t.ov&&t.ov!=='لا يوجد'),dev=S.tasks.filter(t=>t.dev);
 let hn=0;
 return `<div class="rep" id="rep">
 <div class="rh"><img src="icons/logo-mark.png"><div><h1>التقرير الأسبوعي – الإشراف العام</h1><div class="meta">شركة العالمية السعيدة المتحدة ش.م.م – نسائم صلالة · المشرف العام: عبدالسلام حامد<br>الفترة: ${fmt(wk)} – ${fmt(addD(wk,6))} · مقدَّم إلى: المدير العام · تاريخ الإصدار: ${fmt(new Date())}</div></div></div>
 <h3>${AR(++hn)}. الملخص</h3>${T(['نسبة الإنجاز','وقت العمل المسجل','أيام الإدخال','غياب / تأخير','شكاوى النزلاء','أعطال (مفتوحة)','التقييم العام'],[[pct+'%',hrs(tot),daysIn+' من 6',abs.length,comp.length,flt.length+' ('+flt.filter(f=>f.st!=='تم الإصلاح').length+')',w.review.score||'—']])}
 <h3>${AR(++hn)}. المهام والمعلقات</h3>${T(['يوم التنفيذ','البناية','المهمة','التفاصيل','المنفّذ','النوع','الحالة'],[...S.actions].sort((x,y)=>(x.date||'9').localeCompare(y.date||'9')).map(a=>[dLabel(a.date),SHORT(a.b),a.t,a.d,a.exec.join('، ')||'—',a.kind,isLate(a)?'متأخرة':a.s]))}
 <h3>${AR(++hn)}. أهداف الأسبوع</h3>${T(['#','الهدف','المؤشر','البناية','الأولوية','الإنجاز'],w.goals.map((g,i)=>[i+1,g.t,g.kpi,g.b,g.pri,(g.pct||0)+'%']))}
 <h3>${AR(++hn)}. سجل العمل اليومي</h3>${T(['اليوم','البنايات','المنجز','الوقت','النظافة العامة','غياب','شكاوى','أعطال'],dayRows)}
 <h3>${AR(++hn)}. حالة الشقق (آخر تحديث لكل بناية)</h3>${T(['البناية','جاهزة للتسكين','تحت التنظيف','تحتاج صيانة','ملاحظة','التاريخ'],Object.values(lastU).map(u=>[u.b,u.ready,u.cleaning,u.maint,u.note,u.dn]))}
 <h3>${AR(++hn)}. الموظفون – الغياب والتأخير</h3>${T(['اليوم','الموظف','الحالة','البديل','ملاحظة'],abs.map(x=>[x.dn,x.name,x.st,x.sub,x.note]))}
 <h3>${AR(++hn)}. ملاحظات البياضات والأثاث</h3>${T(['اليوم','البناية','الشقة','النوع','الملاحظة','الإجراء'],lin.map(x=>[x.dn,x.b,x.unit,x.type,x.t,x.act]))}
 <h3>${AR(++hn)}. شكاوى النزلاء</h3>${T(['اليوم','البناية','الشقة','الشكوى','الإجراء','الحالة'],comp.map(x=>[x.dn,x.b,x.unit,x.t,x.act,x.st]))}
 <h3>${AR(++hn)}. الأعطال والطوارئ</h3>${T(['اليوم','البناية','الشقة','النوع','الوصف','أُبلغت الصيانة','الحالة'],flt.map(x=>[x.dn,x.b,x.unit,x.type,x.t,x.sent,x.st]))}
 <h3>${AR(++hn)}. المهام المتداخلة وأفكار التطوير</h3>${T(['المهمة','متداخلة مع','شرح التداخل','فكرة التطوير'],S.tasks.filter(t=>(t.ov&&t.ov!=='لا يوجد')||t.dev).map(t=>[t.t,t.ov,t.ovd,t.dev]))}
 <h3>${AR(++hn)}. التوصيات وملاحظات للإدارة</h3>${T(['البند','التفاصيل'],[...recs.map(r=>['ملاحظة يومية',r]),...(w.review.mgr?[['ملاحظات الإدارة',w.review.mgr]]:[]),...(w.review.next?[['للأسبوع القادم',w.review.next]]:[])])}
 <div class="sig"><div>المشرف العام<br>عبدالسلام حامد</div><div>مساعد المدير العام<br>علي البسيسي</div><div>اعتماد المدير العام<br>وضاح عبدالرقيب</div></div></div>`}
V.report=el=>{el.innerHTML=`<div class="row noprint" style="margin:0 0 12px"><button class="btn p" id="pdfBtn">🖨 طباعة / حفظ PDF</button><span class="saveinfo">في نافذة الطباعة اختر «حفظ بصيغة PDF» لتحصل على ملف.</span></div><div style="overflow-x:auto">${repHTML()}</div>`;
 el.querySelector('#pdfBtn').onclick=()=>window.print()};
const DEMO_WK='2026-11-09';
function demoBar(){const box=document.getElementById('demoBar');if(!S.demo){box.innerHTML='';return}
 box.innerHTML=`<div class="tip" style="margin:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span>تحتوي الصفحة على <b>بيانات تجريبية</b> لأسبوع 9/11 – 15/11/2026 للتجربة.</span><button class="btn s" id="dShow">عرض الأسبوع التجريبي</button><button class="btn s" id="dClr" style="border-color:var(--bad);color:var(--bad)">مسح البيانات التجريبية</button></div>`;
 box.querySelector('#dShow').onclick=()=>{wk=monday(new Date(2026,10,9));dayIdx=0;render()};
 let armed=false;box.querySelector('#dClr').onclick=e=>{if(!armed){armed=true;e.target.textContent='اضغط مرة أخرى للتأكيد';return}
  delete S.weeks[DEMO_WK];S.tasks=S.tasks.filter(t=>!t.demo);S.demo=false;mark();render();toast('تم المسح – اضغط حفظ')}}
function render(){demoBar();document.getElementById('weekLbl').textContent=`أسبوع ${fmt(wk)} – ${fmt(addD(wk,6))}`;
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));V[tab](document.getElementById('view'))}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
document.getElementById('prevW').onclick=()=>{wk=addD(wk,-7);render()};
document.getElementById('nextW').onclick=()=>{wk=addD(wk,7);render()};

/* ===== الحفظ في قاعدة البيانات (Google Sheets) ===== */
let REV=LS.get('ns-sup-rev')||'',PIN=LS.get('ns-sup-pin')||'',USER=null,saving=false;
function setSync(cls,t){const s=document.getElementById('syncBar');s.className=cls;document.getElementById('saveInfo').textContent=t}
async function call(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});return r.json()}
function applyServer(res){if(res.data){S=res.data;normalize();LS.set('ns-sup-cache',JSON.stringify(S))}REV=res.rev||'';LS.set('ns-sup-rev',REV)}
async function load(quiet){if(!API)return;try{if(!quiet)setSync('busy','جارٍ التحميل...');const res=await call({action:'load',pin:PIN});
  if(!res.ok){if(res.error==='pin'){showLogin('رقم الدخول غير صحيح');return}throw new Error(res.error)}
  USER=res.user;showUser();if(res.data)applyServer(res);else{REV='';await save(true,'إنشاء البيانات الأولى')}
  dirty=false;setSync('ok','محفوظ ✓');render()}catch(e){setSync('err','غير متصل – البيانات محفوظة على الجهاز')}}
async function save(auto,note){if(!API){LS.set('ns-sup-cache',JSON.stringify(S));dirty=false;setSync('ok','محفوظ على هذا الجهاز');if(!auto)toast('تم الحفظ على هذا الجهاز');return}
 if(saving){clearTimeout(window._as);window._as=setTimeout(()=>save(auto,note),1500);return}
 saving=true;setSync('busy','جارٍ الحفظ...');S.savedAt=Date.now();
 try{const res=await call({action:'save',pin:PIN,rev:REV,data:S,note:note||''});
  if(res.ok){REV=res.rev;LS.set('ns-sup-rev',REV);dirty=false;setSync('ok','محفوظ ✓ '+new Date().toLocaleTimeString('ar-OM',{hour:'2-digit',minute:'2-digit'}));if(!auto)toast('تم الحفظ')}
  else if(res.error==='conflict'){applyServer(res);dirty=false;render();setSync('ok','تم تحميل آخر نسخة');toast('عُدّلت البيانات من جهاز آخر – تم تحميل آخر نسخة، أعد تعديلك الأخير إن لزم')}
  else if(res.error==='pin'){showLogin('انتهت الجلسة، أدخل رقم الدخول')}
  else throw new Error(res.error)}
 catch(e){setSync('err','لم يُحفظ – تحقق من الإنترنت');if(!auto)toast('تعذّر الحفظ – سيُعاد المحاولة')}
 finally{saving=false}}
function showUser(){const u=document.getElementById('userBox');if(USER){u.style.display='flex';document.getElementById('userName').textContent='مرحباً، '+USER.name}}
function showLogin(err){document.getElementById('login').style.display='flex';document.getElementById('loginErr').textContent=err||'';setTimeout(()=>document.getElementById('pin').focus(),50)}
document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const p=document.getElementById('pin').value.trim();if(!p)return;
 const btn=document.getElementById('loginBtn');btn.disabled=true;btn.textContent='جارٍ التحقق...';
 try{const res=await call({action:'load',pin:p});if(res.ok){PIN=p;LS.set('ns-sup-pin',p);USER=res.user;document.getElementById('login').style.display='none';showUser();
   if(res.data)applyServer(res);else{REV='';await save(true,'إنشاء البيانات الأولى')}setSync('ok','محفوظ ✓');render()}
  else document.getElementById('loginErr').textContent=res.error==='pin'?'رقم الدخول غير صحيح':'خطأ: '+res.error}
 catch(e){document.getElementById('loginErr').textContent='تعذّر الاتصال – تحقق من الإنترنت'}
 btn.disabled=false;btn.textContent='دخول'};
document.getElementById('logout').onclick=()=>{LS.del('ns-sup-pin');LS.del('ns-sup-cache');LS.del('ns-sup-rev');location.reload()};
document.getElementById('saveBtn').onclick=()=>{clearTimeout(window._as);save(false)};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&API&&PIN&&!dirty&&!saving)load(true)});
render();
if(!API){setSync('','وضع محلي – البيانات على هذا الجهاز فقط')}
else if(!PIN){showLogin()}else{load()}
</script>
