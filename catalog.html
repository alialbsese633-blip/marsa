<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#031518">
<meta name="apple-mobile-web-app-title" content="مرسى Marsa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script src="hr-config.js"></script>
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="icons/m3-apple-180.png">
<link rel="icon" type="image/png" sizes="48x48" href="icons/m3-favicon-48.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
/* =====================================================================
   الكتالوج — كتالوج فروع نسائم صلالة (تكليف ASG-012/2026)
   عرض تقديمي على هيئة كتاب يُقلَّب: يحمله الموظف على الآيباد ويعرضه على الشركات.
   الهوية: فيروزي الشعار (#00717F / #18A4B8) مع ذهب اللبان، وخط Reem Kufi القريب من حروف الشعار.
   ===================================================================== */
:root{color-scheme:dark;
  --night:#031518;--deep:#0B3E45;--lagoon:#00717F;--sky:#18A4B8;--mist:#CFE3E3;
  --ink:#0F2A2E;--ink-2:#46605F;--mute:#7C9092;--line:#E3E9E8;
  --gold:#B08D57;--gold-ink:#8A6A36;--gold-hi:#E9D3A1;
  --foil:linear-gradient(115deg,#94723F 0%,#E8D29F 22%,#B08D57 40%,#F5E6C2 58%,#A27F47 78%,#DCC28A 100%);
  --display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --font:"IBM Plex Sans Arabic","Inter",-apple-system,"Segoe UI",Tahoma,sans-serif;
  --latin:"Inter","IBM Plex Sans Arabic",-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);--turn:cubic-bezier(.645,.045,.355,1)}
html[lang=en]{--font:"Inter","IBM Plex Sans Arabic",-apple-system,"Segoe UI",sans-serif}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%;color:#E6F0EF;font:16px/1.6 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:radial-gradient(1100px 620px at 50% -8%,#0F4C54 0,transparent 62%),radial-gradient(900px 520px at 50% 112%,#0A3439 0,transparent 60%),var(--night)}
body.reading{overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
html[dir=ltr] .flip{transform:scaleX(-1)}
.foil-t{background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent}
.mk{display:inline-block;background:var(--foil);-webkit-mask:url(icons/logo-mark-white.png) center/contain no-repeat;mask:url(icons/logo-mark-white.png) center/contain no-repeat}

/* ---------- المكتبة (اختيار الفرع) ---------- */
.top{max-width:1180px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 20px 0;display:flex;align-items:center;gap:10px}
.sp{flex:1}
.gbtn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 15px;border-radius:999px;border:1px solid rgba(233,211,161,.24);background:rgba(255,255,255,.04);color:#F1E6CC;font-weight:600;font-size:14px;text-decoration:none;cursor:pointer;transition:background .2s,border-color .2s}
.gbtn:hover{background:rgba(255,255,255,.09);border-color:rgba(233,211,161,.45)}
.gbtn svg.i{width:18px;height:18px}
.s-hero{text-align:center;padding:22px 20px 0}
.s-logo{display:block;margin:0 auto;width:118px;height:118px;background:var(--foil);-webkit-mask:url(icons/logo-full.png) center/contain no-repeat;mask:url(icons/logo-full.png) center/contain no-repeat}
.s-hero h1{margin:12px 0 0;font:600 clamp(30px,5vw,46px)/1.25 var(--display)}
.s-hero p{margin:6px auto 0;max-width:48ch;color:rgba(230,240,239,.7);font-size:15px}
.shelf{max-width:1180px;margin:0 auto;padding:40px 28px 30px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:52px 34px;list-style:none}
.tome-w{display:flex;flex-direction:column;align-items:center;min-width:0}
.tome{position:relative;display:block;width:100%;aspect-ratio:1/1.3;border:0;padding:0;background:none;cursor:pointer;perspective:1300px;transition:transform .5s var(--ease)}
.tome::after{content:"";position:absolute;left:5%;right:5%;bottom:-20px;height:26px;background:radial-gradient(closest-side,rgba(0,0,0,.65),transparent);z-index:-1}
.t-pages{position:absolute;top:1.4%;bottom:1.4%;inset-inline-start:0;inset-inline-end:1.6%;border-radius:4px;background:repeating-linear-gradient(90deg,#FBFCFB 0 2px,#DCE4E3 2px 3px)}
.t-cover{position:absolute;inset:0;container-type:inline-size;overflow:hidden;transform-origin:right center;transition:transform .7s var(--ease),box-shadow .7s;border-radius:9px 3px 3px 9px;box-shadow:0 22px 40px -18px rgba(0,0,0,.8),0 2px 0 rgba(255,255,255,.04) inset}
html[dir=ltr] .t-cover{transform-origin:left center;border-radius:3px 9px 9px 3px}
@media (hover:hover){
  .tome.ready:hover{transform:translateY(-6px)}
  html[dir=rtl] .tome.ready:hover .t-cover{transform:rotateY(24deg)}
  html[dir=ltr] .tome.ready:hover .t-cover{transform:rotateY(-24deg)}
}
.tome.wait{cursor:default}
.t-cap{margin-top:24px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13.5px;text-align:center}
.t-cap .go{color:var(--gold-hi);font-weight:600}
.t-cap .wt{color:rgba(230,240,239,.55)}
.achip{display:inline-flex;align-items:center;gap:7px;padding:3px 10px;border-radius:999px;border:1px solid rgba(207,227,227,.18);background:rgba(255,255,255,.04);color:rgba(230,240,239,.8);font-size:12px;cursor:pointer}
.achip i{display:block;width:44px;height:4px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.achip i b{display:block;height:100%;background:var(--gold)}
.s-foot{max-width:1180px;margin:0 auto;padding:22px 24px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 20px;font-size:12.5px;color:rgba(230,240,239,.45);border-top:1px solid rgba(233,211,161,.1)}

/* ---------- غلاف الكتاب (يُستخدم في المكتبة وداخل الكتاب) ---------- */
.cov{position:absolute;inset:0;font-size:3.4cqw;display:flex;flex-direction:column;align-items:center;text-align:center;padding:2.3em 2em 2.1em;color:#fff;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.018) 0 .12em,transparent .12em .3em),radial-gradient(120% 85% at 50% 0%,#0F5059 0%,#0A363C 55%,#052124 100%)}
.cov::before,.cov::after{content:"";position:absolute;pointer-events:none}
.cov::before{inset:1.05em;border:1px solid rgba(233,211,161,.55)}
.cov::after{inset:1.4em;border:1px solid rgba(233,211,161,.22)}
.cov .spine{position:absolute;top:0;bottom:0;inset-inline-start:0;width:4.5%;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.07) 45%,rgba(0,0,0,.28))}
.cov .mk{width:2.4em;height:2.5em}
.cov .brand{margin-top:.45em;font:500 .92em/1.3 var(--display)}
.cov .brand small{display:block;margin-top:.15em;font:600 .5em var(--latin);letter-spacing:.34em}
.arch{position:relative;margin-top:1.3em;width:60%;aspect-ratio:1/1.12;padding:.2em;background:var(--foil);border-radius:50% 50% .45em .45em/42% 42% .45em .45em;flex:none}
.arch img,.arch .ph-in{display:block;width:100%;height:100%;object-fit:cover;border-radius:50% 50% .3em .3em/42% 42% .3em .3em}
.arch .ph-in{display:grid;place-items:center;background:radial-gradient(90% 70% at 50% 35%,#0F5059,#062A2F)}
.arch .ph-in .mk{width:5em;height:5.2em;opacity:.35}
.cov h2{margin:.85em 0 0;font:600 2.1em/1.25 var(--display)}
.cov .en{margin-top:.25em;font:500 .74em var(--latin);letter-spacing:.14em;color:var(--gold-hi)}
.cov .kick{margin-top:auto;display:flex;align-items:center;gap:.7em;font-size:.74em;color:rgba(255,255,255,.78)}
.cov .kick::before,.cov .kick::after{content:"";width:2.2em;height:1px;background:var(--gold)}
.cov.backc{justify-content:center;gap:.4em}
.cov.backc .logo{width:12em;height:12em;background:var(--foil);-webkit-mask:url(icons/logo-full.png) center/contain no-repeat;mask:url(icons/logo-full.png) center/contain no-repeat}
.cov.backc p{margin:.3em 0 0;font-size:.82em;color:rgba(255,255,255,.8)}
.cov.backc .ph{all:unset;margin-top:1.4em;font:600 1.15em var(--latin);color:var(--gold-hi);direction:ltr;unicode-bidi:isolate}

/* ---------- العارض ---------- */
.reader{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
  background:radial-gradient(1200px 760px at 50% 46%,#0E4A52 0%,#062A2F 48%,#031518 100%)}
.reader[hidden]{display:none}
.r-top,.r-bot{position:relative;z-index:5;flex:none;display:flex;align-items:center;gap:8px;padding:8px 14px;min-height:58px}
.r-ttl{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:10px;font:500 16px var(--display);color:var(--gold-hi);white-space:nowrap;overflow:hidden}
.r-ttl .mk{width:22px;height:23px}
.r-ttl span{overflow:hidden;text-overflow:ellipsis}
.rb{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(233,211,161,.26);background:rgba(255,255,255,.05);color:#F3E7CB;cursor:pointer;transition:background .2s,border-color .2s,opacity .2s}
.rb:hover{background:rgba(255,255,255,.1);border-color:rgba(233,211,161,.5)}
.rb[disabled]{opacity:.3;cursor:default}
.rb.big{width:54px;height:54px}
.rb.pill{width:auto;padding:0 16px;border-radius:999px;display:inline-flex;gap:8px;font-weight:600;font-size:14px}
.r-bot{justify-content:center;gap:14px}
.r-ind{min-width:96px;text-align:center;font:600 15px var(--latin);color:#F3E7CB;letter-spacing:.04em}
.r-ind small{display:block;font:500 11.5px var(--font);color:rgba(230,240,239,.55);letter-spacing:0}
.stage{position:relative;flex:1;min-height:0;display:grid;place-items:center;touch-action:pan-y;overflow:hidden}
.book-pos{position:relative;transition:transform .95s var(--turn)}
.bshadow{position:absolute;bottom:-30px;height:46px;background:radial-gradient(closest-side,rgba(0,0,0,.6),transparent);pointer-events:none;transition:left .95s var(--turn),width .95s var(--turn)}
.book{position:relative;perspective:2800px}
.leaf{position:absolute;top:0;width:var(--pw);height:var(--ph);transform-style:preserve-3d;transition:transform var(--dur,.95s) var(--turn)}
html[dir=ltr] .leaf{transform-origin:left center}
html[dir=rtl] .leaf{transform-origin:right center}
.leaf.gone{visibility:hidden}
.face{position:absolute;inset:0;overflow:hidden;container-type:inline-size;background:#fff;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.face.front{border-start-end-radius:6px;border-end-end-radius:6px}
.face.back{border-start-start-radius:6px;border-end-start-radius:6px}
.gut{position:absolute;top:0;bottom:0;width:10%;pointer-events:none;z-index:9}
.front .gut{inset-inline-start:0}.back .gut{inset-inline-end:0}
html[dir=ltr] .front .gut,html[dir=rtl] .back .gut{background:linear-gradient(to right,rgba(9,40,44,.2),rgba(9,40,44,.05) 45%,transparent)}
html[dir=rtl] .front .gut,html[dir=ltr] .back .gut{background:linear-gradient(to left,rgba(9,40,44,.2),rgba(9,40,44,.05) 45%,transparent)}
.face.nogut .gut{opacity:.5}
.shade{position:absolute;inset:0;z-index:10;pointer-events:none;opacity:var(--sh,0);background:linear-gradient(90deg,rgba(3,21,24,.42),rgba(3,21,24,.12))}
.leaf.turn .shade{animation:shade var(--dur,.95s) ease-in-out}
@keyframes shade{0%,100%{opacity:0}50%{opacity:1}}
.edge{position:absolute;top:.7%;bottom:.7%;width:var(--t,0px);z-index:0;background:repeating-linear-gradient(90deg,#FBFCFB 0 1px,#D3DDDC 1px 2px);transition:width .95s var(--turn)}
html[dir=ltr] .edge.un{left:100%;border-radius:0 3px 3px 0}html[dir=ltr] .edge.fl{right:100%;border-radius:3px 0 0 3px}
html[dir=rtl] .edge.un{right:100%;border-radius:3px 0 0 3px}html[dir=rtl] .edge.fl{left:100%;border-radius:0 3px 3px 0}
.hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:30;padding:9px 18px;border-radius:999px;background:rgba(3,21,24,.78);border:1px solid rgba(233,211,161,.3);color:#F3E7CB;font-size:13.5px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .5s}
.hint.on{opacity:1}

/* ---------- صفحات الكتاب ---------- */
.pg{position:absolute;inset:0;font-size:3.4cqw;display:flex;flex-direction:column;padding:2em 2.2em 0;color:var(--ink);background:#fff;text-align:start}
.pg.tint{background:linear-gradient(180deg,#F3F7F7,#FFFFFF 40%)}
.pg .t{margin:0;font:600 1.9em/1.25 var(--display);color:var(--deep)}
.pg .t-en{margin-top:.1em;font:500 .68em var(--latin);letter-spacing:.08em;color:var(--gold-ink)}
.rule{flex:none;width:3.2em;height:2px;margin:.75em 0 1em;background:var(--foil)}
.pf{flex:none;margin-top:auto;height:3.5em;display:flex;align-items:center;gap:.6em;font-size:.62em;color:var(--mute);border-top:1px solid var(--line)}
.pf .mk{width:1.1em;height:1.15em}
.pf .n{margin-inline-start:auto;font:600 1.25em var(--latin);color:var(--deep)}
.lead{margin:0;font-size:.9em;line-height:1.85;color:var(--ink-2)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1em 1.3em;margin:1.3em 0 1.2em}
.fact{border-inline-start:2px solid var(--gold);padding-inline-start:.75em}
.fact .n{font:700 2.35em/1.05 var(--latin);color:var(--deep);font-variant-numeric:lining-nums}
.fact .n small{font:600 .36em var(--font);color:var(--gold-ink);margin-inline-start:.35em}
.fact .l{margin-top:.25em;font-size:.72em;line-height:1.45;color:var(--ink-2)}
.ph{position:relative;display:block;width:100%;padding:0;border:0;overflow:hidden;border-radius:.3em;background:#E4ECEC;cursor:zoom-in}
.ph img{display:block;width:100%;height:100%;object-fit:cover}
.ph.pano{aspect-ratio:2.96/1}
.cap{position:absolute;z-index:2;bottom:.75em;inset-inline-start:0;display:flex;align-items:center;gap:.5em;max-width:90%;padding:.42em 1.35em .42em .8em;color:#fff;text-align:start;
  background:linear-gradient(var(--gold),var(--gold)) top/100% 2px no-repeat,linear-gradient(90deg,rgba(7,46,52,.95),rgba(0,113,127,.9));clip-path:polygon(0 0,100% 0,calc(100% - .85em) 100%,0 100%)}
html[dir=rtl] .cap{padding:.42em .8em .42em 1.35em;clip-path:polygon(0 0,100% 0,100% 100%,.85em 100%);background:linear-gradient(var(--gold),var(--gold)) top/100% 2px no-repeat,linear-gradient(270deg,rgba(7,46,52,.95),rgba(0,113,127,.9))}
.cap .mk{width:.95em;height:1em}
.cap b{display:block;font:600 .74em/1.3 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap small{display:block;font:500 .52em/1.3 var(--latin);letter-spacing:.03em;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gal{flex:1;display:flex;flex-direction:column;gap:.6em;min-height:0}
.gal .big{flex:1 1 0;min-height:6em}
.gal .row{display:grid;grid-template-columns:1fr 1fr;gap:.6em;flex:none}
.gal .row .ph{aspect-ratio:1.25/1}
.gal .row .cap b{font-size:.66em}
.pg.bleed{padding:0}
.pg.bleed .fz-h{height:12%;padding:1.6em 2.2em 0}
.half{position:absolute;left:0;right:0;padding:0;border:0;overflow:hidden;background:#0A363C;cursor:zoom-in}
.half img{position:absolute;top:0;height:100%;width:200%;object-fit:cover}
.half.l img{left:0}.half.r img{left:-100%}
.half.b1{top:14%;height:36%}.half.b2{top:52.5%;height:36%}
.pg.bleed .pf{position:absolute;left:2.2em;right:2.2em;bottom:0;font-size:.62em}
.toc{list-style:none;margin:0;padding:0}
.toc button{display:flex;align-items:baseline;gap:.6em;width:100%;padding:.62em 0;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;color:var(--ink);text-align:start}
.toc b{font:500 1.05em var(--display)}
.toc .ld{flex:1;border-bottom:2px dotted #CBD6D5;transform:translateY(-.3em)}
.toc .n{font:700 1.15em var(--latin);color:var(--gold-ink)}
.wm{position:absolute;inset-inline-end:-2em;bottom:2em;width:12em;height:12.5em;opacity:.07;background:var(--deep);-webkit-mask:url(icons/logo-mark-white.png) center/contain no-repeat;mask:url(icons/logo-mark-white.png) center/contain no-repeat;pointer-events:none}
.mapbox{position:relative;display:block;width:100%;aspect-ratio:1.18/1;border:0;padding:0;border-radius:.45em;overflow:hidden;cursor:pointer;color:#fff;text-decoration:none;flex:none;
  background:repeating-radial-gradient(circle at 50% 46%,rgba(255,255,255,.07) 0 1px,transparent 1.5px 1.6em),radial-gradient(90% 80% at 50% 40%,#0F5D67,#0A363C 70%,#062A2F)}
.mapbox::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(233,211,161,.6);pointer-events:none}
.mapbox .pin{position:absolute;left:50%;top:46%;transform:translate(-50%,-100%);display:grid;place-items:center;width:2.8em;height:2.8em;border-radius:50% 50% 50% 0;rotate:-45deg;background:var(--foil);box-shadow:0 .6em 1.2em rgba(0,0,0,.4)}
.mapbox .pin .mk{rotate:45deg;width:1.3em;height:1.35em;background:#0A363C}
.mapbox .mtx{position:absolute;inset:auto 0 1.2em;text-align:center;font:500 .85em var(--display);color:#F3E7CB}
.mapbox .mcta{position:absolute;z-index:2;bottom:.8em;inset-inline-end:.8em;display:inline-flex;align-items:center;gap:.4em;padding:.45em .9em;border-radius:999px;background:rgba(3,21,24,.82);color:#F3E7CB;font-size:.7em;font-weight:600}
.mapbox .mcta svg.i{width:1.2em;height:1.2em}
.mapbox .lmap{position:absolute;inset:0;z-index:0}
.leaflet-container{font-family:var(--font);background:#0A363C}
.mapbox .leaflet-control-attribution{font-size:8px;line-height:1.4;background:rgba(255,255,255,.65)}
.lpin{position:relative;width:46px;height:46px}
.lpin b{position:absolute;inset:0;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--foil);border:2px solid #fff;box-shadow:0 10px 22px -4px rgba(0,0,0,.6)}
.lpin .mk{position:absolute;left:50%;top:50%;width:22px;height:23px;margin:-11.5px 0 0 -11px;background:#0A363C}
.lpin i{position:absolute;left:50%;top:56px;width:46px;height:18px;margin:-9px 0 0 -23px;border-radius:50%;border:2px solid var(--gold-hi);animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.25);opacity:1}100%{transform:scale(1.5);opacity:0}}
.ltag{position:absolute;left:50%;top:66px;transform:translateX(-50%);white-space:nowrap;padding:3px 12px 4px;border-radius:10px;text-align:center;background:rgba(3,21,24,.9);border:1px solid rgba(233,211,161,.65);color:var(--gold-hi);font:500 13px/1.3 var(--display)}
.ltag small{display:block;font:500 11px/1.3 var(--display);color:#fff;opacity:.88}
.npin{position:relative;width:28px;height:28px}
html[dir=rtl] .npin .tx{direction:rtl}
.npin .d{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--lagoon);color:#fff;border:2px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.45)}
.npin .d svg.i{width:15px;height:15px}
.npin.me .d{background:#1E6FD9}
.npin .tx{position:absolute;left:50%;top:33px;transform:translateX(-50%);white-space:nowrap;padding:2px 10px;border-radius:999px;background:rgba(255,255,255,.95);color:var(--deep);font:600 12px/1.6 var(--display);box-shadow:0 4px 10px rgba(0,0,0,.3)}
.npin .tx small{font:700 11px var(--latin);color:var(--gold-ink);margin-inline-start:6px}
.route-i{stroke-dasharray:10 12;animation:dash 1.1s linear infinite}

/* «قريب من الفرع»: الفرع في المركز، وكل مكان على دائرة بحسب وقت الوصول بالسيارة */
function radar(b){
  var N=b.near||[],l=L(),cx=150,cy=104,max=20,R0=18,R1=92,s='';

    '<text x="'+cx+'" y="'+(cy-r(m)-2.5)+'" text-anchor="middle" font-size="7" fill="#8AA3A5" font-family="Inter">'+m+' '+l.minU+'</text>'});
  N.forEach(function(x,i){var a=(-35+i*(360/Math.max(N.length,1)))*Math.PI/180,rr=r(x.min),px=cx+rr*Math.cos(a),py=cy+rr*Math.sin(a),right=Math.cos(a)>=0,lx=px+(right?10:-10);
    s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+px.toFixed(1)+'" y2="'+py.toFixed(1)+'" stroke="#B08D57" stroke-width="1.2" stroke-dasharray="3 2"/>'+
      '<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="6" fill="#00717F" stroke="#fff" stroke-width="2"/>'+
      '<text x="'+lx.toFixed(1)+'" y="'+(py+3.5).toFixed(1)+'" text-anchor="'+(right?'start':'end')+'" direction="ltr" font-size="10" font-weight="600" fill="#0B3E45" font-family="Reem Kufi, IBM Plex Sans Arabic">'+esc(t(x))+'</text>'});
  return '<svg class="radar" viewBox="0 0 300 208" role="img" aria-label="'+esc(l.nearT)+'"><defs><linearGradient id="gf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#94723F"/><stop offset=".45" stop-color="#E8D29F"/><stop offset="1" stop-color="#A27F47"/></linearGradient></defs>'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+R1+'" fill="#F0F6F6"/>'+s+
    '<circle cx="'+cx+'" cy="'+cy+'" r="15" fill="url(#gf)"/><image href="icons/logo-mark-white.png" x="'+(cx-8)+'" y="'+(cy-8.5)+'" width="16" height="17"/></svg>';
}

/* =====================================================================
   محرّك تقليب الصفحات: كل ورقة لها وجهان؛ في العرض المزدوج (آيباد بالعرض والكمبيوتر)
   تظهر صفحتان متقابلتان، وفي العرض المفرد (الجوال والآيباد بالطول) صفحة واحدة.
   الكتاب العربي يُقلَّب من اليسار إلى اليمين، والإنجليزي بالعكس.
   ===================================================================== */
var R={b:null,spread:true,pages:[],leaves:[],cur:0,N:0,pw:0,ph:0,seq:0,open:false};
var RATIO=1.3,DUR=950,FAST=560;
function sign(){return RTL()?1:-1}
function geom(){
  var st=$('#stage'),w=st.clientWidth,h=st.clientHeight,spread=w>=820&&w/h>1.05,pw;
  pw=spread?Math.min((w-56)/2,(h-36)/RATIO):Math.min(w-20,(h-28)/RATIO);
  pw=Math.max(120,Math.floor(pw));
  return {spread:spread,pw:pw,ph:Math.floor(pw*RATIO)};
}
function faceHTML(p,num,blank){
  if(blank)return '<div class="pg blank"><span class="mk"></span></div>';
  if(p.cover)return p.html;
  if(p.cls==='blank')return '<div class="pg blank"><span class="mk"></span></div>';
  return '<div class="pg '+(p.cls||'')+'">'+p.html+'<div class="pf"><span class="mk"></span><span>'+L().brand+'</span><span class="n">'+num+'</span></div></div>';
}
function build(keepKey){
  killMaps();var g=geom(),b=R.b;R.spread=g.spread;R.pw=g.pw;R.ph=g.ph;
  R.pages=buildPages(b,R.spread);R.leaves=[];
  var book=$('#book'),h='<div class="edge un"></div><div class="edge fl"></div>';
  var n=R.spread?R.pages.length/2:R.pages.length;
  for(var k=0;k<n;k++){
    var f=R.spread?R.pages[2*k]:R.pages[k],bk=R.spread?R.pages[2*k+1]:null,fi=R.spread?2*k:k;
    h+='<div class="leaf" data-k="'+k+'">'+
      '<div class="face front'+(f.cover?' nogut':'')+'">'+faceHTML(f,fi)+'<div class="gut"></div><div class="shade"></div></div>'+
      '<div class="face back'+(bk&&bk.cover?' nogut':'')+'">'+faceHTML(bk||{},fi+1,!bk)+'<div class="gut"></div><div class="shade"></div></div></div>';
  }
  book.style.setProperty('--pw',R.pw+'px');book.style.setProperty('--ph',R.ph+'px');
  book.style.width=(R.spread?2*R.pw:R.pw)+'px';book.style.height=R.ph+'px';
  book.innerHTML=h;R.N=n;
  each('.leaf',function(el,k){R.leaves[k]={el:el,until:0};el.style.left=(R.spread&&!RTL()?R.pw:0)+'px'},book);
  var target=0;
  if(keepKey){for(var i=0;i<R.pages.length;i++)if(R.pages[i].key===keepKey){target=R.spread?Math.floor((i+1)/2):i;break}}
  R.cur=Math.min(target,maxCur());
  var bp=$('#bookPos'),sh=$('#bShadow');
  R.leaves.forEach(function(lf,k){lf.el.style.transition='none';setRot(lf,k<R.cur?180:0)});
  bp.style.transition='none';sh.style.transition='none';
  place();void book.offsetWidth;
  R.leaves.forEach(function(lf){lf.el.style.transition=''});bp.style.transition='';sh.style.transition='';
  restack();settle();ui();
}
function maxCur(){return R.spread?R.N:R.N-1}
function setRot(lf,deg){lf.el.style.transform='rotateY('+(sign()*deg)+'deg)'}
function place(){
  var x=0,pw=R.pw,sh=$('#bShadow'),sl=0,sw=R.spread?2*pw:pw;
  if(R.spread){
    if(R.cur===0){x=-pw/2;sl=RTL()?0:pw;sw=pw}else if(R.cur===R.N){x=pw/2;sl=RTL()?pw:0;sw=pw}
    if(RTL())x=-x;
  }
  $('#bookPos').style.transform='translateX('+x+'px)';
  sh.style.left=(sl+pw*0.04)+'px';sh.style.width=(sw-pw*0.08)+'px';
  var T=Math.min(12,Math.max(4,R.N*.7)),un=R.spread?(R.N-R.cur)/R.N:(R.N-1-R.cur)/Math.max(1,R.N-1),fl=R.spread?R.cur/R.N:0;
  $('#book .edge.un').style.setProperty('--t',Math.round(un*T)+'px');$('#book .edge.fl').style.setProperty('--t',Math.round(fl*T)+'px');
}
function restack(){
  var now=Date.now();
  R.leaves.forEach(function(lf,k){if(lf.until>now)return;lf.el.style.zIndex=k<R.cur?(k+1):(R.N-k+1)});
}
function visible(){
  if(!R.spread)return [R.cur];
  if(R.cur===0)return [0];if(R.cur===R.N)return [2*R.N-1];return [2*R.cur-1,2*R.cur];
}
function settle(){
  var now=Date.now(),vis=visible();
  R.leaves.forEach(function(lf,k){
    if(!R.spread)lf.el.classList.toggle('gone',k<R.cur&&lf.until<=now);
    var fr=lf.el.children[0],bk=lf.el.children[1],fi=R.spread?2*k:k;
    var fv=vis.indexOf(fi)>=0,bv=R.spread&&vis.indexOf(fi+1)>=0;
    fr.inert=!fv;bk.inert=!bv;fr.setAttribute('aria-hidden',String(!fv));bk.setAttribute('aria-hidden',String(!bv));
  });
  syncMaps();
}
/* الخريطة داخل الكتاب: تُركَّب للصفحة الظاهرة وما حولها فقط، وتُزال عند الابتعاد عنها */
function syncMaps(){
  var v=visible(),lo=v[0]-2,hi=v[v.length-1]+2;
  R.leaves.forEach(function(lf,k){[0,1].forEach(function(j){
    var fi=R.spread?2*k+j:(j?-99:k),near=fi>=lo&&fi<=hi;
    each('.lmap',function(el){
      if(near&&!el._m)el._m=makeMap(el,R.b,false);
      else if(!near&&el._m){killMap(el._m);el._m=null}
    },lf.el.children[j]);
  })});
}
function killMap(m){if(m){m._dead=true;m.remove()}}
function killMaps(){each('#book .lmap',function(el){killMap(el._m);el._m=null})}
function ui(){
  var l=L(),v=visible();
  $('#rPrev').disabled=R.cur<=0;$('#rNext').disabled=R.cur>=maxCur();
  var last=R.pages.length-1,lab=v.length>1?'<bdi dir="ltr">'+v[0]+'–'+v[1]+'</bdi>':v[0]===0?l.coverL:v[0]===last?l.backL:'<bdi>'+v[0]+'</bdi>';
  $('#rInd').innerHTML=lab+'<small>'+l.of+' '+(last-1)+'</small>';
}
var settleT=null;
function later(ms){clearTimeout(settleT);settleT=setTimeout(function(){restack();settle()},ms+40)}
function turn(d,fast){
  if(d>0?R.cur>=maxCur():R.cur<=0)return false;
  var k=d>0?R.cur:R.cur-1,lf=R.leaves[k],ms=RM?10:fast?FAST:DUR;
  lf.el.style.setProperty('--dur',ms+'ms');lf.el.classList.remove('gone','turn');
  lf.el.style.zIndex=1000+(++R.seq);lf.until=Date.now()+ms;void lf.el.offsetWidth;lf.el.classList.add('turn');
  R.cur+=d;setRot(lf,d>0?180:0);place();ui();
  clearTimeout(lf.t);lf.t=setTimeout(function(){lf.el.classList.remove('turn');lf.el.style.removeProperty('--dur')},ms+20);
  later(ms);return true;
}
function jump(target){
  target=Math.max(0,Math.min(maxCur(),target));var d=target>R.cur?1:-1,steps=Math.abs(target-R.cur),i=0;
  if(!steps)return;
  (function go(){if(i++>=steps)return;turn(d,steps>1);if(i<steps)setTimeout(go,RM?0:130)})();
}
function jumpKey(key){for(var i=0;i<R.pages.length;i++)if(R.pages[i].key===key){jump(R.spread?Math.floor((i+1)/2):i);return}}
function curKey(){var v=visible(),p=R.pages[v[v.length-1]];return p?p.key:'cover'}

/* السحب بالإصبع: الورقة تتبع الإصبع، وتكمل التقليب إذا تجاوزت ربع المسافة */
var D=null,NOCLICK=false;
(function(){
  var st=$('#stage');
  st.addEventListener('pointerdown',function(e){if(e.button>0||!R.open)return;D={x:e.clientX,y:e.clientY,id:e.pointerId,on:false,t:Date.now()}});
  st.addEventListener('pointermove',function(e){
    if(!D||e.pointerId!==D.id)return;var dx=e.clientX-D.x,dy=e.clientY-D.y;
    if(!D.on){

var LF=window.L,FM=null,ROUTES={};

  var k=[a.lat,a.lng,b.lat,b.lng].map(function(n){return (+n).toFixed(5)}).join(',');if(ROUTES[k])return ROUTES[k];
  var c=null;if(keep){try{c=JSON.parse(store.get('cat_rt_'+k)||'null')}catch(e){}}

  return ROUTES[k]=fetch('https://router.project-osrm.org/route/v1/driving/'+a.lng+','+a.lat+';'+b.lng+','+b.lat+'?overview=full&geometries=geojson')

      var o={c:r.geometry.coordinates.map(function(p){return [p[1],p[0]]}),d:r.duration,m:r.distance};if(keep)store.set('cat_rt_'+k,JSON.stringify(o));return o})

$('#rFs').onclick=function(){var d=document,el=d.documentElement;

$('#shelf').addEventListener('click',function(e){
  var a=e.target.closest('[data-asg]');if(a){asgOpen(find(a.getAttribute('data-asg')));return}
  var o=e.target.closest('[data-open]');if(!o)return;var b=find(o.getAttribute('data-open'));
  if(!isReady(b)){toast(L().prepT);return}
  FROM=o.querySelector('.t-cover');HIST=true;location.hash=b.id;
});
document.addEventListener('keydown',function(e){
  if(!R.open||document.querySelector('dialog[open]'))return;
  var fwd=null;
  if(e.key==='ArrowLeft')fwd=RTL();else if(e.key==='ArrowRight')fwd=!RTL();else if(e.key===' '||e.key==='PageDown')fwd=true;else if(e.key==='PageUp')fwd=false;
  else if(e.key==='Home'){jump(0);return}else if(e.key==='End'){jump(maxCur());return}else if(e.key==='Escape'){leave();return}
  if(fwd!=null){e.preventDefault();turn(fwd?1:-1)}
});
var rzT=null;window.addEventListener('resize',function(){if(!R.open)return;clearTimeout(rzT);rzT=setTimeout(function(){var g=geom();if(g.pw!==R.pw||g.spread!==R.spread)build(curKey())},160)});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&R.open)wake(true)});
