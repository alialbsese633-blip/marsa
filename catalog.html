<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الكتالوج | مرسى</title>
<meta name="theme-color" content="#F3F6F6">
<meta name="apple-mobile-web-app-title" content="مرسى Marsa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script src="hr-config.js"></script>
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="icons/m3-apple-180.png">
<link rel="icon" type="image/png" sizes="48x48" href="icons/m3-favicon-48.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   الكتالوج — كتالوج فروع نسائم صلالة (تكليف ASG-012/2026)
   الألوان من شعار نسائم صلالة: الفيروزي الغامق والفاتح، مع لون اللبان الذهبي للأسعار.
   ===================================================================== */
:root{color-scheme:light;
  --lagoon:#00717F;--sky:#18A4B8;--deep:#0B3E45;--ink:#0F2A2E;--ink-2:#41595D;--mute:#677E81;
  --paper:#F3F6F6;--card:#FFFFFF;--tint:#E6F0F0;--line:#D9E5E5;
  --gold:#B08D57;--gold-ink:#86652F;--gold-soft:#F4EDE1;
  --font:"IBM Plex Sans Arabic","Inter",-apple-system,"Segoe UI",Tahoma,sans-serif;
  --display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --latin:"Inter","IBM Plex Sans Arabic",-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html[lang=en]{--font:"Inter","IBM Plex Sans Arabic",-apple-system,"Segoe UI",sans-serif;--display:"Inter","IBM Plex Sans Arabic",sans-serif}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:16px/1.65 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
html[dir=ltr] .flip{transform:scaleX(-1)}
.en{font-family:var(--latin)}
.nw{white-space:nowrap}

/* الشريط العلوي */
.bar{position:sticky;top:0;z-index:30;background:rgba(243,246,246,.9);-webkit-backdrop-filter:saturate(1.3) blur(12px);backdrop-filter:saturate(1.3) blur(12px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1120px;margin:0 auto;padding:8px 20px;min-height:60px;display:flex;align-items:center;gap:10px}
.home{display:flex;align-items:center;gap:8px;color:var(--deep);text-decoration:none;font-weight:700;font-size:15px;flex:none}
.home svg{width:21px;height:24px}
.crumb{display:flex;align-items:center;gap:6px;min-width:0;font-size:15px;color:var(--mute)}
.crumb a{color:var(--ink);text-decoration:none;font-weight:600;white-space:nowrap}
.crumb a:hover{color:var(--lagoon)}
.crumb .cur{font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb svg.i{width:16px;height:16px;color:#A3B5B7}
.sp{flex:1}
.lang{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 15px;font-weight:600;font-size:14px;cursor:pointer}
.lang:hover{border-color:#BCD0D0}

.wrap{max-width:1120px;margin:0 auto;padding:0 20px 40px}
html.novt .view{animation:fade .35s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---------- لوحة الفروع ---------- */
.intro{display:flex;gap:22px;align-items:center;padding:40px 0 10px}
.intro img{width:70px;height:auto;flex:none}
.intro h1{margin:0;font:700 clamp(30px,5vw,46px)/1.25 var(--display);color:var(--deep)}
.intro .en{margin-top:2px;color:var(--mute);font-size:15px;font-weight:500}
.lead{margin:14px 0 0;max-width:64ch;color:var(--ink-2);font-size:15.5px;line-height:1.85}
.gh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:34px 0 14px}
.gh h2{margin:0;font:600 19px/1.4 var(--display);color:var(--deep)}
.gh small{color:var(--mute);font-size:13.5px}
.ready{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:20px;margin:0;padding:0;list-style:none}
.bcard{display:flex;flex-direction:column;height:100%;background:var(--card);border:1px solid var(--line);border-radius:26px;overflow:hidden;color:inherit;text-decoration:none;box-shadow:0 1px 2px rgba(15,42,46,.04),0 24px 48px -36px rgba(11,62,69,.55);transition:transform .3s var(--ease),box-shadow .3s}
.bcard:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(15,42,46,.06),0 30px 56px -34px rgba(11,62,69,.6)}
.bcard .ph{position:relative;aspect-ratio:1236/395;background:var(--deep);overflow:hidden}
.bcard .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .9s ease}
.bcard .ph .alt{opacity:0}
@media (hover:hover){.bcard:hover .ph .alt{opacity:1}}
.bcard .bd{display:grid;grid-template-columns:1fr auto;gap:4px 20px;align-items:end;padding:20px 24px 22px}
.bcard h3{margin:0;font:700 clamp(22px,2.6vw,28px)/1.3 var(--display);color:var(--deep)}
.bcard .en{color:var(--mute);font-size:14px}
.bcard .types{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.bcard .types span{font-size:13px;font-weight:500;padding:4px 11px;border-radius:999px;background:var(--tint);color:var(--deep)}
.from{text-align:end;grid-row:1;grid-column:2}
.from small{display:block;font-size:12.5px;color:var(--mute)}
.from b{font:600 32px/1.1 var(--latin);color:var(--gold-ink)}
.from span{font-size:13px;color:var(--mute);margin-inline-start:4px}
.pending{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px;margin:0;padding:0;list-style:none}
.plate{position:relative;overflow:hidden;display:flex;flex-direction:column;height:100%;min-height:124px;padding:18px 20px 16px;border-radius:18px;background:var(--card);border:1px dashed #C6D7D7}
.plate::after{content:"";position:absolute;inset-inline-end:-16px;bottom:-24px;width:92px;height:96px;background:url(icons/logo-mark.png) center/contain no-repeat;opacity:.08}
.plate h3{margin:0;font:600 18px/1.45 var(--display);color:var(--ink)}
.plate .en{color:var(--mute);font-size:13px}
.plate .st{margin-top:auto;padding-top:14px;display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--gold-ink)}
.plate .st i{width:6px;height:6px;border-radius:50%;background:var(--gold)}
.pc{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--mute)}
.pc .m{flex:1;max-width:160px;height:5px;border-radius:5px;background:var(--tint);overflow:hidden}
.pc .m i{display:block;height:100%;background:var(--lagoon);border-radius:5px}

/* ---------- صفحة الفرع ---------- */
.hero{position:relative;margin-top:20px;border-radius:28px;overflow:hidden;background:#0A1E2A;aspect-ratio:1236/395;view-transition-name:hero}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity 1.4s ease}
.hero .night{opacity:0}
.hero[data-mode=night] .night{opacity:1}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:40%;background:linear-gradient(to top,rgba(6,24,30,.45),transparent);pointer-events:none}
.dn{position:absolute;z-index:2;bottom:16px;inset-inline-end:16px;display:flex;padding:4px;border-radius:999px;background:rgba(8,28,36,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2)}
.dn button{display:flex;align-items:center;gap:6px;border:0;background:none;color:#fff;font-weight:600;font-size:13.5px;padding:7px 14px;border-radius:999px;cursor:pointer;opacity:.8;transition:background .4s,color .4s,opacity .4s}
.dn button svg.i{width:17px;height:17px}
.dn button[aria-pressed=true]{opacity:1;background:#fff;color:var(--deep)}
.hero[data-mode=night] .dn button[aria-pressed=true]{background:var(--gold-soft);color:#5B4420}
.bhead{display:grid;grid-template-columns:1fr auto;gap:16px 32px;align-items:end;padding:28px 4px 0}
.bhead h1{margin:0;font:700 clamp(32px,5.6vw,54px)/1.2 var(--display);color:var(--deep)}
.bhead .en{margin-top:4px;color:var(--mute);font-size:16px;font-weight:500}
.price{text-align:end}
.price small{display:block;color:var(--mute);font-size:13px}
.price b{font:600 44px/1.05 var(--latin);color:var(--gold-ink)}
.price span{font-size:14px;color:var(--mute);margin-inline-start:6px}
.facts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.facts li{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:500;color:var(--ink-2)}
.facts svg.i{width:17px;height:17px;color:var(--lagoon)}
.enter .hero,.enter .bhead{animation:rise .7s var(--ease) both}.enter .bhead{animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.snav{position:sticky;top:61px;z-index:20;margin:30px -20px 0;padding:0 20px;background:rgba(243,246,246,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.snav div{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.snav div::-webkit-scrollbar{display:none}
.snav button{flex:none;border:0;background:none;padding:14px 12px 11px;font-weight:600;font-size:14.5px;color:var(--mute);border-bottom:2.5px solid transparent;cursor:pointer;transition:color .2s,border-color .2s}
.snav button:hover{color:var(--ink)}
.snav button[aria-current=true]{color:var(--deep);border-color:var(--gold)}

.sec{padding-top:44px;scroll-margin-top:120px}
.sh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px;margin-bottom:18px}
.sh h2{margin:0;font:700 clamp(22px,3vw,28px)/1.35 var(--display);color:var(--deep)}
.sh p{margin:4px 0 0;color:var(--mute);font-size:14px}
.sub{margin:30px 0 12px;font:600 17px/1.4 var(--display);color:var(--deep)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:999px;border:1px solid transparent;font-weight:600;font-size:14.5px;line-height:1.4;text-decoration:none;cursor:pointer;transition:background .2s,border-color .2s,transform .15s}
.btn:active{transform:scale(.97)}
.btn svg.i{width:18px;height:18px}
.btn.line{background:var(--card);color:var(--deep);border-color:var(--line)}
.btn.line:hover{border-color:#B6CBCB}
.btn.solid{background:var(--lagoon);color:#fff}
.btn.solid:hover{background:#00626E}
.btn.light{background:#fff;color:var(--deep)}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.28)}
.btn.ghost:hover{background:rgba(255,255,255,.18)}
.acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:14px}

/* المعرض */
.mosaic{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:repeat(2,clamp(150px,17vw,210px));gap:8px;border-radius:24px;overflow:hidden}
.mosaic button{position:relative;padding:0;border:0;background:var(--tint);overflow:hidden;cursor:zoom-in}
.mosaic button:first-child{grid-row:span 2}
.mosaic button:nth-child(n+6){display:none}
.mosaic img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .7s var(--ease)}
@media (hover:hover){.mosaic button:hover img{transform:scale(1.035)}}
.mosaic .more{position:absolute;inset:0;display:grid;place-items:center;background:rgba(11,62,69,.6);color:#fff;font-weight:600;font-size:17px}

/* الموقع */
.loc{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px;align-items:stretch}
.mapcard{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;min-height:250px;padding:28px;border-radius:24px;color:#fff;background:repeating-radial-gradient(circle at calc(100% - 52px) 52px,rgba(255,255,255,.075) 0 1px,transparent 1.5px 30px),linear-gradient(150deg,#0F5D67,#0B3E45 70%)}
html[dir=ltr] .mapcard{background:repeating-radial-gradient(circle at 52px 52px,rgba(255,255,255,.075) 0 1px,transparent 1.5px 30px),linear-gradient(210deg,#0F5D67,#0B3E45 70%)}
.mapcard .pin{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--gold-soft);color:#6E5126;box-shadow:0 0 0 8px rgba(244,237,225,.14)}
.mapcard .pin svg.i{width:22px;height:22px}
.mapcard h3{margin:22px 0 4px;font:600 21px/1.4 var(--display)}
.mapcard p{margin:0 0 20px;max-width:34ch;opacity:.85;font-size:14.5px}
.mapcard .btn{margin-top:auto}
.near{margin:0;padding:6px 22px;list-style:none;background:var(--card);border:1px solid var(--line);border-radius:24px}
.near li{display:grid;grid-template-columns:42px 1fr auto;gap:2px 14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.near li:last-child{border-bottom:0}
.near .ic{grid-row:span 2;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--tint);color:var(--lagoon)}
.near b{font-weight:600}
.near .en{display:block;font-size:12.5px;color:var(--mute);font-weight:400}
.near .t{font-weight:600;color:var(--deep);white-space:nowrap}
.near .t small{display:block;font-weight:400;font-size:12px;color:var(--mute);text-align:end}
.near .bar{grid-column:2/-1;height:4px;margin-top:8px;border-radius:4px;background:var(--tint);overflow:hidden}
.near .bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--sky),var(--lagoon))}
html[dir=rtl] .near .bar i{background:linear-gradient(270deg,var(--sky),var(--lagoon))}
.note{margin:12px 4px 0;font-size:13px;color:var(--mute)}

/* الوحدات */
.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px;margin:0;padding:0;list-style:none}
.unit{padding:22px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.unit .ic{width:50px;height:50px;margin-bottom:16px;border-radius:15px;display:grid;place-items:center;background:var(--tint);color:var(--lagoon)}
.unit .ic svg.i{width:26px;height:26px;stroke-width:1.6}
.unit h3{margin:0;font:600 19px/1.45 var(--display);color:var(--ink)}
.unit .en{color:var(--mute);font-size:13.5px}
.unit .n{margin-top:12px;font-size:14px;font-weight:600;color:var(--deep)}
.amen{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));column-gap:28px;margin:0;padding:0;list-style:none}
.amen li{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);font-weight:500}
.amen svg.i{color:var(--lagoon)}

/* الأسعار والشروط */
.fin{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:20px;align-items:start}
.rate{padding:24px 26px 18px;border-radius:24px;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--gold)}
.rate h3,.terms h3{margin:0 0 6px;font:600 17px/1.4 var(--display);color:var(--deep)}
.rate ul,.terms ul{margin:0;padding:0;list-style:none}
.rate li{display:flex;align-items:baseline;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}
.rate li:last-child{border-bottom:0}
.rate .nm{font-weight:600}
.rate .nm small{display:block;font-weight:400;font-size:12.5px;color:var(--mute)}
.rate .ld{flex:1;min-width:24px;border-bottom:1.5px dotted #BFD0D0;transform:translateY(-6px)}
.rate .pr{white-space:nowrap;text-align:end}
.rate .pr b{font:600 26px/1 var(--latin);color:var(--gold-ink)}
.rate .pr span{font-size:13px;color:var(--mute);margin-inline-start:5px}
.rate .pr small{display:block;font-size:12px;color:var(--mute);margin-top:4px}
.rate .basis{margin:10px 0 0;font-size:13px;color:var(--mute)}
.terms{padding:24px 24px 10px;border-radius:24px;background:var(--card);border:1px solid var(--line)}
.terms li{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.terms li:last-child{border-bottom:0}
.terms li>svg.i{margin-top:3px;color:var(--lagoon)}
.terms b{display:block;font-size:13px;font-weight:500;color:var(--mute)}
.terms span{font-weight:600}

/* التواصل */
.ccard{position:relative;overflow:hidden;isolation:isolate;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;padding:32px;border-radius:28px;color:#fff;background:linear-gradient(135deg,#0B3E45 10%,#00717F)}
.ccard::after{content:"";position:absolute;z-index:-1;inset-inline-end:-30px;top:-36px;width:230px;height:240px;background:url(icons/logo-mark-white.png) center/contain no-repeat;opacity:.08}
.ccard .who{font-size:15px;opacity:.85}
.ccard .who small{display:block;font-size:13px;opacity:.8}
.ccard .ph{display:inline-block;margin:10px 0 2px;color:#fff;text-decoration:none;font:600 clamp(28px,4.4vw,40px)/1.2 var(--latin);direction:ltr;unicode-bidi:isolate;text-align:start}
.ccard .em{color:#fff;opacity:.85;font-size:15px;text-decoration:none;font-family:var(--latin);direction:ltr;unicode-bidi:isolate}
.ccard .em:hover,.ccard .ph:hover{opacity:1;text-decoration:underline;text-underline-offset:4px}
.ccard .acts{display:grid;grid-template-columns:1fr 1fr;margin:0;min-width:min(100%,380px)}

/* اكتمال مواد التكليف — للموارد البشرية والمدير العام فقط */
.asg{margin-top:44px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.asg summary{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:16px 20px;cursor:pointer;list-style:none;font-weight:600}
.asg summary::-webkit-details-marker{display:none}
.asg summary .pc{margin-inline-start:auto}
.asg summary .chev{transition:transform .2s;color:var(--mute)}
.asg[open] summary .chev{transform:rotate(-90deg)}
html[dir=ltr] .asg[open] summary .chev{transform:scaleX(-1) rotate(-90deg)}
.asg ol{margin:0;padding:0 20px 10px;list-style:none}
.asg li{display:grid;grid-template-columns:26px 24px 1fr auto;gap:12px;align-items:start;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.asg .no{color:var(--mute);font:500 13px/1.7 var(--latin);text-align:center}
.asg .s{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;margin-top:1px}
.asg .s svg.i{width:14px;height:14px;stroke-width:2.6}
.s.done{background:#E2F2EA;color:#1E7A55}.s.part{background:var(--gold-soft);color:var(--gold-ink)}.s.miss{background:#EEF2F2;color:#93A5A7}
.asg li small{display:block;color:var(--mute);font-size:12.5px}
.asg .lbl{font-size:12px;font-weight:600;white-space:nowrap}
.lbl.done{color:#1E7A55}.lbl.part{color:var(--gold-ink)}.lbl.miss{color:#93A5A7}

.empty{margin:60px auto;max-width:420px;text-align:center;color:var(--ink-2)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 22px;margin-top:56px;padding-top:20px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mute)}

/* عارض الصور */
.lb{position:fixed;inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:0;border:0;background:rgba(5,20,24,.96);color:#fff;overflow:hidden}
.lb::backdrop{background:transparent}
.lb figure{position:absolute;inset:64px 76px 76px;margin:0;display:grid;place-items:center;touch-action:pan-y}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;user-select:none;-webkit-user-drag:none;transition:opacity .3s ease}
.lb .cap{position:absolute;inset-inline:76px;bottom:22px;display:flex;justify-content:space-between;gap:16px;font-size:14.5px}
.lb .cap span:last-child{font-family:var(--latin);opacity:.7}
.lb .rb{position:absolute;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center;cursor:pointer;transition:background .2s}
.lb .rb:hover{background:rgba(255,255,255,.18)}

  var l=L(),U=b.units||[],C=b.contact||{},T=b.terms||{},out=[l.shareHead,l.branch+t(b),''];
  if(U.length){out.push(l.unitsPrices+(b.basis&&U.some(function(u){return u.price})?' ('+t(b.basis)+')':'')+':');
    U.forEach(function(u){var p=u.daily||u.monthly?[u.monthly?moneyTxt(u.monthly)+' '+l.perMonth:'',u.daily?moneyTxt(u.daily)+' '+l.perDay:''].filter(Boolean).join('، '):moneyTxt(u.price);out.push('- '+t(u)+': '+p)})}
  if(typeof b.utilities==='boolean')out.push(l.util+': '+(b.utilities?l.utilY:l.utilN));
  if(T.contract)out.push(t(T.contract));
  if((b.amen||[]).length)out.push(l.amenL+': '+b.amen.map(function(k){return AMEN[k]?AMEN[k][LANG==='ar'?1:2]:k}).join(LANG==='ar'?'، ':', '));
  if(b.map)out.push('',l.location+': '+b.map);
  if(C.phone||C.email)out.push(l.contactL+': '+[C.phone,C.email].filter(Boolean).join(' | '));
  return out.join('\n');
}
function share(b){
  var txt=shareText(b);
  if(navigator.share)navigator.share({title:L().shareHead+' | '+t(b),text:txt}).catch(function(e){if(e&&e.name!=='AbortError')copyText(txt,L().shared)});
  else copyText(txt,L().shared);
}

/* ---------------- الأحداث ---------------- */
document.addEventListener('click',function(e){
  var el=e.target.closest&&e.target.closest('[data-dn],[data-go],[data-lb],[data-share],[data-copy]');if(!el)return;
  var b=findReady(CUR);
  if(el.hasAttribute('data-dn')){MODE=el.getAttribute('data-dn');var h=$('.hero');if(h)h.setAttribute('data-mode',MODE);
    Array.prototype.forEach.call(document.querySelectorAll('[data-dn]'),function(x){x.setAttribute('aria-pressed',String(x.getAttribute('data-dn')===MODE))});return}
  if(el.hasAttribute('data-go')){var s=document.getElementById(el.getAttribute('data-go'));if(s)s.scrollIntoView({behavior:RM?'auto':'smooth',block:'start'});return}
  if(!b)return;
  if(el.hasAttribute('data-lb'))lbOpen(b,+el.getAttribute('data-lb'));
  else if(el.hasAttribute('data-share'))share(b);
  else if(el.hasAttribute('data-copy'))copyText(el.getAttribute('data-copy'),L().copied);
});
$('#langBtn').onclick=function(){LANG=LANG==='ar'?'en':'ar';store.set('marsa_lang',LANG);var y=window.scrollY;paint();window.scrollTo(0,y)};
window.addEventListener('hashchange',navigate);

paint();
if(location.hash&&!CUR)history.replaceState(null,'',location.pathname+location.search);

/* التحقق من الجلسة في الخلفية: الصفحة تفتح فوراً (وحتى بدون إنترنت)، وتُغلق إن انتهت صلاحية الدخول */
if(API)fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'me',t:TOKEN})})
  .then(function(r){return r.json()}).then(function(r){
    if(!r||!r.ok){store.del('marsa_token');store.del('marsa_user');location.replace('./');return}
    if(r.user.must){location.replace('./');return}
    var was=isAdmin();USER=r.user;store.set('marsa_user',JSON.stringify(r.user));
    if(was!==isAdmin()){var y=window.scrollY;paint();window.scrollTo(0,y)}
  }).catch(function(){});
})();
