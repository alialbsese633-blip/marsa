/* =====================================================================
   الكتالوج — كتالوج فروع نسائم صلالة (تكليف ASG-012/2026)
   عرض تقديمي بملء الشاشة: يحمله الموظف على الآيباد ويعرض الفرع على الشركات،
   وأقسام العرض أزرار ظاهرة دائماً في أسفل الشاشة. نسخة العميل (?c=1) تُفتح بلا تسجيل دخول.
   الهوية بألوان فاتحة مريحة للعين: فيروزي الشعار (#00717F / #18A4B8) على أبيض ورمادي فاتح،
   وذهب اللبان للخطوط واللمسات، وخط Reem Kufi القريب من حروف الشعار.
   ===================================================================== */
:root{color-scheme:light;
  --surface:#FFFFFF;--tint:#E8F1F1;--line:#DCE7E7;
  --deep:#0B4F57;--lagoon:#00717F;--sky:#18A4B8;
  --ink:#10292C;--ink-2:#46605F;--mute:#7A8F92;
  --gold:#B08D57;--gold-ink:#86652F;--gold-soft:#F5EEE2;--gold-hi:#E9D3A1;
  --teal-g:linear-gradient(135deg,#18A4B8 0%,#00717F 72%);
  --foil:linear-gradient(115deg,#94723F 0%,#E8D29F 22%,#B08D57 40%,#F5E6C2 58%,#A27F47 78%,#DCC28A 100%);
  --shadow:0 1px 2px rgba(11,79,87,.06),0 18px 40px -26px rgba(11,79,87,.38);
  --display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --font:"IBM Plex Sans Arabic","Inter",-apple-system,"Segoe UI",Tahoma,sans-serif;
  --latin:"Inter","IBM Plex Sans Arabic",-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1)}
html[lang=en]{--font:"Inter","IBM Plex Sans Arabic",-apple-system,"Segoe UI",sans-serif}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%;color:var(--ink);font:16px/1.6 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:radial-gradient(1100px 600px at 50% -12%,#FFFFFF 0,transparent 62%),linear-gradient(180deg,#F6FAFA,#EBF2F2)}
body.reading{overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
html[dir=ltr] .flip{transform:scaleX(-1)}
.foil-t{color:var(--deep)}
.mk{display:inline-block;background:var(--teal-g);-webkit-mask:url(icons/logo-mark-white.png) center/contain no-repeat;mask:url(icons/logo-mark-white.png) center/contain no-repeat}
[hidden]{display:none!important}
html.pub .staff{display:none!important}

/* ---------- المكتبة ---------- */
.top{max-width:1180px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 20px 0;display:flex;align-items:center;gap:10px;min-height:52px}
.sp{flex:1}
.gbtn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--deep);font-weight:600;font-size:14px;text-decoration:none;cursor:pointer;box-shadow:0 1px 2px rgba(11,79,87,.06);transition:border-color .2s,box-shadow .2s}
.gbtn:hover{border-color:#B9CFD0;box-shadow:0 8px 18px -12px rgba(11,79,87,.45)}
.gbtn svg.i{width:18px;height:18px;color:var(--lagoon)}
.s-hero{text-align:center;padding:14px 20px 0}
.s-logo{display:block;margin:0 auto;width:124px;height:124px;background:url(icons/logo-full.png) center/contain no-repeat}
.s-hero h1{margin:6px 0 0;font:600 clamp(30px,5vw,44px)/1.25 var(--display);color:var(--deep)}
.s-hero h1::after{content:"";display:block;width:64px;height:2px;margin:12px auto 0;background:var(--foil)}
.s-hero p{margin:12px auto 0;max-width:52ch;color:var(--ink-2);font-size:15px}
.shelf{max-width:1180px;margin:0 auto;padding:34px 28px 30px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:34px 26px;list-style:none}
.dk-w{display:flex;flex-direction:column;min-width:0}
.dk{position:relative;display:block;width:100%;aspect-ratio:16/10;padding:0;border:0;border-radius:16px;overflow:hidden;cursor:pointer;container-type:size;background:var(--tint);
  box-shadow:var(--shadow),0 0 0 1px rgba(11,79,87,.08);transition:transform .45s var(--ease),box-shadow .45s}
.dk.ready:hover{transform:translateY(-5px);box-shadow:0 2px 4px rgba(11,79,87,.08),0 30px 60px -28px rgba(11,79,87,.5),0 0 0 1px rgba(176,141,87,.55)}
.dk.wait{cursor:default}
.dk-cap{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:13.5px}
.dk-cap .go{display:inline-flex;align-items:center;gap:6px;color:var(--lagoon);font-weight:600}
.dk-cap .go svg.i{width:16px;height:16px}
.dk-cap .wt{color:var(--mute)}
.achip{display:inline-flex;align-items:center;gap:7px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink-2);font-size:12px;cursor:pointer}
.achip i{display:block;width:44px;height:4px;border-radius:4px;background:var(--tint);overflow:hidden}
.achip i b{display:block;height:100%;background:var(--gold)}
.s-foot{max-width:1180px;margin:0 auto;padding:22px 24px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 20px;font-size:12.5px;color:var(--mute);border-top:1px solid var(--line)}

/* ---------- شريحة الغلاف (في المكتبة وأول العرض) ---------- */
.sl{position:absolute;inset:0;font-size:min(1.62cqw,2.6cqh)}
.cvs{position:absolute;inset:0;overflow:hidden;color:var(--ink);background:#fff}
.cvs .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 60%}
.cvs .bgp{position:absolute;inset:0;background:radial-gradient(120% 120% at 75% 10%,#FFFFFF 0%,#EEF5F5 55%,#E1ECEC 100%)}
.cvs .bgp::after{content:"";position:absolute;inset-inline-end:8%;top:50%;width:24%;aspect-ratio:1/1.05;transform:translateY(-50%);opacity:.14;background:var(--teal-g);-webkit-mask:url(icons/logo-mark-white.png) center/contain no-repeat;mask:url(icons/logo-mark-white.png) center/contain no-repeat}
.cvs::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(to left,rgba(255,255,255,.97) 0%,rgba(255,255,255,.9) 33%,rgba(255,255,255,.28) 62%,rgba(255,255,255,0) 80%)}
html[dir=ltr] .cvs::before{background:linear-gradient(to right,rgba(255,255,255,.97) 0%,rgba(255,255,255,.9) 33%,rgba(255,255,255,.28) 62%,rgba(255,255,255,0) 80%)}
.cvs .fr{position:absolute;z-index:2;inset:1.2em;border:1px solid rgba(176,141,87,.7);pointer-events:none}
.cvs .fr::after{content:"";position:absolute;inset:.4em;border:1px solid rgba(176,141,87,.3)}
.cv-in{position:absolute;z-index:3;top:0;bottom:0;inset-inline-start:0;width:54%;display:flex;flex-direction:column;justify-content:center;padding-inline:4.4em 1em;text-align:start}
.cv-in .mk{width:3.1em;height:3.2em}
.cv-in .brand{margin-top:.6em;font:500 1.2em/1.3 var(--display);color:var(--lagoon)}
.cv-in .brand small{display:block;margin-top:.2em;font:600 .48em var(--latin);letter-spacing:.34em;color:var(--gold-ink)}
.cv-in h1{margin:.45em 0 0;font:600 3.7em/1.15 var(--display);color:var(--deep)}
.cv-in .en{margin-top:.35em;font:500 .85em var(--latin);letter-spacing:.2em;color:var(--gold-ink)}
.cv-in .kick{margin-top:1.7em;display:flex;align-items:center;gap:.8em;font-size:.98em;color:var(--ink-2)}
.cv-in .kick::before{content:"";width:2.6em;height:1px;background:var(--gold)}

/* ---------- العرض ---------- */
.reader{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
  background:radial-gradient(1200px 700px at 50% 0%,#FFFFFF 0%,transparent 60%),linear-gradient(180deg,#F4F8F8,#E7F0F0)}
.reader[hidden]{display:none}
.r-top,.r-bot{position:relative;z-index:5;flex:none;display:flex;align-items:center;gap:8px;padding:8px 14px}
.r-top{min-height:60px}
.r-ttl{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:10px;font:500 16px var(--display);color:var(--deep);white-space:nowrap;overflow:hidden}
.r-ttl .mk{width:22px;height:23px}
.r-ttl span{overflow:hidden;text-overflow:ellipsis}
.r-cnt{font:600 14px var(--latin);color:var(--mute);padding:0 6px;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.rb{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:#fff;color:var(--lagoon);cursor:pointer;box-shadow:0 1px 2px rgba(11,79,87,.06);transition:border-color .2s,box-shadow .2s,opacity .2s}
.rb:hover{border-color:#B9CFD0;box-shadow:0 8px 18px -12px rgba(11,79,87,.45)}
.rb[disabled]{opacity:.35;cursor:default;box-shadow:none}
.rb.big{width:52px;height:52px}
.rb.pill{width:auto;padding:0 16px;border-radius:999px;display:inline-flex;gap:8px;font-weight:600;font-size:14px;color:var(--deep)}
.deck{position:relative;flex:1;min-height:0;margin:0 14px;border-radius:18px;overflow:hidden;background:#fff;touch-action:pan-y;
  box-shadow:0 2px 6px rgba(11,79,87,.06),0 30px 60px -36px rgba(11,79,87,.5),0 0 0 1px rgba(11,79,87,.08)}
.slide{position:absolute;inset:0;container-type:size;overflow:hidden;visibility:hidden;opacity:0;transform:scale(1.035);
  transition:opacity .55s ease,transform .8s var(--ease),visibility 0s .8s;background:radial-gradient(130% 120% at 90% 0%,#FFFFFF 0%,#F4F8F8 55%,#EAF2F2 100%)}
.slide.on{visibility:visible;opacity:1;transform:none;transition:opacity .55s ease,transform .8s var(--ease),visibility 0s}
.deck.instant .slide{transition:none}
.slide [data-a]{opacity:0}
.slide.on [data-a]{animation:rise .75s var(--ease) both;animation-delay:calc(var(--d,0) * 90ms + 220ms)}
.deck.instant .slide.on [data-a]{animation:none;opacity:1}
@keyframes rise{from{opacity:0;transform:translateY(1.1em)}to{opacity:1;transform:none}}
.r-bot{min-height:72px;gap:12px}
.tabs{flex:1;min-width:0;display:flex;justify-content:safe center;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:46px;padding:0 17px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink-2);font:500 15px var(--display);cursor:pointer;white-space:nowrap;transition:background .25s,color .25s,border-color .25s}
.tab svg.i{width:18px;height:18px;color:var(--lagoon)}
.tab:hover{border-color:#B9CFD0}
.tab[aria-current=true]{background:var(--deep);color:#fff;border-color:var(--deep)}
.tab[aria-current=true] svg.i{color:var(--gold-hi)}
.hint{position:absolute;bottom:92px;left:50%;transform:translateX(-50%);z-index:30;padding:9px 18px;border-radius:999px;background:var(--deep);color:#fff;font-size:13.5px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .5s;box-shadow:0 12px 30px -12px rgba(11,79,87,.6)}
.hint.on{opacity:1}

/* ---------- محتوى الشرائح ---------- */
.sx{position:absolute;inset:0;padding:3.4em 4.2em}
.two{display:grid;grid-template-columns:1.05fr .95fr;gap:3.2em;align-items:center}
.kk{display:inline-flex;align-items:center;gap:.7em;font:500 1em var(--display);color:var(--gold-ink)}
.kk::before{content:"";width:2.2em;height:1px;background:var(--gold)}
.st{margin:.35em 0 0;font:600 3em/1.2 var(--display);color:var(--deep)}
.se{margin-top:.25em;font:500 .85em var(--latin);letter-spacing:.14em;color:var(--gold-ink)}
.lead{margin:1.1em 0 0;max-width:36em;font-size:1.05em;line-height:1.85;color:var(--ink-2)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1.4em 2em;margin-top:2em}
.fact{border-inline-start:2px solid var(--gold);padding-inline-start:.9em}
.fact .n{font:700 3.3em/1 var(--latin);color:var(--deep);font-variant-numeric:lining-nums}
.fact .n small{font:600 .34em var(--font);color:var(--gold-ink);margin-inline-start:.35em}
.fact .l{margin-top:.4em;font-size:.88em;line-height:1.5;color:var(--ink-2)}
.media{display:grid;place-items:center;height:100%;min-height:0}
.arch{position:relative;height:min(31em,100%);aspect-ratio:1/1.2;padding:.32em;background:var(--foil);border-radius:50% 50% .6em .6em/38% 38% .6em .6em;box-shadow:0 2em 3em -2em rgba(11,79,87,.45)}
.arch img{display:block;width:100%;height:100%;object-fit:cover;border-radius:50% 50% .4em .4em/38% 38% .4em .4em}
.ph{position:relative;display:block;padding:0;border:0;border-radius:.6em;overflow:hidden;background:var(--tint);cursor:zoom-in;min-height:0}
.ph img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
@media (hover:hover){.ph:hover img{transform:scale(1.04)}}
.cap{position:absolute;z-index:2;bottom:.85em;inset-inline-start:0;display:flex;align-items:center;gap:.55em;max-width:90%;padding:.45em 1.4em .45em .85em;color:#fff;text-align:start;
  background:linear-gradient(var(--gold),var(--gold)) top/100% 2px no-repeat,linear-gradient(90deg,rgba(7,46,52,.95),rgba(0,113,127,.9));clip-path:polygon(0 0,100% 0,calc(100% - .9em) 100%,0 100%)}
html[dir=rtl] .cap{padding:.45em .85em .45em 1.4em;clip-path:polygon(0 0,100% 0,100% 100%,.9em 100%);background:linear-gradient(var(--gold),var(--gold)) top/100% 2px no-repeat,linear-gradient(270deg,rgba(7,46,52,.95),rgba(0,113,127,.9))}
.cap .mk{width:1em;height:1.05em;background:var(--foil)}
.cap b{display:block;font:600 .95em/1.3 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap small{display:block;font:500 .66em/1.3 var(--latin);letter-spacing:.03em;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-t{position:absolute;z-index:3;bottom:1.6em;inset-inline-start:1.6em;padding:.75em 1.3em;border-radius:.8em;background:rgba(255,255,255,.93);border:1px solid var(--line);color:var(--ink);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.chip-t b{display:block;font:600 1.5em/1.2 var(--display);color:var(--deep)}
.chip-t small{display:block;margin-top:.15em;font-size:.82em;color:var(--gold-ink)}
.gcount{position:absolute;z-index:3;top:2.1em;inset-inline-end:2.1em;padding:.35em .9em;border-radius:999px;background:rgba(255,255,255,.93);border:1px solid var(--line);color:var(--deep);font:600 .9em var(--latin);direction:ltr;box-shadow:var(--shadow)}
.cmp{position:absolute;inset:0;--p:50%;cursor:ew-resize;touch-action:none}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
html[dir=rtl] .cmp .ni{clip-path:inset(0 calc(100% - var(--p)) 0 0)}
html[dir=ltr] .cmp .ni{clip-path:inset(0 0 0 var(--p))}
.cmp-h{position:absolute;z-index:2;top:0;bottom:0;left:var(--p);width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 1em rgba(11,79,87,.45);pointer-events:none}
.cmp-h span{position:absolute;top:50%;left:50%;width:4em;height:4em;margin:-2em 0 0 -2em;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid var(--gold);box-shadow:0 .6em 1.4em rgba(11,79,87,.35)}
.cmp-h .mk{width:1.7em;height:1.8em}
.cmp-l{position:absolute;z-index:3;top:1.6em;display:inline-flex;align-items:center;gap:.5em;padding:.5em 1.1em;border-radius:999px;background:rgba(255,255,255,.93);border:1px solid var(--line);color:var(--deep);font:500 1.05em var(--display);box-shadow:var(--shadow);pointer-events:none}
.cmp-l svg.i{width:1.2em;height:1.2em;color:var(--gold-ink)}
.cmp-l.d{inset-inline-start:1.6em}.cmp-l.n{inset-inline-end:1.6em}
.mos{position:absolute;inset:1.3em;display:grid;gap:.7em;grid-template-columns:2fr 1fr 1fr;grid-template-rows:1fr 1fr}
.mos>.ph:first-child{grid-row:span 2}
.mos.n4{grid-template-columns:1fr 1fr}.mos.n4>.ph:first-child{grid-row:auto}
.mos.n3{grid-template-columns:2fr 1fr}
.mos.n2{grid-template-columns:1fr 1fr;grid-template-rows:1fr}.mos.n2>.ph:first-child{grid-row:auto}
.mos.n1{grid-template-columns:1fr;grid-template-rows:1fr}
.mapw{position:absolute;inset:0;background:#DCE8E8}
.mapw .leaflet-bar a{background:#fff;color:var(--deep);border-color:var(--line)}
.mapw .leaflet-control-attribution{background:rgba(255,255,255,.82);color:var(--ink-2)}.mapw .leaflet-control-attribution a{color:var(--lagoon)}
.mapw.none{display:grid;place-items:center;background:repeating-radial-gradient(circle at 50% 50%,rgba(0,113,127,.08) 0 1px,transparent 1.5px 2.4em),radial-gradient(80% 80% at 50% 50%,#FFFFFF,#E7F1F1)}
.panel{position:absolute;z-index:600;top:1.4em;bottom:1.4em;inset-inline-start:1.4em;width:31%;min-width:17em;display:flex;flex-direction:column;padding:1.7em 1.6em 1.4em;border-radius:1.2em;
  background:rgba(255,255,255,.95);border:1px solid var(--line);color:var(--ink);box-shadow:0 20px 50px -24px rgba(11,79,87,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);user-select:text}
.panel .st{font-size:2.3em}
.nl{list-style:none;margin:1.4em 0 0;padding:0}
.nl li{display:flex;align-items:center;gap:.8em;padding:.8em 0;border-top:1px solid var(--line)}
.nl .d{flex:none;width:2.4em;height:2.4em;border-radius:50%;display:grid;place-items:center;background:var(--teal-g);color:#fff}
.nl .d svg.i{width:1.2em;height:1.2em}
.nl b{display:block;font:500 1.05em/1.3 var(--display);color:var(--ink)}
.nl small{display:block;font:500 .74em var(--latin);color:var(--mute)}
.nl .tm{margin-inline-start:auto;text-align:end;white-space:nowrap;color:var(--gold-ink);font-size:.85em;font-weight:600}
.nl .tm strong{font:700 2.2em/1 var(--latin);color:var(--deep)}
.nl .tm span{display:block;font-weight:500;color:var(--mute)}
.btns{margin-top:auto;display:flex;flex-direction:column;gap:.6em;padding-top:1.2em}
.btn-g{display:inline-flex;align-items:center;justify-content:center;gap:.55em;min-height:3em;padding:0 1.2em;border-radius:999px;font:600 .98em var(--font);text-decoration:none;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--deep);transition:border-color .2s,box-shadow .2s}
.btn-g:hover{border-color:#B9CFD0;box-shadow:0 8px 18px -12px rgba(11,79,87,.45)}
.btn-g svg.i{width:1.3em;height:1.3em;color:var(--lagoon)}
.btn-g.solid{background:var(--lagoon);color:#fff;border-color:var(--lagoon)}
