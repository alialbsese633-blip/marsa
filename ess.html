<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F6F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مرسى Marsa">
<link rel="apple-touch-icon" href="icons/m3-apple-180.png">
<link rel="icon" type="image/png" sizes="48x48" href="icons/m3-favicon-48.png">
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<title>خدمات الموظفين | مرسى</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="hr-config.js"></script>
<script src="config.js"></script>
<style>
/* ===== خدمات الموظفين — هوية مرسى: تيل عميق + نحاسي، ورق فاتح ===== */
:root{color-scheme:light;
  --teal:#287070;--deep:#16474A;--copper:#A8622E;--copperS:#F6E9DD;--mist:#5E8F6E;--mistS:#E6F0E8;
  --paper:#F3F6F6;--card:#fff;--ink:#10292B;--mute:#5E7475;--line:#E1EAEA;--line2:#CFDDDD;
  --ok:#1E7B4F;--okS:#E3F4EA;--warn:#9A6200;--warnS:#FFF3D6;--bad:#A3261F;--badS:#FCE6E4;--info:#1F5F8B;--infoS:#E4F0F9;
  --sh:0 1px 2px rgba(16,41,43,.05),0 6px 20px rgba(16,41,43,.07);--sh2:0 14px 40px rgba(16,41,43,.16);
  --font:"IBM Plex Sans Arabic","Inter",-apple-system,"Segoe UI",Tahoma,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html[lang=en]{--font:"Inter","IBM Plex Sans Arabic",-apple-system,"Segoe UI",sans-serif}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:15px/1.65 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid #18A4B8;outline-offset:2px}
.num{font-variant-numeric:tabular-nums;font-family:"Inter",var(--font)}
/* الشريط العلوي */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(243,246,246,.93);backdrop-filter:saturate(1.3) blur(10px);-webkit-backdrop-filter:saturate(1.3) blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1040px;margin:0 auto;padding:8px 18px;display:flex;align-items:center;gap:10px;min-height:62px}
.bar img{height:40px;display:block}.bar .sp{flex:1}
.chip-btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:600;font-size:13.5px;cursor:pointer;box-shadow:var(--sh)}
.chip-btn:active{transform:scale(.97)}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--deep);font-weight:600;font-size:13.5px;padding:7px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh)}
.wrap{max-width:1040px;margin:0 auto;padding:18px 18px 120px}
/* التبويبات (سطح المكتب) */
.tabs{display:flex;gap:4px;margin:0 0 18px;background:#fff;padding:5px;border-radius:14px;box-shadow:var(--sh);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1;min-width:max-content;border:0;background:transparent;padding:9px 13px;border-radius:10px;font-weight:600;font-size:14px;color:var(--mute);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .2s,color .2s}
.tabs button.on{background:var(--deep);color:#fff}
.tabs .lk{font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--copperS);color:var(--copper);font-weight:700}
.tabs button.on .lk{background:rgba(255,255,255,.18);color:#fff}
/* التنقل السفلي (الجوال) */
.nav{position:fixed;inset-inline:0;bottom:0;z-index:40;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;border:0;background:none;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;font-weight:600;color:var(--mute);cursor:pointer;border-radius:10px;position:relative}
.nav button b{font-size:20px;line-height:1.15;font-weight:400}
.nav button.on{color:var(--deep);background:#EAF3F3}
.nav .dot{position:absolute;top:4px;inset-inline-end:calc(50% - 18px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--copper);color:#fff;font-size:10.5px;line-height:17px;font-weight:700}
@media(min-width:780px){.nav{display:none}.wrap{padding-bottom:48px}}
@media(max-width:779px){.tabs{display:none}body.focus .ftabs{display:flex}}
body.focus .wrap{padding-bottom:40px}
body.embed{background:transparent}body.embed .bar{display:none}body.embed .wrap{padding-top:6px}
.demo-bar{display:flex;flex-direction:column;gap:3px;background:#FFF6E3;border:1px dashed #D9A441;color:#6B4A0E;border-radius:14px;padding:12px 14px;margin-bottom:16px;font-size:13.5px;line-height:1.7}
.mrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line);flex-wrap:wrap}.card h2+.mrow{border-top:0}
.mrow .mi{font-size:24px;width:44px;height:44px;border-radius:12px;background:#EEF4F4;display:grid;place-items:center;flex:none}
.mrow .grow{flex:1;min-width:200px}.mrow .grow>b{display:block}.mrow .grow>span{display:block;color:var(--mute);font-size:12.5px;line-height:1.6}
.mlinks{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}.mlinks a{font-size:13px;font-weight:600;color:var(--teal);text-decoration:none}
.mlinks.big a{padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#FAFCFC}
/* بطاقات وعناصر عامة */
.card{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:18px;border:1px solid rgba(225,234,234,.8)}
.card+.card{margin-top:14px}
.card>h2,.sec-h{margin:0 0 12px;font-size:16.5px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:10px;line-height:1.35}
.sec-h small,.card>h2 small{font-weight:500;color:var(--mute);font-size:12.5px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.muted{color:var(--mute)}.small{font-size:12.5px}
.btn{border:0;background:var(--teal);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .15s,opacity .15s;text-decoration:none;font-size:14.5px;line-height:1.3}
.btn:active{transform:scale(.97)}.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sec{background:#EAF1F1;color:var(--ink)}.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}.btn.bad{background:var(--bad)}.btn.cu{background:var(--copper)}.btn.gh{background:transparent;color:var(--deep);padding-inline:8px}
.btn.wide{width:100%}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;padding:12px 13px;border-radius:14px;background:#FAFCFC;border:1px solid var(--line)}
button.item,a.item{cursor:pointer;text-align:start;width:100%;font:inherit;color:inherit;text-decoration:none}
button.item:active,a.item:active{transform:scale(.99)}
.item .av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#E7F1F1;font-size:19px;flex:none}
.item .t{font-weight:600;line-height:1.4}.item .s{color:var(--mute);font-size:12.5px;line-height:1.5}.item .grow{flex:1;min-width:0}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--okS);color:var(--ok)}.b-warn{background:var(--warnS);color:var(--warn)}.b-bad{background:var(--badS);color:var(--bad)}.b-info{background:var(--infoS);color:var(--info)}.b-mute{background:#EEF2F2;color:var(--mute)}.b-cu{background:var(--copperS);color:var(--copper)}
.empty{text-align:center;color:var(--mute);padding:26px 12px;font-size:14px;line-height:1.8}
.empty b{display:block;font-size:28px;margin-bottom:4px}
.fld{margin-bottom:12px}.fld>label{display:block;font-weight:600;font-size:13.5px;margin-bottom:5px}
.fld input:not([type=checkbox]),.fld select,.fld textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line2);border-radius:11px;background:#F9FBFB}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 4px rgba(40,112,112,.14)}
.fld textarea{min-height:96px;resize:vertical;line-height:1.7}.fld .hint{font-size:12px;color:var(--mute);margin-top:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.6;cursor:pointer;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:#FAFCFC}
.chk input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--teal);flex:none}
.chk.on{border-color:var(--teal);background:#EFF7F7}
.note{padding:10px 12px;border-radius:12px;background:var(--infoS);color:var(--info);font-size:13.5px;line-height:1.7}
.note.w{background:var(--warnS);color:var(--warn)}.note.g{background:var(--okS);color:var(--ok)}.note.c{background:var(--copperS);color:var(--copper)}
.err{color:var(--bad);font-size:13.5px;min-height:20px;margin:6px 0}
.pbar{height:8px;border-radius:99px;background:#E6EEEE;overflow:hidden}.pbar i{display:block;height:100%;border-radius:99px;background:var(--teal);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.pbar.cu i{background:var(--copper)}.pbar.mi i{background:var(--mist)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.sw{position:relative;width:46px;height:28px;flex:none}.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;border-radius:99px;background:#CBD8D8;transition:background .2s;cursor:pointer}
.sw span::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.sw input:checked+span{background:var(--teal)}
html[dir=rtl] .sw input:checked+span::after{transform:translateX(-18px)}html[dir=ltr] .sw input:checked+span::after{transform:translateX(18px)}
.sw input:focus-visible+span{outline:3px solid #18A4B8;outline-offset:2px}
table.tb{width:100%;border-collapse:collapse;font-size:13.5px}
table.tb th{text-align:start;font-weight:600;color:var(--mute);font-size:12.5px;padding:8px 6px;border-bottom:1px solid var(--line)}
table.tb td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.tw{overflow-x:auto}
table.slip{width:100%;border-collapse:collapse;font-size:14px}table.slip td{padding:8px 4px;border-bottom:1px dashed var(--line)}table.slip td:last-child{text-align:end;font-variant-numeric:tabular-nums;font-weight:600}
table.slip tr.tot td{border-top:2px solid var(--ink);border-bottom:0;font-size:16px}
.view{animation:fade .3s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes rot{to{transform:rotate(360deg)}}
.spin{width:22px;height:22px;border:3px solid #CFE0E0;border-top-color:var(--teal);border-radius:50%;animation:rot .8s linear infinite;margin:40px auto}
.toast{position:fixed;inset-inline:0;bottom:calc(88px + env(safe-area-inset-bottom,0px));margin:0 auto;width:max-content;max-width:90%;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:120;box-shadow:var(--sh2);animation:pop .25s;font-size:14px}
/* النوافذ */
.mback{position:fixed;inset:0;z-index:80;background:rgba(16,41,43,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.modal{background:#fff;width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:pop .3s ease both}
.modal.wide{max-width:860px}
@media(min-width:680px){.mback{align-items:center;padding:20px}.modal{border-radius:20px}}
.modal h3{margin:0 0 14px;font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:10px;line-height:1.35}
.x{border:0;background:#EEF2F2;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:15px;flex:none}
.mf{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}.mf .btn{flex:1}

/* ===== الرئيسية ===== */
.hero{position:relative;border-radius:24px;padding:22px 22px 20px;color:#fff;background:var(--deep);overflow:hidden;box-shadow:var(--sh2)}
.hero::before{content:"";position:absolute;inset:0;background:url(icons/marsa-mark-white.png) no-repeat;background-size:190px;background-position:calc(100% + 40px) -30px;opacity:.07}
html[dir=rtl] .hero::before{background-position:-40px -30px}
.hero .hi{font-size:14px;opacity:.8}.hero h1{margin:2px 0 0;font-size:clamp(24px,5.4vw,32px);line-height:1.2;font-weight:700}
.hero .meta{margin-top:6px;font-size:13.5px;opacity:.8}
.pulse{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.14)}
.ring{position:relative;width:104px;height:104px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .rv b{font-size:28px;font-weight:700;display:block}.ring .rv span{font-size:11px;opacity:.75}
.pulse .pl{font-size:13px;opacity:.75}.pulse .pv{font-size:17px;font-weight:700;line-height:1.4;margin-top:2px}
.pulse .dl{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:99px;margin-top:6px;background:rgba(255,255,255,.14)}
.todo{margin-top:16px}
.todo a,.todo button{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh);width:100%;text-align:start;cursor:pointer;color:inherit;text-decoration:none;font:inherit}
.todo a+a,.todo button+button,.todo a+button,.todo button+a{margin-top:8px}
.todo .ti{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none;background:var(--copperS)}
.todo .tt{font-weight:600;line-height:1.4}.todo .ts{font-size:12.5px;color:var(--mute)}
.todo .go{margin-inline-start:auto;color:var(--mute);font-size:18px}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.quick button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px;text-align:start;cursor:pointer;box-shadow:var(--sh);font:inherit;color:inherit}
.quick button b{display:block;font-size:22px}.quick button span{font-weight:600;font-size:14px;display:block;margin-top:6px}.quick button small{color:var(--mute);font-size:12px}
.quick button[aria-disabled=true]{opacity:.6}

/* ===== قريباً ===== */
.soon{border-radius:24px;background:#fff;box-shadow:var(--sh2);overflow:hidden;border:1px solid var(--line)}
.soon .top{padding:26px 22px 20px;background:var(--deep);color:#fff;position:relative}
.soon .top h1{margin:0;font-size:clamp(22px,5vw,30px);line-height:1.25}.soon .top p{margin:8px 0 0;opacity:.82;max-width:52ch}
.soon ol{list-style:none;margin:0;padding:6px 0}
.soon li{display:flex;gap:14px;padding:14px 22px;border-top:1px solid var(--line);align-items:flex-start}
.soon li:first-child{border-top:0}
.soon li .ic{font-size:24px;line-height:1.2;flex:none;width:34px;text-align:center}
.soon li b{display:block;font-size:15.5px}.soon li span{color:var(--mute);font-size:13.5px;line-height:1.7}
.lockv{text-align:center;padding:40px 20px}.lockv b{font-size:40px;display:block}.lockv h2{margin:8px 0 6px}.lockv p{color:var(--mute);max-width:44ch;margin:0 auto;line-height:1.8}

/* ===== السياسات ===== */
.polhead{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.polhead .big{font-size:30px;font-weight:700;line-height:1;direction:ltr}
.polhead .grow{flex:1;min-width:200px}
.pol{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:16px;border:1px solid var(--line);background:#fff;width:100%;text-align:start;cursor:pointer;font:inherit;color:inherit;position:relative}
.pol+.pol{margin-top:10px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pcard{display:flex;flex-direction:column;gap:8px;text-align:start;padding:18px;border-radius:18px;border:1px solid var(--line);background:#fff;box-shadow:var(--sh);cursor:pointer;font:inherit;color:inherit;border-top:5px solid var(--teal);transition:transform .15s,box-shadow .15s;min-height:190px}
.pcard:hover{transform:translateY(-2px)}.pcard.done{border-top-color:var(--ok)}.pcard.upd{border-top-color:#C98A1B}.pcard.locked{opacity:.55;cursor:not-allowed;border-top-color:#B9C6C6}
.pc-top{display:flex;justify-content:space-between;align-items:center}.pc-ic{font-size:30px;width:52px;height:52px;border-radius:14px;background:#EEF4F4;display:grid;place-items:center}
.pc-no{font-size:12px;color:var(--mute)}.pc-t{font-weight:700;font-size:16.5px;line-height:1.45}.pc-s{color:var(--mute);font-size:13px;line-height:1.65;flex:1}
.chl{margin:6px 0 4px;padding-inline-start:22px;line-height:2}
.pol .n{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;background:#EEF4F4;color:var(--deep);font-family:"Inter",var(--font)}
.pol.done .n{background:var(--ok);color:#fff}.pol.todo .n{background:var(--copper);color:#fff}.pol.upd .n{background:var(--warn);color:#fff}
.pol.locked{cursor:not-allowed;background:#FAFCFC}.pol.locked .n{background:#E3EAEA;color:#90A3A4}.pol.locked .pt{color:var(--mute)}
.pol .pt{font-weight:700;font-size:15.5px;line-height:1.4}.pol .ps{color:var(--mute);font-size:13px;margin-top:2px;line-height:1.6}
.pol .pm{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pol:not(:last-child)::after{content:"";position:absolute;inset-inline-start:31px;top:52px;bottom:-12px;width:2px;background:var(--line);z-index:0}
/* القارئ */
.reader{position:fixed;inset:0;z-index:90;background:var(--paper);display:flex;flex-direction:column;animation:fade .2s}
.rd-top{background:#fff;border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
.rd-top .rt{display:flex;align-items:center;gap:10px}.rd-top h3{margin:0;font-size:16px;flex:1;line-height:1.35}
.rd-steps{display:flex;gap:4px;margin-top:10px}.rd-steps i{flex:1;height:5px;border-radius:9px;background:#E3EAEA}.rd-steps i.on{background:var(--teal)}.rd-steps i.cur{background:var(--copper)}
.rd-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.rd-in{max-width:680px;margin:0 auto;padding:22px 20px 40px}
.rd-in .kick{color:var(--copper);font-weight:700;font-size:13px}
.rd-in h2{margin:4px 0 14px;font-size:clamp(20px,4.6vw,25px);line-height:1.35}
.prose{font-size:16px;line-height:1.95}.prose p{margin:0 0 12px}.prose ul{margin:0 0 12px;padding-inline-start:22px}.prose li{margin-bottom:6px}
.rd-end{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:13px;margin-top:26px;padding-top:14px;border-top:1px dashed var(--line2)}
.rd-foot{background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.rd-foot .in{max-width:680px;margin:0 auto;display:flex;gap:10px;align-items:center}
.rd-foot .hint{flex:1;font-size:12.5px;color:var(--mute)}
.sig{font-size:18px!important;letter-spacing:.3px;border-style:dashed!important}

/* ===== الأثر ===== */
.imp-hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.imp-hero .ring{width:128px;height:128px}.imp-hero .ring .rv b{font-size:34px;color:var(--deep)}.imp-hero .ring .rv span{color:var(--mute);opacity:1}
.imp-hero h2{margin:0;font-size:19px;line-height:1.4}.imp-hero p{margin:6px 0 0;color:var(--mute);font-size:14px;line-height:1.7}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--mute);margin-top:8px}.legend i{display:inline-block;width:18px;height:3px;border-radius:3px;vertical-align:middle;margin-inline-end:6px}
.rank .item{background:#fff}.rank .item.me{border-color:var(--teal);background:#EFF7F7}
.rank .pos{width:30px;text-align:center;font-weight:700;color:var(--mute);font-family:"Inter",var(--font)}
.kudo{padding:16px;border-radius:16px;background:var(--copperS);color:#4A2A10;position:relative}
.kudo+.kudo{margin-top:10px}
.kudo q{display:block;font-size:15.5px;line-height:1.8;quotes:"«" "»"}
.kudo .who{font-size:12.5px;margin-top:8px;opacity:.8}

/* ===== المهارات ===== */
.tier{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.tier .pts{font-size:40px;font-weight:700;line-height:1;color:var(--deep)}
.tier .grow{flex:1;min-width:220px}
.path{display:flex;margin-top:14px;gap:4px}
.path div{flex:1;text-align:center;font-size:11.5px;color:var(--mute);position:relative;padding-top:18px;line-height:1.4}
.path div::before{content:"";position:absolute;top:4px;inset-inline:0;height:6px;border-radius:9px;background:#E3EAEA}
.path div.on::before{background:var(--teal)}.path div.cur{color:var(--ink);font-weight:700}.path div.cur::before{background:var(--copper)}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.sk{border-radius:18px;border:1px solid var(--line);padding:16px 14px;background:#fff;text-align:center}
.sk .si{font-size:30px;line-height:1}.sk .sn{font-weight:700;margin-top:8px}.sk .sl{font-size:12.5px;color:var(--mute)}
.pips{display:flex;justify-content:center;gap:5px;margin-top:10px}.pips i{width:22px;height:6px;border-radius:9px;background:#E3EAEA}.pips i.on{background:var(--teal)}
.sk.l3{border-color:var(--copper);background:linear-gradient(180deg,#FFF9F3,#fff)}.sk.l3 .pips i.on{background:var(--copper)}
.sk.l0{opacity:.62}
.bdgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.bdg{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:#FAFCFC;border:1px solid var(--line)}
.bdg .bi{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--copperS);flex:none}

/* ===== صوتك ===== */
.vstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.vstats div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.vstats b{display:block;font-size:26px;line-height:1.1;color:var(--deep)}.vstats span{font-size:12.5px;color:var(--mute)}
.idea{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
.idea+.idea{margin-top:12px}
.idea .ih{display:flex;gap:10px;align-items:flex-start}
.idea h4{margin:0;font-size:16px;line-height:1.45;flex:1}
.idea .id{color:var(--ink);font-size:14.5px;line-height:1.8;margin-top:6px;white-space:pre-line}
.idea .im{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:12.5px;color:var(--mute)}
.track{display:flex;margin-top:14px;gap:4px}
.track span{flex:1;font-size:11.5px;text-align:center;color:var(--mute);padding-top:16px;position:relative;line-height:1.35}
.track span::before{content:"";position:absolute;top:3px;inset-inline:0;height:5px;border-radius:9px;background:#E3EAEA}
.track span.on::before{background:var(--teal)}.track span.on{color:var(--ink);font-weight:600}
.track span.no::before{background:var(--bad)}.track span.no{color:var(--bad);font-weight:600}
.reply{margin-top:12px;padding:10px 12px;border-radius:12px;background:#F1F6F6;border-inline-start:3px solid var(--teal);font-size:13.5px;line-height:1.75}
.reply b{display:block;font-size:12px;color:var(--deep)}
.vote{border:1.5px solid var(--line2);background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;color:var(--deep)}
.vote.on{background:var(--deep);border-color:var(--deep);color:#fff}
.vote[disabled]{cursor:default;opacity:.7}

/* ===== الخريف ===== */
.kh{border-radius:24px;overflow:hidden;background:#fff;box-shadow:var(--sh2);border:1px solid var(--line)}
.kh .top{padding:24px 22px;color:#fff;background:linear-gradient(170deg,#3F6F58 0%,#5E8F6E 55%,#8DB39A 100%);position:relative;overflow:hidden}
.kh .top::after{content:"";position:absolute;inset:auto -10% -40px -10%;height:90px;background:radial-gradient(60% 100% at 50% 100%,rgba(255,255,255,.35),transparent 70%)}
.kh .top h1{margin:0;font-size:clamp(22px,5vw,30px);line-height:1.25}.kh .top p{margin:8px 0 0;opacity:.9;line-height:1.8;max-width:56ch}
.cd{display:flex;gap:10px;margin-top:16px;position:relative;z-index:1}
.cd div{background:rgba(255,255,255,.16);border-radius:14px;padding:10px 14px;min-width:78px;text-align:center}
.cd b{display:block;font-size:26px;line-height:1.1}.cd span{font-size:12px;opacity:.85}
.kh .bd{padding:18px 22px}
.tgt+.tgt{margin-top:14px}.tgt .tl{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px;gap:10px}.tgt .tl b{font-weight:600}
.stars{display:flex;flex-direction:column;gap:8px}

/* ===== الإدارة ===== */
.adm-note{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--copperS);color:#5B3413;font-size:13.5px;margin-bottom:14px;line-height:1.7}
.tog{display:flex;align-items:center;gap:14px;padding:13px 2px;border-bottom:1px solid var(--line)}
.tog:last-child{border-bottom:0}.tog .grow{flex:1}.tog b{display:block;font-size:14.5px}.tog span{font-size:12.5px;color:var(--mute)}
.secrow{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:#FAFCFC}
.secrow .sr-h{display:flex;gap:8px;align-items:center;margin-bottom:8px}.secrow .sr-h b{flex:1;font-size:13.5px}
.ops{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-block;min-width:20px;padding:1px 7px;border-radius:99px;background:var(--copper);color:#fff;font-size:11px;font-weight:700;text-align:center;line-height:17px}
@media(max-width:520px){.wrap{padding:14px 14px 118px}.card{padding:16px 14px}.row2{grid-template-columns:1fr}.imp-hero{grid-template-columns:1fr;justify-items:start}.pulse{gap:14px}.ring{width:92px;height:92px}.vstats b{font-size:22px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== الطباعة ===== */
#printArea{display:none}
@media print{
  @page{size:A4;margin:14mm}
  body>*:not(#printArea){display:none!important}

  html,body{background:#fff!important;padding:0!important}
}
.pd-head{display:flex;align-items:center;gap:14px;border-bottom:2px solid #16474A;padding-bottom:10px;margin-bottom:16px}
.pd-head img{width:62px;height:62px;object-fit:contain}.pd-head .co{flex:1}.pd-head .co b{display:block;font-size:14pt}.pd-head .co span{font-size:10pt;color:#555}
.pd-head .ref{font-size:9.5pt;color:#555;text-align:end;line-height:1.6}
.pd-title{font-size:17pt;margin:0 0 4px}.pd-sub{color:#555;font-size:10.5pt;margin:0 0 14px}
.pd-sec{page-break-inside:avoid;margin-bottom:12px}.pd-sec h3{font-size:12.5pt;margin:0 0 6px;color:#16474A}
.pd-box{border:1px solid #999;border-radius:6px;padding:12px 14px;margin:12px 0}
.pd-tb{width:100%;border-collapse:collapse;font-size:10.5pt}.pd-tb td,.pd-tb th{border:1px solid #aaa;padding:6px 8px;text-align:start;vertical-align:top}.pd-tb th{background:#EEF3F3}
.pd-sign{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:34px}.pd-sign div{border-top:1px solid #333;padding-top:6px;font-size:10.5pt;text-align:center}
.pd-foot{margin-top:22px;font-size:9pt;color:#666;border-top:1px solid #ccc;padding-top:6px;display:flex;justify-content:space-between}

    else if(k==='vxs:tally'&&hasTally)d.tally=o||{};

function ratings(){return D.imps.filter(function(x){return x.kind==='rating'&&x.week&&Number(x.rating)>0})}
function weeksList(n){var s={};ratings().forEach(function(r){s[r.week]=1});return Object.keys(s).sort().slice(-(n||8))}
function bRating(b,w){var l=ratings().filter(function(r){return r.building===b&&r.week===w});if(!l.length)return null;var sum=0,rv=0;l.forEach(function(r){sum+=Number(r.rating);rv+=Number(r.reviews||0)});return {v:sum/l.length,reviews:rv,note:l[l.length-1].note||''}}
function coRating(w){var l=ratings().filter(function(r){return r.week===w});if(!l.length)return null;var sum=0;l.forEach(function(r){sum+=Number(r.rating)});return {v:sum/l.length,n:l.length}}
function myImpact(){var b=D.emp&&D.emp.building,ws=weeksList(8),cur=null,prev=null,w=null,pw=null;
  var useB=b&&ratings().some(function(r){return r.building===b});
  for(var i=ws.length-1;i>=0;i--){var v=useB?bRating(b,ws[i]):coRating(ws[i]);if(v){if(!cur){cur=v;w=ws[i]}else if(!prev){prev=v;pw=ws[i];break}}}
  return {b:b,useB:useB,cur:cur,prev:prev,week:w,weeks:ws}}

function skillData(){if(!TD||TD.err||TD.loading)return null;var my=me(),res=TD.res||{};
  var mods=TD.mods.filter(function(m){return !m.assignees||m.assignees==='all'||(Array.isArray(m.assignees)&&m.assignees.map(String).indexOf(my)>=0)});
  var cats={},pts=0,next=null;
  mods.forEach(function(m){var c=SKC[m.category]?m.category:'general',r=res[m.id]||{};cats[c]=cats[c]||{total:0,passed:0,sum:0};cats[c].total++;
    if(r.passed){cats[c].passed++;cats[c].sum+=Number(r.score||0);pts+=Math.round(Number(r.score||0)/10)}
    else if(!next||String(m.dueDate||'9')<String(next.dueDate||'9'))next=m});
  Object.keys(cats).forEach(function(c){var x=cats[c],avg=x.passed?x.sum/x.passed:0;x.avg=avg;x.lv=!x.passed?0:(x.passed===x.total&&avg>=85)?3:(x.passed/x.total>=.5&&avg>=75)?2:1});
  var mine=D.bdgs.filter(function(b){return String(b.empId)===my});mine.forEach(function(b){pts+=Number(b.points||10)});
  var ti=0;TIERS.forEach(function(x,i){if(pts>=x[0])ti=i});
  return {cats:cats,pts:pts,tier:ti,next:next,mods:mods,badges:mine}}

function openReader(p,reviewOnly){
  if(!D.emp&&!reviewOnly){toast(t('noEmp'));return}
  var secs=(p.sections||[]).filter(function(s){return (s.title||'')+(s.body||'')}),total=secs.length+(reviewOnly?0:1),step=0,reached={};

  var io=null,close=function(){if(io)io.disconnect();el.remove();document.body.style.overflow=''};
  function paint(){
    var isAck=!reviewOnly&&step===secs.length,s=secs[step];
    el.innerHTML='<div class="rd-top"><div class="rt"><button class="x" type="button" id="rdX" aria-label="'+t('close')+'">✕</button><h3>'+esc(p.icon||'📜')+' '+esc(p.title)+'</h3><span class="small muted num">'+(step+1)+'/'+total+'</span></div><div class="rd-steps">'+
      Array.apply(null,Array(total)).map(function(_,i){return '<i class="'+(i<step?'on':i===step?'cur':'')+'"></i>'}).join('')+'</div></div>'+
      '<div class="rd-body" id="rdB"><div class="rd-in">'+(isAck?ackForm():'<div class="kick">'+(LANG==='ar'?'الفصل ':'Section ')+(step+1)+' '+t('of')+' '+secs.length+'</div><h2>'+esc(s.title||'')+'</h2><div class="prose">'+fmtText(s.body)+'</div><div class="rd-end" id="rdEnd">⎯ '+t('endSec')+'</div>')+'</div></div>'+
      '<div class="rd-foot"><div class="in">'+(step>0?'<button class="btn sec" type="button" id="rdP">'+t('prev')+'</button>':'')+'<span class="hint" id="rdH">'+(isAck?'':(reached[step]||reviewOnly?'':t('readToEnd')))+'</span>'+
      (isAck?'<button class="btn cu" type="button" id="rdA">✍️ '+t('ackBtn')+'</button>':(step<secs.length-1||!reviewOnly)?'<button class="btn" type="button" id="rdN" '+(reached[step]||reviewOnly?'':'disabled')+'>'+t('next')+'</button>':'<button class="btn" type="button" id="rdC">'+t('close')+'</button>')+'</div></div>';
    $('#rdX',el).onclick=close;var pb=$('#rdP',el);if(pb)pb.onclick=function(){step--;paint()};
    var nb=$('#rdN',el);if(nb)nb.onclick=function(){step++;paint();$('#rdB',el).scrollTop=0};
    var cb=$('#rdC',el);if(cb)cb.onclick=close;
    if(!isAck&&!reached[step]&&!reviewOnly){var end=$('#rdEnd',el),mark=function(){reached[step]=true;var n=$('#rdN',el);if(n)n.disabled=false;var h=$('#rdH',el);if(h)h.textContent=''};
      if(io)io.disconnect();
      if('IntersectionObserver' in window){io=new IntersectionObserver(function(en){if(en.some(function(e){return e.isIntersecting})){mark();io.disconnect()}},{root:$('#rdB',el),threshold:1});io.observe(end)}
      else setTimeout(mark,1500)}
    if(isAck)bindAck()}
  function ackForm(){return '<div class="kick">'+t('ackStep')+'</div><h2>'+esc(p.title)+' — '+t('ver')+' '+(p.version||1)+'</h2><p class="muted" style="line-height:1.8">'+t('ackLead')+'</p>'+
    '<div class="list" style="margin:14px 0">'+stmts.map(function(s,i){return '<label class="chk"><input type="checkbox" data-st="'+i+'"><span>'+esc(s)+'</span></label>'}).join('')+'</div>'+
    '<div class="fld"><label for="sigN">'+t('fullName')+'</label><input id="sigN" class="sig" autocomplete="name"><div class="hint">'+t('nameHint')+' '+esc(D.emp.name||'')+'</div></div><div class="err" id="ackE" role="alert"></div>'}
  function bindAck(){$$('[data-st]',el).forEach(function(c){c.onchange=function(){c.closest('.chk').classList.toggle('on',c.checked)}});
    $('#rdA',el).onclick=function(){var all=$$('[data-st]',el).every(function(c){return c.checked}),nm=$('#sigN',el).value.trim().replace(/\s+/g,' ');
      if(!all){$('#ackE',el).textContent=t('ackErrS');return}if(nm.split(' ').length<2){$('#ackE',el).textContent=t('ackErrN');return}
      var btn=this;btn.disabled=true;var a={empId:me(),pid:p.id,v:Number(p.version||1),at:new Date().toISOString(),name:nm,statements:stmts,title:p.title,no:p.no||'',code:D.emp.code||'',building:D.emp.building||'',ref:'SPA-'+String(p.no||p.id).replace(/[^A-Za-z0-9-]/g,'')+'-V'+(p.version||1)+'-'+(D.emp.code||me())};
      push([{k:'spa:'+me()+'.'+p.id,v:JSON.stringify(a)}]).then(function(r){if(r&&r.skipped){throw 0}
        $('#rdB',el).innerHTML='<div class="rd-in" style="text-align:center;padding-top:40px"><div style="font-size:52px">✅</div><h2>'+t('ackDone')+'</h2><p class="muted" style="line-height:1.8;max-width:44ch;margin:0 auto">'+t('ackDoneP')+'</p><div class="mf" style="max-width:420px;margin:22px auto 0"><button class="btn" type="button" id="okR">🧾 '+t('printAck')+'</button><button class="btn sec" type="button" id="okP">🖨️ '+t('printPol')+'</button></div></div>';

        $('#okR',el).onclick=function(){printReceipt(p,a,D.emp)};$('#okP',el).onclick=function(){printPolicy(p)};$('#okC',el).onclick=function(){close();render()}
      }).catch(function(){btn.disabled=false;$('#ackE',el).textContent=t('neterr')})}}
  paint()}

function lineChart(ws,a,b){var W_=340,H_=150,px=24,py=16,n=ws.length;if(n<2)return '';
  var x=function(i){var r=px+i*(W_-2*px)/(n-1);return LANG==='ar'?W_-r:r},lo=Infinity,hi=-Infinity;
  a.concat(b).forEach(function(v){if(v!=null){lo=Math.min(lo,v);hi=Math.max(hi,v)}});lo=Math.max(0,Math.floor((lo-.3)*2)/2);hi=Math.min(5,Math.ceil((hi+.2)*2)/2);if(hi-lo<1)lo=Math.max(0,hi-1);
  var y=function(v){return py+(hi-v)*(H_-2*py)/(hi-lo)};
  var path=function(arr){var d='',pen=false;arr.forEach(function(v,i){if(v==null){pen=false;return}d+=(pen?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' ';pen=true});return d};
  var dots=function(arr,c){return arr.map(function(v,i){return v==null?'':'<circle cx="'+x(i).toFixed(1)+'" cy="'+y(v).toFixed(1)+'" r="3.4" fill="#fff" stroke="'+c+'" stroke-width="2"/>'}).join('')};
  var grid=[lo,(lo+hi)/2,hi].map(function(g){return '<line x1="'+px+'" x2="'+(W_-px)+'" y1="'+y(g).toFixed(1)+'" y2="'+y(g).toFixed(1)+'" stroke="#E3EAEA" stroke-dasharray="3 4"/><text x="'+(LANG==='ar'?W_-4:4)+'" y="'+(y(g)+4).toFixed(1)+'" font-size="9" fill="#8AA0A1" text-anchor="'+(LANG==='ar'?'end':'start')+'">'+g.toFixed(1)+'</text>'}).join('');
  var labs=ws.map(function(w,i){return (i===0||i===n-1||i===Math.floor((n-1)/2))?'<text x="'+x(i).toFixed(1)+'" y="'+(H_+2)+'" font-size="9.5" fill="#6B8283" text-anchor="middle">'+fshort(w)+'</text>':''}).join('');
  return '<svg class="chart" viewBox="0 0 '+W_+' '+(H_+10)+'" role="img" aria-label="'+t('trend')+'">'+grid+'<path d="'+path(b)+'" fill="none" stroke="#B9C9C9" stroke-width="2" stroke-dasharray="5 4"/><path d="'+path(a)+'" fill="none" stroke="#287070" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>'+dots(b,'#B9C9C9')+dots(a,'#287070')+labs+'</svg>'}
