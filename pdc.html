<style>
:root{color-scheme:light;--teal:#287070;--deep:#16474A;--paper:#F3F6F6;--ink:#10292B;--mute:#5E7475;--line:#DDE8E8;--ok:#1E7A4F;--bad:#A3261F;--gold:#B8892B;--fin:#5C4A1E;
  --sh:0 1px 2px rgba(16,41,43,.05),0 8px 24px rgba(16,41,43,.08);--font:"IBM Plex Sans Arabic","Inter",-apple-system,"Segoe UI",Tahoma,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(1200px 500px at 90% -10%,#E2EFEF 0,transparent 60%),var(--paper);color:var(--ink);font:16px/1.75 var(--font);-webkit-font-smoothing:antialiased}
.bar{position:sticky;top:0;z-index:20;background:rgba(243,246,246,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0)}
.bar-in{max-width:980px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px;min-height:58px}
.bar img{height:40px}.sp{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:600 14px var(--font);color:var(--ink);cursor:pointer;box-shadow:var(--sh);text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.btn.pri{background:var(--teal);color:#fff;border-color:var(--teal)}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 60px}
h1{font-size:clamp(22px,5vw,30px);line-height:1.3;margin:6px 0 2px}
.mute{color:var(--mute);font-size:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--sh);margin:14px 0}
.hero{background:linear-gradient(135deg,#3E3215,var(--fin));color:#fff;border:0}
.hero .mute{color:rgba(255,255,255,.82)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.stat{background:rgba(255,255,255,.12);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font:700 20px "Inter"}.stat small{font-size:12px;opacity:.85}
.prog{height:10px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden;margin-top:12px}.prog i{display:block;height:100%;background:#F2C14E;border-radius:99px;transition:width .3s}
.fx{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.fxi{border:1px solid var(--line);border-radius:14px;padding:8px 12px;display:flex;align-items:center;gap:8px}
.fxi small{display:block;color:var(--mute);font:600 11.5px "Inter";letter-spacing:.3px}
.fxi b{display:block;font-size:14px;font-weight:600;unicode-bidi:plaintext}
.fxi div{flex:1;min-width:0}
.cp{border:1px solid var(--line);background:#F2F7F7;border-radius:10px;padding:4px 10px;font:600 12.5px var(--font);cursor:pointer;color:var(--deep);flex:none}
.cp.done{background:var(--ok);color:#fff;border-color:var(--ok)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools input,.tools select{border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:500 14px var(--font);background:#fff;color:var(--ink)}
.tools input{flex:1;min-width:160px}
.ch{border:1px solid var(--line);border-radius:18px;background:#fff;margin:10px 0;padding:12px 14px;box-shadow:var(--sh)}
.ch.ok{background:#F3FAF6;border-color:#BFE3CF}
.ch.warn{border-color:#E3B341}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.num{width:36px;height:36px;border-radius:11px;background:#F4EFE3;color:var(--fin);display:grid;place-items:center;font:700 14px "Inter";flex:none}
.ch.ok .num{background:var(--ok);color:#fff}
.k{display:flex;flex-direction:column;line-height:1.3}
.k small{color:var(--mute);font-size:11.5px}.k b{font:700 15px "Inter"}
.amt{margin-inline-start:auto;font:700 16px "Inter";color:var(--fin)}
.memo{margin-top:8px;background:#FAFBFB;border:1px dashed var(--line);border-radius:12px;padding:8px 10px;font-size:13.5px;display:flex;gap:8px;align-items:flex-start}
.memo span{flex:1;unicode-bidi:plaintext}
.row2{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.done-t{margin-inline-start:auto;display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;cursor:pointer}
.done-t input{width:20px;height:20px;accent-color:var(--ok)}
.note{background:#FFF8E6;border-inline-start:4px solid #E3B341;padding:6px 10px;border-radius:10px;font-size:13px;margin-top:8px}
.yr{margin:18px 4px 4px;font:700 15px "Inter";color:var(--fin)}
.deny{text-align:center;padding:40px 18px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
@media(max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}.fx{grid-template-columns:1fr}}
@media print{.bar,.tools,.cp,.done-t,.noprint{display:none!important}.ch,.card{box-shadow:none;break-inside:avoid}.hero{background:#fff;color:#000;border:1px solid #999}.hero .mute{color:#333}.stat{background:#f3f3f3}}
</style>
</head>
