<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#12343B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="البسيسي">
<title>البسيسي · ميزانية العائلة</title>
<link rel="manifest" href="family.webmanifest">
<link rel="apple-touch-icon" href="icons/family-180.png">
<link rel="icon" id="favIcon" href="icons/family-32.png">
<link rel="preload" href="fonts/readex-ar-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Readex';src:url(fonts/readex-ar-400.woff2) format('woff2');font-weight:400;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E,U+2010-2011,U+204F,U+2E41}
@font-face{font-family:'Readex';src:url(fonts/readex-la-400.woff2) format('woff2');font-weight:400;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Readex';src:url(fonts/readex-ar-500.woff2) format('woff2');font-weight:500;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E,U+2010-2011,U+204F,U+2E41}
@font-face{font-family:'Readex';src:url(fonts/readex-la-500.woff2) format('woff2');font-weight:500;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Readex';src:url(fonts/readex-ar-700.woff2) format('woff2');font-weight:700;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E,U+2010-2011,U+204F,U+2E41}
@font-face{font-family:'Readex';src:url(fonts/readex-la-700.woff2) format('woff2');font-weight:700;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --navy-900:#12343B; --navy-800:#1D4F57; --navy-700:#26616A; --navy-600:#2F6F78;
  --gold:#E0A82E; --gold-soft:#E9B949; --gold-pale:#FBF1D6;
  --ivory:#F3F7F7; --card:#FFFFFF; --ink:#1E2B26; --muted:#6A7A72; --line:#E0E8E8;
  --green:#2E8B67; --red:#C2453D; --amber:#C98A1B;
  --radius:22px; --radius-sm:14px;
  --shadow:0 10px 30px -12px rgba(18,52,59,.18), 0 2px 6px rgba(18,52,59,.05);
  --ease:cubic-bezier(.22,.8,.24,1);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Readex',system-ui,-apple-system,sans-serif;background:var(--ivory);color:var(--ink);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.big{font-size:19px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.hidden{display:none!important}

/* ============ LOGIN ============ */
#login{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:calc(32px + var(--safe-t)) 22px 32px;
  background:radial-gradient(120% 70% at 50% -10%,#3C7F86 0%,var(--navy-800) 55%,var(--navy-900) 100%);position:relative;overflow:hidden}
#login::before{content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 15% 85%,rgba(233,185,73,.12),transparent 40%),
  radial-gradient(circle at 90% 20%,rgba(233,185,73,.08),transparent 35%);pointer-events:none}
.wave{position:absolute;bottom:-2px;left:0;right:0;opacity:.07;pointer-events:none}
.brand{text-align:center;margin-bottom:34px;position:relative;animation:rise .9s var(--ease) both}
.emblem{width:84px;height:84px;margin:0 auto 18px;border-radius:26px;display:grid;place-items:center;
  background:linear-gradient(145deg,#26616A,#1D4F57);border:1px solid rgba(233,185,73,.45);
  box-shadow:0 18px 40px -10px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08)}
.emblem svg{width:46px;height:46px}
.brand h1{font-family:'Readex',sans-serif;font-size:44px;font-weight:700;color:#fff;line-height:1.3}
.brand h1 span{color:var(--gold)}
.brand p{color:rgba(255,255,255,.5);margin-top:14px;font-size:14px}
.brand-ar{color:var(--gold-soft);font-size:18px;font-weight:700;margin-top:10px;letter-spacing:.5px;display:flex;align-items:center;justify-content:center;gap:10px}
.brand-ar::before,.brand-ar::after{content:"";width:26px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.brand-ar::after{transform:scaleX(-1)}
.tb-brand{display:flex;align-items:center;justify-content:space-between;margin-top:18px;position:relative;z-index:1}
.tb-brand .wm{font-family:'Readex',sans-serif;font-size:15px;font-weight:700;color:var(--gold-soft);letter-spacing:.6px}
.ph .wm{font-family:'Readex',sans-serif;font-size:13px;color:var(--gold-soft);letter-spacing:.6px;opacity:.85}
.login-card{width:100%;max-width:400px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:28px;padding:28px 22px;position:relative;animation:rise .9s .12s var(--ease) both}
.field{position:relative;margin-bottom:16px}
.field label{display:block;color:rgba(255,255,255,.7);font-size:14px;margin-bottom:8px;font-weight:500}
.field input{width:100%;height:56px;border-radius:16px;border:1px solid rgba(255,255,255,.14);background:rgba(20,52,44,.35);
  color:#fff;padding:0 18px;font-size:17px;outline:none;transition:border-color .25s,box-shadow .25s;direction:ltr;text-align:left}
.field input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(233,185,73,.15)}
.field .eye{position:absolute;right:14px;bottom:15px;color:rgba(255,255,255,.5);padding:4px}
.btn-gold{width:100%;height:56px;border-radius:16px;font-weight:700;font-size:17px;color:var(--navy-900);
  background:linear-gradient(135deg,var(--gold-soft),var(--gold) 55%,#A9861A);box-shadow:0 12px 26px -10px rgba(233,185,73,.65);
  transition:transform .2s var(--ease),filter .2s;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px}
.btn-gold:active{transform:scale(.98)}
.btn-gold[disabled]{filter:grayscale(.4) brightness(.9)}
.login-err{color:#FFB4AE;font-size:14px;text-align:center;min-height:22px;margin-top:12px}
.login-foot{color:rgba(255,255,255,.35);font-size:12.5px;margin-top:28px;text-align:center;position:relative}
.spinner{width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(18,52,59,.25);border-top-color:var(--navy-900);animation:spin .8s linear infinite}

/* ============ SPLASH ============ */
#splash{position:fixed;inset:0;background:var(--navy-800);display:grid;place-items:center;z-index:100;transition:opacity .5s}
#splash .emblem{animation:pulse 1.6s ease-in-out infinite}

/* ============ APP SHELL ============ */
#app{min-height:100%;padding-bottom:calc(96px + var(--safe-b))}
.topbar{background:linear-gradient(170deg,var(--navy-700) 0%,var(--navy-800) 60%,var(--navy-900) 100%);
  color:#fff;padding:calc(18px + var(--safe-t)) 20px 92px;border-radius:0 0 34px 34px;position:relative;overflow:hidden}
.topbar::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;left:-90px;top:-120px;
  background:radial-gradient(circle,rgba(233,185,73,.18),transparent 70%)}
.tb-row{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.avatar{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-weight:800;font-size:18px;
  background:linear-gradient(145deg,var(--gold-soft),var(--gold));color:var(--navy-900)}
.hello{flex:1;margin:0 12px}
.hello small{display:block;color:rgba(255,255,255,.55);font-size:13px}
.hello b{font-size:19px;font-weight:700}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.1);color:#fff;position:relative}
.icon-btn .dot{position:absolute;top:9px;left:10px;width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px var(--navy-800)}
.tb-date{color:rgba(255,255,255,.5);font-size:13px;margin-top:18px;position:relative;z-index:1}

.wrap{padding:0 18px;max-width:640px;margin:0 auto}
.hero{margin-top:-74px;position:relative;z-index:2;border-radius:28px;padding:24px 22px;color:#fff;overflow:hidden;
  background:linear-gradient(135deg,#3C7D6A 0%,#1D4F57 100%);border:1px solid rgba(233,185,73,.35);box-shadow:0 24px 48px -20px rgba(24,58,49,.6)}
.hero::before{content:"";position:absolute;inset:0;background:
  linear-gradient(115deg,transparent 40%,rgba(233,185,73,.12) 50%,transparent 60%);background-size:250% 100%;animation:sheen 6s ease-in-out infinite}
.hero-lbl{display:flex;align-items:center;gap:8px;color:var(--gold-soft);font-size:14px;font-weight:500;position:relative}
.hero-amt{font-size:40px;font-weight:800;margin:6px 0 2px;letter-spacing:-.5px;position:relative;line-height:1.2}
.hero-amt small{font-size:16px;font-weight:500;color:rgba(255,255,255,.6);margin-right:6px}
.hero-sub{color:rgba(255,255,255,.55);font-size:13.5px;position:relative}
.hero-split{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px;position:relative}
.hs{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:12px 10px}
.hs span{display:block;font-size:12px;color:rgba(255,255,255,.55)}
.hs b{font-size:16px;font-weight:700}
.hs.d b{color:#FFB4AE}.hs.s b{color:#9FE0C4}.hs.e b{color:var(--gold-soft)}

.sec-h{display:flex;justify-content:space-between;align-items:center;margin:28px 2px 14px}
.sec-h h3{font-size:18px;font-weight:700}
.sec-h a,.sec-h button{color:var(--gold);font-size:14px;font-weight:600;text-decoration:none}

.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
body.big .quick{grid-template-columns:repeat(2,1fr)}
.qa{background:var(--card);border-radius:20px;padding:16px 6px 13px;text-align:center;box-shadow:var(--shadow);
  border:1px solid rgba(225,231,222,.6);transition:transform .2s var(--ease)}
.qa:active{transform:scale(.95)}
.qa .ic{width:46px;height:46px;border-radius:15px;margin:0 auto 9px;display:grid;place-items:center}
.qa span{font-size:13px;font-weight:600;color:var(--ink);display:block;line-height:1.3}
body.big .qa{padding:22px 10px 18px}
body.big .qa .ic{width:58px;height:58px}
body.big .qa span{font-size:17px}
.ic-exp{background:#FDECEA;color:var(--red)}.ic-inc{background:#E3F4EC;color:var(--green)}
.ic-req{background:#FBF2DA;color:var(--amber)}.ic-sur{background:#E7EDF7;color:var(--navy-600)}
.ic-sup{background:#F1EAFB;color:#6B46B5}.ic-rate{background:#E4F1F6;color:#1F7A99}

.cards2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);border:1px solid rgba(225,231,222,.6)}
.card.tap{transition:transform .2s var(--ease)}.card.tap:active{transform:scale(.97)}
.mini-lbl{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.mini-amt{font-size:22px;font-weight:800;margin-top:6px}
.mini-amt small{font-size:12px;color:var(--muted);font-weight:500}
.bar{height:7px;border-radius:7px;background:#E6ECE3;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,var(--gold-soft),var(--gold));width:0;transition:width 1.2s var(--ease)}
.bar.g i{background:linear-gradient(90deg,#7FD1AE,var(--green))}
.bar.r i{background:linear-gradient(90deg,#F0A39D,var(--red))}

.list{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid rgba(225,231,222,.6);overflow:hidden}
.row{display:flex;align-items:center;gap:13px;padding:15px 16px;border-bottom:1px solid #EBF0E8}
.row:last-child{border-bottom:0}
.row .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex-shrink:0}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{color:var(--muted);font-size:12.5px}
.row .v{font-weight:700;font-size:15px}
.v.minus{color:var(--red)}.v.plus{color:var(--green)}
.empty{text-align:center;padding:34px 20px;color:var(--muted)}
.empty .ic{width:64px;height:64px;border-radius:20px;margin:0 auto 12px;display:grid;place-items:center;background:var(--gold-pale);color:var(--gold)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;margin-bottom:14px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:9px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--muted);transition:.2s}
.chip.on{background:var(--navy-800);color:#fff;border-color:var(--navy-800)}

/* page header for inner tabs */
.ph{background:linear-gradient(170deg,var(--navy-700),var(--navy-900));color:#fff;padding:calc(20px + var(--safe-t)) 20px 26px;border-radius:0 0 30px 30px;margin-bottom:20px}
.ph h2{font-size:24px;font-weight:800}
.ph p{color:rgba(255,255,255,.55);font-size:14px;margin-top:2px}
.view{animation:fade .45s var(--ease) both}

/* ============ BOTTOM NAV ============ */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;padding:0 14px calc(12px + var(--safe-b))}
.nav-in{max-width:520px;margin:0 auto;height:70px;border-radius:24px;background:rgba(18,52,59,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:grid;grid-template-columns:repeat(5,1fr);align-items:center;box-shadow:0 18px 40px -12px rgba(24,58,49,.55);border:1px solid rgba(255,255,255,.06)}
.nb{display:flex;flex-direction:column;align-items:center;gap:3px;color:rgba(255,255,255,.45);font-size:11px;font-weight:600;transition:color .25s;position:relative}
.nb.on{color:var(--gold-soft)}
.nb.on::after{content:"";position:absolute;bottom:-9px;width:5px;height:5px;border-radius:50%;background:var(--gold)}
.nb .badge{position:absolute;top:-4px;left:calc(50% - 20px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 5px}
.fab{width:62px;height:62px;border-radius:21px;margin:-30px auto 0;display:grid;place-items:center;color:var(--navy-900);
  background:linear-gradient(140deg,var(--gold-soft),var(--gold) 60%,#A9861A);box-shadow:0 14px 28px -8px rgba(233,185,73,.7),0 0 0 6px var(--ivory);transition:transform .3s var(--ease)}
.fab.open{transform:rotate(45deg)}

/* ============ SHEETS ============ */
.scrim{position:fixed;inset:0;background:rgba(20,45,38,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:40;opacity:0;pointer-events:none;transition:opacity .35s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--ivory);border-radius:30px 30px 0 0;max-height:92vh;overflow-y:auto;
  transform:translateY(105%);transition:transform .45s var(--ease);padding:10px 20px calc(24px + var(--safe-b));max-width:640px;margin:0 auto}
.sheet.on{transform:translateY(0)}
.grab{width:44px;height:5px;border-radius:5px;background:#CBD5CC;margin:4px auto 18px}
.sheet h3{font-size:21px;font-weight:800;margin-bottom:4px}
.sheet .sub{color:var(--muted);font-size:14px;margin-bottom:20px}
.fg{margin-bottom:16px}
.fg label{display:block;font-size:14px;font-weight:600;margin-bottom:8px;color:#3A4655}
.inp{width:100%;height:54px;border-radius:15px;border:1.5px solid var(--line);background:#fff;padding:0 16px;font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s;appearance:none;-webkit-appearance:none}
textarea.inp{height:88px;padding:14px 16px;resize:none}
.inp:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(233,185,73,.13)}
.amt-wrap{display:flex;gap:10px}
.amt-wrap .inp:first-child{flex:1;font-size:24px;font-weight:800;height:64px;direction:ltr;text-align:left}
.amt-wrap select{width:112px;height:64px;font-weight:700;text-align:center}
.seg{display:flex;background:#E6ECE3;border-radius:15px;padding:4px;gap:4px}
.seg button{flex:1;height:44px;border-radius:12px;font-weight:600;font-size:14.5px;color:var(--muted);transition:.25s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{padding:10px 15px;border-radius:13px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:14px;transition:.2s}
.pick button.on{border-color:var(--gold);background:var(--gold-pale);color:#7A5E0A}
.btn-navy{width:100%;height:56px;border-radius:16px;background:var(--navy-800);color:#fff;font-weight:700;font-size:17px;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .2s}
.btn-navy:active{transform:scale(.98)}
.btn-ghost{width:100%;height:52px;border-radius:16px;color:var(--muted);font-weight:600;margin-top:8px}
.action-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:6px}
.ag{background:#fff;border-radius:20px;padding:18px 14px;text-align:right;border:1px solid var(--line);transition:transform .2s var(--ease)}
.ag:active{transform:scale(.97)}
.ag .ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;margin-bottom:12px}
.ag b{display:block;font-size:15.5px}
.ag small{color:var(--muted);font-size:12.5px}

/* settings */
.set-row{display:flex;align-items:center;gap:14px;padding:17px 16px;border-bottom:1px solid #EBF0E8;width:100%;text-align:right}
.set-row:last-child{border-bottom:0}
.set-row .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#E9F0EA;color:var(--navy-600)}
.set-row span{flex:1;font-weight:600}
.set-row.danger{color:var(--red)}.set-row.danger .ic{background:#FDECEA;color:var(--red)}
.profile-card{display:flex;align-items:center;gap:16px}
.profile-card .avatar{width:64px;height:64px;border-radius:20px;font-size:24px}
.tag{display:inline-block;padding:3px 11px;border-radius:999px;background:var(--gold-pale);color:#7A5E0A;font-size:12.5px;font-weight:700;margin-top:5px}

/* guide */
.guide-step{display:flex;gap:14px;align-items:flex-start;background:#fff;border-radius:18px;padding:16px;margin-bottom:10px;border:1px solid var(--line)}
.guide-step .n{width:36px;height:36px;border-radius:12px;background:var(--navy-800);color:var(--gold-soft);display:grid;place-items:center;font-weight:800;flex-shrink:0}
.guide-step b{display:block;margin-bottom:2px}
.guide-step p{color:var(--muted);font-size:14px}

/* toast */
.toast{position:fixed;top:calc(16px + var(--safe-t));left:50%;transform:translate(-50%,-140%);z-index:90;background:var(--navy-800);color:#fff;
  padding:13px 20px;border-radius:16px;font-weight:600;font-size:14.5px;box-shadow:0 14px 30px -10px rgba(0,0,0,.4);transition:transform .45s var(--ease);
  display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px);border:1px solid rgba(233,185,73,.35)}
.toast.on{transform:translate(-50%,0)}

@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

function store(get, val){
  try{
    if (get) return JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (val === null) localStorage.removeItem(STORE_KEY); else localStorage.setItem(STORE_KEY, JSON.stringify(val));
  }catch(e){ return null; }
}
function flag(key, set){
  try{ if (set) localStorage.setItem(key,'1'); return localStorage.getItem(key) === '1'; }catch(e){ return false; }

/* ================= API ================= */
async function api(action, payload){
  const body = Object.assign({ action: action, token: S.token }, payload || {});
  const ctl = ('AbortController' in window) ? new AbortController() : null;
  const t = ctl ? setTimeout(function(){ ctl.abort(); }, 25000) : null;
  try{
    const res = await fetch(API, { method:'POST', body: JSON.stringify(body), redirect:'follow', signal: ctl ? ctl.signal : undefined });
    return await res.json();
  } finally { if (t) clearTimeout(t); }
}


/* ================= PUSH (OneSignal) ================= */
const PUSH = { st:'off', os:null, opted:false, denied:false, login:null, err:'' };
function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent); }
function isStandalone(){ return window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches); }
function pushRefresh(){
  try{
    const ps = PUSH.os.User && PUSH.os.User.PushSubscription;
    PUSH.opted = !!(ps && ps.optedIn && ps.token);
    PUSH.noToken = !!(ps && ps.optedIn && !ps.token);
    PUSH.denied = ('Notification' in window) && Notification.permission === 'denied';
  }catch(e){}
}
function pushInit(){
  if (!OS_APP_ID || PUSH.st !== 'off') return;
  PUSH.st = 'loading';

}
/* مرة واحدة لكل جهاز: نزيل بقايا إشعارات تطبيق التدريب القديم (نفس النطاق بمفتاح مختلف كان يمنع التسجيل) */
function pushCleanStart(){
  let done = false; try{ done = localStorage.getItem('mf_push_clean_v6') === '1'; }catch(e){}
  if (done || !('serviceWorker' in navigator)) return Promise.resolve();
  return navigator.serviceWorker.getRegistrations().then(function(regs){
    return Promise.all(regs.filter(function(r){ return /\/push\/onesignal\/$/.test(r.scope); }).map(function(r){
      return r.pushManager.getSubscription().then(function(s){ return s && s.unsubscribe(); }).catch(function(){}).then(function(){ return r.unregister(); });
    }));
  }).then(function(){ return dropOneSignalDb(); }).catch(function(){}).then(function(){ try{ localStorage.setItem('mf_push_clean_v6', '1'); }catch(e){} });
}
function dropOneSignalDb(){
  return new Promise(function(res){ try{ const q = indexedDB.deleteDatabase('ONE_SIGNAL_SDK_DB'); q.onsuccess = q.onerror = q.onblocked = function(){ res(); }; }catch(e){ res(); } });
}
/* إصلاح كامل: حذف تسجيل الإشعارات من هذا الجهاز ثم إعادة تحميل التطبيق */
function pushRepair(){
  toast('جارٍ إصلاح الإشعارات…');
  const p = ('serviceWorker' in navigator) ? navigator.serviceWorker.getRegistrations().then(function(regs){
    return Promise.all(regs.filter(function(r){ return /\/push\//.test(r.scope); }).map(function(r){
      return r.pushManager.getSubscription().then(function(s){ return s && s.unsubscribe(); }).catch(function(){}).then(function(){ return r.unregister(); });
    }));
  }) : Promise.resolve();
  p.catch(function(){}).then(dropOneSignalDb).then(function(){
    try{ localStorage.removeItem('mf_push_ask_' + S.profile.id); localStorage.setItem('mf_push_open', '1'); }catch(e){}
    location.reload();
  });
}
function pushLoadSdk(){
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  window.OneSignalDeferred.push(function(OneSignal){
    PUSH.os = OneSignal;
    const base = new URL('push/family/', location.href).pathname;
    return Promise.resolve(OneSignal.init({ appId: OS_APP_ID, serviceWorkerPath: base + 'OneSignalSDKWorker.js', serviceWorkerParam:{ scope: base } }))
      .then(function(){
        PUSH.st = 'ready'; pushRefresh(); pushLogin(); pushAuto();
        try{ OneSignal.User.PushSubscription.addEventListener('change', function(){ pushRefresh(); pushReport(); if (S.tab==='me') go('me'); }); }catch(e){}
        if (S.tab==='me') go('me');
      }).catch(function(e){ PUSH.st = 'failed'; PUSH.err = 'init: ' + String((e && e.message) || e).slice(0,300); if (S.tab==='me') go('me'); });
  });
  const sc = document.createElement('script');
  sc.src = 'https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js'; sc.defer = true;
  sc.onerror = function(){ PUSH.st = 'failed'; PUSH.err = 'script: تعذّر تحميل مكتبة OneSignal (قد تحجبها الشبكة)'; if (S.tab==='me') go('me'); };
  setTimeout(function(){ if (PUSH.st === 'loading'){ PUSH.st = 'failed'; PUSH.err = 'timeout: انتهت مهلة التحميل (15 ثانية)'; if (S.tab==='me') go('me'); } }, 15000);
  document.head.appendChild(sc);
}

(async function boot(){
  const saved = store(true);
  if (saved && saved.token && new Date(saved.expiresISO) > new Date()){
    S.token = saved.token; S.profile = saved.profile;
    try{
      const r = await api('me');
      if (r.ok){ S.profile = r.profile; saveSession(saved.expiresISO); enterApp(); return; }
    }catch(e){ if (S.profile){ S.offline = true; enterApp(); return; } }
  }
  store(false, null);
  showLogin();
})();

function first(n){ return String(n||'').split(' ')[0]; }
function initial(n){ return String(n||'؟').trim().charAt(0); }
function fmt(n){ return n === null || n === undefined ? '—' : Number(n).toLocaleString('en-US'); }
function esc(s){ return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
const CUR_AR = { YER:'ر.ي', SAR:'ر.س', USD:'$', OMR:'ر.ع' };
function dTxt(iso){ if (!iso) return ''; const d = new Date(iso + 'T12:00:00'); if (isNaN(d)) return esc(iso); try{ return new Intl.DateTimeFormat('ar-u-nu-latn',{ day:'numeric', month:'long' }).format(d); }catch(e){ return iso; } }
function daysTo(iso){ if (!iso) return null; const a = new Date(); a.setHours(0,0,0,0); const b = new Date(iso + 'T00:00:00'); return Math.round((b - a) / 86400000); }
/* المبلغ: بالريال اليمني، أو بعملته الأصلية + التحويل إن وُجد سعر الصرف */

}
async function loadData(silent){

      '<div class="hero-sub">مجموع الصناديق'+(D&&D.ratesUpdated?' · الصرف محدّث '+dTxt(D.ratesUpdated):'')+'</div>' +
      '<div class="hero-split">' +

      '</div></section>';
  } else {
    const A = D && D.myAllowance;
    const used = A && A.amount ? Math.min(100, Math.round(A.spent / A.amount * 100)) : 0;

      '<div class="hero-lbl">'+ic('wallet',18)+' '+(A?'المتبقي من مخصصي':'مصاريفي هذا الشهر')+'</div>' +
      '<div class="hero-amt num">'+(D ? fmt(A ? A.remaining : D.month.spent) : '—')+'<small>ر.ي</small></div>' +
      '<div class="hero-sub">'+(p.dependents.length?'تشمل: '+p.dependents.join(' و '):'مصاريفك الشخصية')+'</div>' +
      (A ? '<div class="hbar"><i style="width:'+used+'%"></i></div>' : '') +
      '<div class="hero-split" style="grid-template-columns:1fr 1fr">' +
        '<div class="hs e"><span>المخصص</span><b class="num">'+(A?fmt(A.amount):'—')+'</b></div>' +
        '<div class="hs d"><span>صرفت</span><b class="num">'+(D?fmt(A?A.spent:D.month.spent):'—')+'</b></div>' +
      '</div></section>';
  }

  const actions = [['expense','minus','g-red','مصروف'], ['income','up','g-green', p.isAdmin ? 'دخل' : 'دخلي']];
  if (p.isAdmin) actions.push(['allowances','gift','g-gold','المخصصات']);
  if (p.isAdmin) actions.push(['payDebtPick','debt','g-navy','سداد دين']);
  if (p.canSendSupport) actions.push(['support','send','g-violet','دعم مرسل']);
  if (p.canAddSurpriseIncome) actions.push(['surprise','spark','g-blue','دخل مفاجئ']);
  if (p.isRateManager || p.isAdmin) actions.push(['rates','rate','g-teal','سعر الصرف']);
  if (p.isAdmin) actions.push(['funds','vault','g-amber','الصناديق']);
  if (S.data && S.data.isOwner) actions.push(['wallets','wallet','g-navy','المحافظ']);
  if (!p.isAdmin) actions.push(['request','req','g-amber','طلب زيادة']);
  const shown = actions.length > 4 ? actions.slice(0, 3).concat([['more','dots','g-gray','المزيد']]) : actions;
  const quick = '<div class="sec-h"><h3>إجراءات سريعة</h3></div><div class="quick stagger">' +
    shown.map(function(a){
      return '<button class="qa" data-act="'+a[0]+'">'+gem(a[1], a[2], 22)+'<span>'+a[3]+'</span></button>';
    }).join('') + '</div>';

  let body = '';
  if (p.canSeeAll){
    body += deficitCard(D) + advisorCard(D, false) + fundsRow(D) + walletsCard(D) + topCard(D);
    body += '<div class="sec-h"><h3>الديون</h3><button data-act="debts">الخطة كاملة</button></div><div class="cards2 stagger">' +
      '<button class="card tap" data-act="debts"><div class="mini-lbl"><span style="color:var(--red)">'+ic('debt',16)+'</span> المتبقي</div><div class="mini-amt num">'+(D&&D.debtTotals?fmt(D.debtTotals.remaining):'—')+' <small>ر.ي</small></div><div class="bar r"><i data-w="'+(D&&D.debtTotals?D.debtTotals.paidPct:0)+'"></i></div><small class="cap">'+(D&&D.debtTotals?D.debtTotals.count+' ديون قائمة · مسدد '+D.debtTotals.paidPct+'%':'نسبة السداد')+'</small></button>' +
      '<button class="card tap" data-act="allowances"><div class="mini-lbl"><span style="color:var(--gold)">'+ic('gift',16)+'</span> المخصصات</div><div class="mini-amt num">'+(D&&D.allowances?D.allowances.filter(function(a){return a.paidThisMonth;}).length+'/'+D.allowances.length:'—')+'</div><div class="bar"><i data-w="'+(D&&D.allowances&&D.allowances.length?Math.round(D.allowances.filter(function(a){return a.paidThisMonth;}).length/D.allowances.length*100):0)+'"></i></div><small class="cap">صُرفت هذا الشهر</small></button>' +
    '</div>' + planCard(D);
  } else if (D && D.myAllowance){
    body += memberAdvice(D);
  }

  const recent = '<div class="sec-h"><h3>آخر الحركات</h3><button data-tab-go="activity">الكل</button></div>' +
    (!D ? loadingList() : D.activity.length ? '<div class="list">'+D.activity.slice(0,5).map(actRow).join('')+'</div>'
        : emptyList('list','لا توجد حركات بعد','ابدأ بتسجيل أول مصروف أو دخل'));

  return '<div class="view">'+top+'<div class="wrap">'+hero+netStrip()+kidsCard(D)+quick+body+recent+'<div style="height:12px"></div></div></div>';
}

/* مؤشر العجز */
function deficitCard(D){
  if (!D || !D.insights) return '';
  const X = D.insights.deficit;
  if (X.amount >= 0) return '<div class="ok-strip">'+ic('check',18,2.4)+' لا عجز: الموارد تغطي الديون العاجلة (فائض '+fmt(X.amount)+' ر.ي)</div>';
  const nd = daysTo(X.nextDue);
  return '<button class="deficit" data-act="deficit">' +
    '<div class="df-top"><span class="df-lbl">'+ic('alert',17,2.2)+' مؤشر العجز</span><span class="df-when">'+(nd!==null?(nd>=0?'أقرب موعد بعد '+nd+' يوم':'موعد متأخر'):'')+'</span></div>' +
    '<div class="df-amt num">−'+fmt(-X.amount)+'<small>ر.ي</small></div>' +
    '<div class="df-sub">'+(X.sar?'≈ '+fmt(X.sar)+' ر.س · ':'')+'الموارد تغطي '+X.coverPct+'% من الديون العاجلة</div>' +
    '<div class="df-bar"><i style="width:'+X.coverPct+'%"></i></div>' +
    '<div class="df-legend"><span>متاح + متوقع <b class="num">'+fmt(X.resources)+'</b></span><span>عاجل <b class="num">'+fmt(X.urgent)+'</b></span></div>' +
  '</button>';
}

/* مستشار العائلة */
function advisorCard(D, full){
  if (!D || !D.insights) return '';
  const N = D.insights, T = N.tips || [];
  if (!T.length && !N.daily) return '';
  const list = (full ? T : T.slice(0, 3)).map(function(t){
    return '<div class="tip '+t.lvl+'">'+gem(t.icon, {r:'g-red',a:'g-amber',g:'g-green',m:'g-gray'}[t.lvl]||'g-gray', 17)+'<div><b>'+esc(t.t)+'</b><p>'+esc(t.d)+'</p></div></div>';
  }).join('');
  return '<div class="sec-h"><h3>مستشار العائلة</h3>'+(!full && T.length > 3 ? '<button data-act="advisor">كل النصائح ('+T.length+')</button>' : '')+'</div>' +
    '<div class="advisor">' + (N.daily && !full ? '<div class="adv-head"><div><small>حد المصروف اليومي'+(N.daily.until?' حتى '+dTxt(N.daily.until):'')+'</small><b class="num">'+fmt(N.daily.limit)+' <em>ر.ي</em></b></div>' +
      '<div class="adv-today '+(N.daily.over?'over':'')+'"><small>صُرف اليوم</small><b class="num">'+fmt(N.daily.spentToday)+'</b></div></div>' : '') + list + '</div>';
}
function memberAdvice(D){
  const A = D.myAllowance;
  if (!A || A.remaining === null) return '';
  const now = new Date(); const dim = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const left = dim - now.getDate() + 1;
  const per = Math.max(0, Math.floor(A.remaining / left / 100) * 100);
  return '<div class="sec-h"><h3>نصيحة اليوم</h3></div><div class="advisor"><div class="tip '+(A.remaining<0?'r':'g')+'">'+gem('target', A.remaining<0?'g-red':'g-green', 17) +
    '<div><b>'+(A.remaining<0?'تجاوزت مخصصك بـ '+fmt(-A.remaining)+' ر.ي':'اصرف بحدود '+fmt(per)+' ر.ي يومياً')+'</b><p>'+(A.remaining<0?'حاول تقليل المصاريف حتى نهاية الشهر، أو اطلب زيادة إن كان ضرورياً.':'المتبقي '+fmt(A.remaining)+' ر.ي لمدة '+left+' يوم حتى نهاية الشهر.')+'</p></div></div></div>';
}

/* الصناديق */
function fundsRow(D){
  if (!D || !D.funds) return '';
  return '<div class="sec-h"><h3>الصناديق</h3><button data-act="funds">تحويل</button></div><div class="funds3 stagger">' + FUNDS.map(function(f){
    const v = D.funds[f[0]];
    return '<button class="fund" data-act="funds">'+gem(f[1], f[2], 18)+'<small>'+f[0]+'</small><b class="num'+(v<0?' neg':'')+'">'+(S.bal.shown?fmt(v):'••••')+'</b></button>';
  }).join('') + '</div>';
}

/* أعلى المصاريف */
function topCard(D){
  if (!D || !D.insights) return '';
  const T = D.insights.top;

  const max = T[0].amount || 1;
  return '<div class="sec-h"><h3>أكثر المصاريف هذا الشهر</h3><button data-act="spending">التفاصيل</button></div><button class="card tap topc" data-act="spending">' +
    T.slice(0,5).map(function(t){ const c = catOf(t.name);
      return '<div class="tc">'+gem(c[1], c[2], 16)+'<div class="tc-m"><div class="tc-l"><span>'+esc(t.name)+'</span><b class="num">'+fmt(t.amount)+' <small>'+t.pct+'%</small></b></div><div class="tc-bar '+c[2]+'"><i data-w="'+Math.round(t.amount/max*100)+'"></i></div></div></div>';
    }).join('') +
    '<div class="tc-foot"><span>إجمالي الشهر</span><b class="num">'+fmt(D.insights.monthTotal)+' ر.ي</b></div></button>';

function planCard(D){
  if (!D || !D.plan) return '';
  const P = D.plan, d = daysTo(P.date);
  return '<div class="sec-h"><h3>خطة الدخل القادم</h3></div><button class="card tap plan" data-act="debts" style="margin-top:0;width:100%;text-align:right">' +
    '<div class="mini-lbl">'+ic('calendar',16)+' '+esc(P.label)+' · '+dTxt(P.date)+(d!==null&&d>=0?' (بعد '+d+' يوم)':'')+'</div>' +
    '<div class="pl"><span>الدخل المتوقع</span><b class="num">'+fmt(P.income)+' ر.ي</b></div>' +
    '<div class="pl"><span>الديون العاجلة</span><b class="num" style="color:var(--red)">− '+fmt(P.debts)+' ر.ي</b></div>' +
    '<div class="pl net'+(P.net<0?' neg':'')+'"><span>المتبقي بعد السداد</span><b class="num">'+fmt(P.net)+' ر.ي</b></div>' +
    (P.deferred ? '<div class="note-s">'+P.deferredCount+' دين يحتمل التأخير ('+fmt(P.deferred)+' ر.ي) خارج الخطة.</div>' : '') +
  '</button>';
}

function advisorSheet(){ openSheet(sheetHead('مستشار العائلة','نصائح محسوبة من بياناتكم الحقيقية') + advisorCard(S.data, true).replace(/<div class="sec-h">[\s\S]*?<\/div>/, '') + '<button class="btn-ghost" data-close>إغلاق</button>'); }

}

window.coverSavings = function(){
  const X = S.data.insights.deficit, f = (S.data.fundList||[]).filter(function(x){ return x.id === X.savingsFund; })[0];

  if (f && f.cur !== 'YER' && f.bal > 0 && f.yer) amt = Math.min(f.bal, Math.ceil(X.savingsCover / (f.yer / f.bal) * 100) / 100);

};

  const rows = D.debts.map(function(x, i){
    const d = daysTo(x.due), paid = x.status === 'مسدد';

    (D.expected && D.expected.length ? '<div class="sec-h"><h3>الدخل المتوقع</h3></div><div class="list">' + D.expected.map(function(x){

      }).join('') + '</div>' : '') +
    '<button class="btn-ghost" data-close>إغلاق</button>');

/* إرسال موحّد: يمنع التكرار، يعرض انتظار، يحدّث البيانات بعد النجاح */
async function send(f, action, payload, okMsg){
  const btn = f.querySelector('[type=submit]');
  if (btn.disabled) return;
  const label = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = '<span class="spinner" style="border-top-color:#fff;border-color:rgba(255,255,255,.3)"></span>';
  if (QUEUE_OK.indexOf(action) > -1){
    try{ const ok = await sendQ(action, payload, okMsg, action === 'addExpense' ? 'مصروف' : 'دخل'); if (ok) closeSheet(); }
    finally{ btn.disabled = false; btn.innerHTML = label; }
    return;
  }
  try{
    const r = await api(action, payload);
    if (r.ok){ closeSheet(); toast(okMsg || '✓ تم الحفظ'); loadData(true); }
    else if (r.error === 'AUTH'){ toast('انتهت الجلسة، سجّل الدخول من جديد'); setTimeout(function(){ store(false, null); location.reload(); }, 1500); }
    else toast(r.error || 'تعذّر الحفظ');
  }catch(e){ toast('تعذّر الاتصال، تأكد من الإنترنت'); }
  finally{ btn.disabled = false; btn.innerHTML = label; }
}

/* توزيع الدخل على الصناديق: ذكي (افتراضي) أو يدوي — نفس معادلة الخادم للمعاينة */
function smartSplit(m, yer){
  if (!(yer > 0) || !m) return null;
  let living = Math.max(0, m.dailyAvg * m.daysToNext + m.allowPending - Math.max(0, m.fundExpenses));
  living = Math.min(yer, Math.max(living, Math.round(yer * 0.15)));
  let rest = yer - living;
  const debts = Math.min(rest, Math.max(0, m.urgentNeed - Math.max(0, m.fundDebts)));
  rest -= debts;
  let extra = 0, sav = 0;
  if (rest > 0){ if (m.deferredNeed > 0) extra = Math.min(m.deferredNeed, Math.round(rest / 2)); sav = rest - extra; }
  const r = function(v){ return Math.round(v / 100) * 100; };
  const d = r(debts + extra), s = r(sav);
  return { debts:d, savings:s, expenses:yer - d - s };
}
function splitFields(){
  const sp = S.data.split || {debts:20,savings:10,expenses:70};
  return '<div class="fg"><label>التوزيع على الصناديق</label><div class="seg" data-name="smode"><button type="button" class="on" data-v="auto">'+ic('spark',15)+' ذكي (أنا أوزع)</button><button type="button" data-v="manual">يدوي</button></div>' +
    '<div id="smartBox" class="smart-box"><div class="sb-row"><span>اكتب المبلغ لترى التوزيع المقترح</span></div></div>' +
    '<div id="manualBox" class="split3 hidden" style="margin-top:10px">' +
      '<div><small>ديون %</small><input class="inp num" name="sd" inputmode="numeric" value="'+sp.debts+'"></div>' +
      '<div><small>ادخار %</small><input class="inp num" name="ss" inputmode="numeric" value="'+sp.savings+'"></div>' +
      '<div><small>مصاريف %</small><input class="inp num" name="se" value="'+sp.expenses+'" readonly></div></div></div>';
}
function bindSplit(f){
  if (!f.sd) return;
  const box = document.getElementById('smartBox'), man = document.getElementById('manualBox');
  function yerVal(){ const cur = f.currency.value, rate = (S.data.rates || {})[cur] || (cur === 'YER' ? 1 : 0); return Math.round((Number(String(f.amount.value).replace(/,/g,'')) || 0) * rate); }
  function preview(){
    const y = yerVal(), m0 = S.data.smart;

let FLUSHING = false;
async function flushQueue(){
  if (FLUSHING || !S.token) return;
  let q = queue(); if (!q.length) return;
  FLUSHING = true; let sent = 0;
  try{
    while (q.length){
      const it = q[0];
      let r;
      try{ r = await api(it.action, it.payload); }catch(e){ break; }   // ما زال بدون نت
      if (r && r.error === 'AUTH') break;
      if (r && !r.ok) toast('لم يُقبل: ' + (r.error || 'خطأ') + ' (' + (it.label || '') + ')');
      else sent++;
      q.shift(); setQueue(q);
    }
  } finally { FLUSHING = false; }
  if (sent){ toast('✓ أُرسلت ' + sent + ' عمليات محفوظة'); loadData(true); }
  else if (S.tab === 'home' && !document.getElementById('sheet').classList.contains('on')) go('home', true);
}

async function sendQ(action, payload, okMsg, label){
  payload = Object.assign({ cid: newCid() }, payload);
  try{
    const r = await api(action, payload);
    if (r.ok){ toast(okMsg || '✓ تم الحفظ'); loadData(true); return true; }
    if (r.error === 'AUTH'){ toast('انتهت الجلسة، سجّل الدخول من جديد'); setTimeout(function(){ store(false, null); location.reload(); }, 1500); return false; }
    toast(r.error || 'تعذّر الحفظ'); return false;
  }catch(e){
    if (QUEUE_OK.indexOf(action) === -1){ toast('تعذّر الاتصال، تأكد من الإنترنت'); return false; }
    const q = queue(); q.push({ action: action, payload: payload, label: label || '', at: Date.now() }); setQueue(q);
    S.offline = true;
    toast('📥 حُفظ على جوالك، وسيُرسل تلقائياً عند عودة النت');
    return true;
  }
}

    return api('pushTest').catch(function(){ return { ok: true }; });
  }).then(function(r){
    openSheet(bellArt() + sheetHead('تم تفعيل الإشعارات ✓', r && r.ok ? 'أرسلنا لك إشعاراً تجريبياً الآن' : 'جهازك مسجّل. قد يتأخر أول إشعار دقيقة') + '<button class="btn-navy" data-close>ممتاز</button>');
    if (S.tab === 'me') go('me');
  }).catch(function(e){
    btn.disabled = false; btn.innerHTML = ic('refresh', 18, 2.2) + ' إصلاح وإعادة المحاولة';
    btn.onclick = pushRepair;
    msg.innerHTML = '<span style="color:var(--red)">' + esc(String((e && e.message) || e)) + '</span>';
    pushReport();
  });
}
function pushDiag(){
  const out = [];
  out.push('إذن:' + (('Notification' in window) ? Notification.permission : '—'));
  try{ const ps = PUSH.os.User.PushSubscription; out.push('معرّف:' + (ps.id ? 'نعم' : 'لا'), 'رمز:' + (ps.token ? 'نعم' : 'لا')); }catch(e){}
  if (!('serviceWorker' in navigator)) return Promise.resolve(out.join(' · '));
  return navigator.serviceWorker.getRegistrations().then(function(regs){
    const r = regs.filter(function(x){ return /\/push\/family\/$/.test(x.scope); })[0];
    out.push('عامل:' + (r ? (r.active ? 'يعمل' : 'غير نشط') : 'غير مسجّل'));
    return r ? r.pushManager.getSubscription().then(function(s){ out.push('اشتراك المتصفح:' + (s ? 'نعم' : 'لا')); }) : null;
  }).catch(function(e){ out.push('خطأ:' + (e && e.message)); }).then(function(){ return out.join(' · '); });
}
function waitPushReady(ms){
  return new Promise(function(res, rej){
    if (PUSH.st === 'off') pushInit();
    const t0 = Date.now();
    (function tick(){
      if (PUSH.st === 'ready') return res();
      if (PUSH.st === 'failed') return rej(new Error('تعذّر تحميل خدمة الإشعارات، تأكد من النت ثم أعد المحاولة'));
      if (Date.now() - t0 > ms) return rej(new Error('النت بطيء، أعد المحاولة بعد قليل'));
      setTimeout(tick, 300);
    })();
  });
}
function waitToken(ms){
  return new Promise(function(res){
    const t0 = Date.now();
    (function tick(){
      pushRefresh();
      if (PUSH.opted) return res(true);
      if (Date.now() - t0 > ms) return res(false);
      setTimeout(tick, 500);
    })();
  });
}
/* حالة الإشعارات لكل أفراد العائلة (للمدراء) */
function pushFamilySheet(){
  const L = (S.data && S.data.pushStatus) || [];
  const ok = function(s){ return /مفعّلة/.test(s || ''); };
  openSheet(sheetHead('إشعارات العائلة', 'من فعّلها ومن ينتظر') + '<div class="list">' + L.map(function(x){
    const on = ok(x.state);
    return '<div class="row">' + gem(on ? 'check' : 'bell', on ? 'g-green' : 'g-amber', 18) + '<div class="t"><b>' + esc(x.name) + '</b><small>' +
      esc(x.state || '') + (x.device ? ' · ' + esc(x.device) : '') + (x.at ? ' · ' + dTxt(x.at) : '') + '</small></div>' +
      '<span class="pill ' + (on ? 'g' : 'a') + '">' + (on ? 'تصله' : 'لا تصله') + '</span></div>';
  }).join('') + '</div><p class="note-s" style="margin-top:10px">من «لا تصله»: يفتح التطبيق من أيقونته ويضغط «تفعيل الإشعارات» في الشاشة التي تظهر له.</p>' +
  '<button class="btn-ghost" data-close>إغلاق</button>');
}

/* ---------- 3) مصروف الأطفال اليومي ---------- */
function kidsCard(D){
  const p = S.profile;
  if (!D) return '';
  const L = (D.kids || []).filter(function(k){ return k.active; });
  if (!L.length){
    if (!p.isAdmin || !D.kids) return '';
    return '<button class="card tap kid-setup" data-act="kids">' + gem('child', 'g-blue', 20) + '<div><b>مصروف الأطفال اليومي</b><small>حدّد مصروف راكان وإليان اليومي</small></div>' + ic('chev', 18) + '</button>';
  }
  return '<div class="sec-h"><h3>مصروف الأطفال اليوم</h3>' + (p.isAdmin ? '<button data-act="kids">تعديل</button>' : '') + '</div><div class="list kids">' +
    L.map(function(k){
      return '<div class="row">' + gem('child', k.givenToday ? 'g-green' : 'g-blue', 19) +
        '<div class="t"><b>' + esc(k.name) + ' <span class="num" style="font-weight:500;color:var(--muted)">' + fmt(k.amount) + ' ' + (CUR_AR[k.currency] || '') + '</span></b>' +
        '<small>' + (k.givenToday ? 'أُعطي اليوم' + (k.givenBy ? ' · ' + esc(first(k.givenBy)) : '') : 'لم يُعطَ بعد') + ' · هذا الشهر ' + k.monthDays + ' يوم</small></div>' +
        (k.givenToday ? '<button class="kid-btn done" data-kid-undo="' + esc(k.givenId) + '">' + ic('check', 16, 2.6) + ' تم</button>'
                      : '<button class="kid-btn" data-kid-give="' + esc(k.id) + '">أعطيته</button>') + '</div>';
    }).join('') + '</div>';
}
function bindKids(root){
  root.querySelectorAll('[data-kid-give]').forEach(function(b){ b.onclick = async function(){
    if (b.disabled) return; b.disabled = true; b.innerHTML = '<span class="spinner"></span>';
    const k = (S.data.kids || []).filter(function(x){ return x.id === b.dataset.kidGive; })[0];
    const ok = await sendQ('kidGive', { kidId: b.dataset.kidGive }, '✓ سُجّل مصروف ' + (k ? k.name : '') + ' اليوم', 'مصروف ' + (k ? k.name : ''));
    if (ok && k){ k.givenToday = true; k.givenBy = S.profile.name; } b.disabled = false; go(S.tab, true);
  }; });
  root.querySelectorAll('[data-kid-undo]').forEach(function(b){ b.onclick = function(){
    if (!b.dataset.sure){ b.dataset.sure = '1'; b.textContent = 'تراجع؟'; b.classList.add('warn'); setTimeout(function(){ if (b.isConnected){ delete b.dataset.sure; b.innerHTML = ic('check', 16, 2.6) + ' تم'; b.classList.remove('warn'); paintIcons(b); } }, 3000); return; }
    b.disabled = true; quick('kidUndo', { givenId: b.dataset.kidUndo }, '✓ أُلغي تسجيل اليوم');
  }; });
}
function kidsSheet(){
  const D = S.data, L = D.kids || [];
  const people = D.people || [];
  const guardianDef = (people.filter(function(x){ return /شيرين/.test(x.name); })[0] || people[0] || {}).name || '';
  const form = function(k){
    k = k || { id:'', name:'', guardian:guardianDef, amount:'', active:true };
    return '<form data-submit="mfKidSet" class="card flat" style="margin-bottom:12px"><input type="hidden" name="id" value="' + esc(k.id) + '">' +
      '<div class="fg"><label>اسم الطفل</label><input class="inp" name="name" value="' + esc(k.name) + '" placeholder="مثال: راكان" required></div>' +
      '<div class="fg"><label>المصروف اليومي (ر.ي)</label><input class="inp num big-in" name="amount" inputmode="numeric" value="' + (k.amount === '' ? '' : k.amount) + '" placeholder="1500" required></div>' +
      '<div class="fg"><label>من يعطيه؟ (يظهر له زر «أعطيته»)</label><div class="pick" data-name="guardian">' + people.map(function(x){ return '<button type="button" class="' + (x.name === k.guardian ? 'on' : '') + '" data-v="' + esc(x.name) + '">' + esc(x.short || first(x.name)) + '</button>'; }).join('') + '</div></div>' +
      '<button class="btn-navy" type="submit" style="margin:0">' + (k.id ? 'حفظ' : 'إضافة') + '</button>' +
      (k.id ? '<p class="note-s" style="margin-top:8px">لإيقافه: اكتب 0</p>' : '') + '</form>';
  };
  openSheet(sheetHead('مصروف الأطفال اليومي', 'مبلغ ثابت كل يوم، يُسجَّل عندما يضغط من يعطيه «أعطيته»، ويُخصم من صندوق المصاريف') +
    L.map(form).join('') + '<div class="sec-h" style="margin-top:6px"><h3>' + (L.length ? 'طفل آخر' : 'أضف طفلاً') + '</h3></div>' + form(null) +
    '<button class="btn-ghost" data-close>إغلاق</button>');
}
window.mfKidSet = function(f){ send(f, 'kidSet', { id: f.id.value, name: f.name.value, amount: f.amount.value, guardian: pv(f, 'guardian') }, '✓ حُفظ المصروف اليومي'); };
</script>
