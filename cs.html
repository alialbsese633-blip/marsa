<style>
:root{--bg:#F3F6F6;--surface:#fff;--surface-2:#F1F5F6;--border:#DFE7E9;--ink:#0E2429;--ink-2:#44585D;--muted:#7D9095;
--brand:#287070;--brand-deep:#16474A;--brand-soft:#E4F0F0;--good:#1E7A55;--good-soft:#E2F2EA;--warn:#9A6A10;--warn-soft:#FAF1DC;--bad:#B03A33;--bad-soft:#FAE7E5;
--font:"IBM Plex Sans Arabic",-apple-system,"Segoe UI",Tahoma,sans-serif;--shadow:0 1px 2px rgba(10,50,57,.05),0 6px 20px -12px rgba(10,50,57,.18)}
@media (prefers-color-scheme:dark){:root{--bg:#0A1719;--surface:#102226;--surface-2:#15292E;--border:#24393E;--ink:#E7F2F3;--ink-2:#B1C4C7;--muted:#7F9599;--brand:#2FB3C4;--brand-deep:#061C20;--brand-soft:#0F3A40;--good:#52C28E;--good-soft:#123427;--warn:#E0BA58;--warn-soft:#382D12;--bad:#E8857B;--bad-soft:#3C1E1B}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;padding-bottom:env(safe-area-inset-bottom,0)}
a{color:inherit}button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.bar{background:var(--brand-deep);color:#fff;position:sticky;top:0;z-index:5}.bar-in{max-width:1180px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.bar h1{font-size:17px;margin:0;font-weight:600}.bar a{color:#fff;text-decoration:none;opacity:.85}.sp{flex:1}.who{font-size:13px;opacity:.85}
.wrap{max-width:1180px;margin:auto;padding:14px 16px 40px}
.cust{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;box-shadow:var(--shadow);margin-bottom:12px}
.cust label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);min-height:42px}
textarea{min-height:120px;resize:vertical;line-height:1.7}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.tabs button{border:1px solid var(--border);background:var(--surface);padding:10px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;font-weight:500}
.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.lbl{font-size:12px;color:var(--muted);margin-bottom:3px;display:block}
.btn{border:0;background:var(--brand);color:#fff;padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:600;min-height:42px}
.btn.alt{background:var(--brand-soft);color:var(--brand-deep)}.btn.wa{background:#1F8F55}.btn.bad{background:var(--bad-soft);color:var(--bad)}.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--surface-2);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}.chip.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-deep);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--border)}th{color:var(--muted);font-weight:500;font-size:12px}
.num{font-variant-numeric:tabular-nums}.tot td{font-weight:700;font-size:16px}
.note{padding:10px 12px;border-radius:10px;font-size:13px;margin:8px 0}.note.w{background:var(--warn-soft);color:var(--warn)}.note.b{background:var(--bad-soft);color:var(--bad)}.note.g{background:var(--good-soft);color:var(--good)}
.opt{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--surface-2)}
.rep{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--surface)}.rep h3{margin:0 0 6px;font-size:15px}.rep p{margin:0 0 8px;white-space:pre-wrap;line-height:1.8;color:var(--ink-2)}
.var{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:0 4px}
.small{font-size:12px;color:var(--muted)}.hide{display:none!important}
.step{border:2px solid var(--brand);border-radius:14px;padding:16px;background:var(--brand-soft)}.step h3{margin:0 0 6px}
.prog{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:8px 0}.prog i{display:block;height:100%;background:var(--brand)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--brand-deep);color:#fff;padding:10px 18px;border-radius:99px;z-index:9;display:none}
#qprint{display:none}
body.embed .bar{display:none}body.embed .wrap{padding:8px}body.embed .cust{grid-template-columns:1fr 1fr;padding:8px}body.embed .cust>div:last-child{grid-column:1/3}body.embed .card{padding:10px}body.embed .tabs button{padding:8px 12px}
@media (max-width:640px){.cust{grid-template-columns:1fr}.bar h1{font-size:15px}}
@media print{body>*:not(#qprint){display:none!important}#qprint{display:block;color:#000;background:#fff;padding:24px;direction:rtl}#qprint table th,#qprint table td{border-bottom:1px solid #ccc;color:#000}}
</style>

<body>
<header class="bar"><div class="bar-in"><a href="./" aria-label="الرئيسية">→ مرسى</a><h1>خدمة العملاء والحجوزات</h1><span class="sp"></span><span class="who" id="who"></span></div></header>
<div class="wrap" id="app"><div class="card">جارٍ التحقق من الدخول…</div></div>

<script>
(function(){
'use strict';
var EMBED=/[?&]embed=1/.test(location.search);
var API=String((window.HR_CONFIG||{}).API_URL||'').trim(),TK='marsa_token',KEY='cs_v1',USER=null,TOKEN=null;
var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(m){var t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(function(){t.style.display='none'},2200)}
function api(b){return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)}).then(function(r){return r.json()})}

/* ---------- البيانات الافتراضية (لا أسعار مُختلقة: الإدارة تُدخل الأسعار) ---------- */
var REPLIES=[
{c:'أسعار وتوفر',t:'طلب التواريخ',b:'أهلاً {{الاسم}}، يسعدنا خدمتك. لأعطيك السعر والتوفر، تكرّم اكتب لنا تاريخ الوصول والمغادرة وعدد الأشخاص.'},
{c:'أسعار وتوفر',t:'متابعة عرض سعر',b:'أهلاً {{الاسم}}، نتابع معك بخصوص عرض السعر الذي أرسلناه. هل ما زلت مهتماً؟ العرض متاح حتى {{انتهاء العرض}}.'},
{c:'موقع ومرافق',t:'إرسال الموقع',b:'تفضل موقع {{البناية}} على الخريطة: {{رابط الموقع}}'},
{c:'دفع وتأكيد',t:'خطوات التأكيد والدفع',b:'للتأكيد نرسل لك العقد الرسمي أولاً بالتواريخ والسعر وسياسة الإلغاء، ثم رابط الدفع الرسمي لمبلغ العربون {{العربون}} ر.ع. بعد الدفع يصلك إيصال مرقّم وقسيمة تأكيد الحجز.'},
{c:'دفع وتأكيد',t:'أوقات الدخول والخروج',b:'{{أوقات الدخول والخروج المعتمدة}}'},
{c:'دفع وتأكيد',t:'سياسة الإلغاء',b:'{{نص سياسة الإلغاء المعتمد من الإدارة}}'},
{c:'شكاوى',t:'اعتذار واستلام شكوى',b:'نعتذر لك عمّا حصل، ونقدّر إبلاغك لنا. سنتابع الأمر بأنفسنا الآن ونعود إليك خلال {{المدة}}.'},
{c:'كسب الثقة',t:'هل أنتم شركة مرخصة؟',b:'نحن شركة العالمية السعيدة المتحدة، سجل تجاري رقم 1428061، ونعمل باسم نسائم صلالة للشقق المفروشة. يمكنك التحقق من بياناتنا وأرقامنا من موقعنا الرسمي nassayem.com، أو الاتصال بنا على 99551237.'},
{c:'كسب الثقة',t:'خائف من دفع العربون',b:'سؤالك في محله. قبل أي دفع نرسل لك العقد الرسمي بالتواريخ والسعر وسياسة الإلغاء، ويتم الدفع عبر رابط الدفع الرسمي للشركة فقط، وبعده يصلك إيصال مرقّم وقسيمة تأكيد حجز.'},
{c:'كسب الثقة',t:'هل الصور حقيقية؟',b:'الصور من بناياتنا الفعلية. نرسل لك الآن فيديو حديثاً للوحدة نفسها، ويمكنك مقارنته بما في موقعنا الرسمي nassayem.com.'},
{c:'كسب الثقة',t:'أريد رؤية الشقة قبل الدفع',b:'نرسل لك جولة فيديو للوحدة ومبنى البناية وموقعها على الخريطة، {{ويمكن ترتيب مكالمة فيديو مع مشرف البناية}}.'},
{c:'كسب الثقة',t:'لا أريد التحويل لحساب شخصي',b:'{{الدفع يتم عبر رابط الدفع الرسمي أو حساب باسم الشركة فقط}}، ولا نطلب التحويل إلى أي حساب شخصي.'},
{c:'كسب الثقة',t:'سمعت عن حالات نصب',b:'نتفهم حذرك، فهذا يحدث فعلاً في المواسم. للأمان: لا تدفع إلا بعد استلام العقد، وتأكد أن الرابط باسم الشركة، ويمكنك الاتصال بالرقم الرسمي المنشور في nassayem.com للتأكد من أي طلب دفع.'},
{c:'كسب الثقة',t:'أفضّل الحجز عبر منصة',b:'يمكنك الحجز عبر Booking.com {{رابط البناية}} إن كان ذلك أريح لك، ونرحب بك أيضاً بالحجز المباشر معنا.'}
];
var LESSONS=[
{t:'الجولة السريعة للشاشة',s:['اكتب اسم عميل تجريبي ورقمه في الشريط العلوي.','افتح تبويب «عرض السعر» ثم «الردود السريعة».','اضغط «/» على الكيبورد وشاهد كيف يذهب المؤشر لبحث الردود.']},
{t:'عرض السعر: 23/7 إلى 5/8',s:['اختر البناية ونوع الوحدة.','اختر الوصول 23/7 والمغادرة 5/8 وتأكد أن الليالي 13.','اضغط «احسب» وراجع تفصيل الفترات.','اضغط «نسخ النص» ثم «فتح واتساب».']},
{t:'الرد السريع والمتغيّرات',s:['ابحث عن «سياسة الإلغاء».','املأ الحقول الصفراء (المتغيّرات) قبل الإرسال.','اضغط «نسخ» أو «واتساب».']},
{t:'العميل المتشكك',s:['افتح فئة «كسب الثقة».','اختر الرد المناسب لسؤال العميل: ترخيص، عربون، صور، نصب.','أرسل رابط الموقع الرسمي مع الرد.']},
{t:'العقد والعربون',s:['بعد قول العميل «تأكيد»، افتح صفحة الاستقبال لإصدار العقد (حجز جديد).','أرسل رابط الدفع الرسمي بمبلغ العربون الصحيح.','لا تؤكد الحجز قبل تأكد المحاسب من الدفع.']},
{t:'الزحام والمكالمات الفائتة',s:['إن لم تستطع الرد على الاتصال، أرسل رد «المكالمة الفائتة» من الردود السريعة.','دوّن في ملاحظات الفريق أي محادثة تركتها.','لا ترد على محادثة يكتب فيها زميلك.']}
];
var DEF={buildings:['الحي التجاري','المعتزة (صلالة الوسطى)','عوقد','الوادي','الحصيلة','السعادة','السعادة نستو'],types:['غرفة واحدة','غرفتان','ثلاث غرف'],
rates:[],los:[],presets:[],depositPct:0,validHours:24,caps:{rcp:0,acc:0,hr:100,gm:100},replies:null,hist:[],guide:{}};
var S=load();
function load(){try{var j=JSON.parse(localStorage.getItem(KEY)||'{}');return Object.assign(JSON.parse(JSON.stringify(DEF)),j)}catch(e){return JSON.parse(JSON.stringify(DEF))}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('تعذّر الحفظ على هذا الجهاز')}}
function isAdmin(){return USER&&(USER.role==='hr'||USER.role==='gm')}
function reps(){return S.replies||REPLIES}

/* ---------- تواريخ وحساب ---------- */
function pd(s){var p=String(s).split('-');return Date.UTC(+p[0],+p[1]-1,+p[2])}
function fd(ms){return new Date(ms).toISOString().slice(0,10)}
function dm(s){var p=String(s).split('-');return +p[2]+'/'+(+p[1])}
function m3(n){return (Math.round(n*1000)/1000).toFixed(3)}
function nightsList(a,b){var o=[],x=pd(a),y=pd(b);for(;x<y;x+=864e5)o.push(fd(x));return o}
function pick(b,t,d){var best=null;S.rates.forEach(function(r){
  if((r.building!=='*'&&r.building!==b)||(r.type!=='*'&&r.type!==t)||d<r.from||d>r.to)return;
  var sc=(+r.prio||0)*1000+(r.building!=='*'?100:0)+(r.type!=='*'?10:0)-(pd(r.to)-pd(r.from))/864e5/1000;
  if(!best||sc>best.sc)best={r:r,sc:sc}});return best&&best.r}
function quote(o){
  var ns=nightsList(o.from,o.to);if(!ns.length)return{err:'تاريخ المغادرة يجب أن يكون بعد الوصول'};
  var miss=[],lines=[],minStay=0;
  ns.forEach(function(d){var r=pick(o.b,o.t,d);if(!r){miss.push(d);return}minStay=Math.max(minStay,+r.min||0);lines.push({d:d,rate:+r.rate,label:r.label||'سعر الليلة'})});
  if(miss.length)return{err:'لا يوجد سعر للتواريخ: '+miss.slice(0,4).map(dm).join('، ')+(miss.length>4?' …':'')+' — أضف الفترة في «الأسعار» (للإدارة).'};
  var groups=[];lines.forEach(function(l){var g=groups[groups.length-1];if(g&&g.rate===l.rate&&g.label===l.label&&pd(l.d)-pd(g.to)===864e5){g.to=l.d;g.n++}else groups.push({from:l.d,to:l.d,rate:l.rate,label:l.label,n:1})});
  var sub=lines.reduce(function(a,l){return a+l.rate},0),losPct=0;
  S.los.forEach(function(x){if(ns.length>=+x.min&&+x.pct>losPct)losPct=+x.pct});
  var cap=(S.caps||{})[USER&&USER.role];if(cap==null)cap=0;
  var man=Math.max(0,+o.manual||0),capErr=man>cap?'الخصم اليدوي يتجاوز صلاحيتك ('+cap+'%) — يلزم اعتماد المشرف/المدير':'';
  var los=sub*losPct/100,mn=capErr?0:sub*man/100,total=sub-los-mn;
  return{ns:ns.length,groups:groups,sub:sub,losPct:losPct,los:los,man:man,mn:mn,capErr:capErr,total:total,avg:total/ns.length,
    dep:S.depositPct>0?total*S.depositPct/100:0,minStay:minStay,minWarn:minStay>ns.length?'الحد الأدنى للإقامة في هذه الفترة '+minStay+' ليالٍ':''}
}
function quoteText(o,q){
  var c=cust();var L=['أهلاً '+(c.name||'بك')+'،','عرض سعر إقامتكم في نسائم صلالة — '+o.b+' (خريف ظفار)',
  'الوصول: '+dm(o.from)+'  |  المغادرة: '+dm(o.to)+'  ('+q.ns+' ليلة)','الوحدة: '+o.t];
  q.groups.forEach(function(g){L.push('• '+dm(g.from)+(g.n>1?' – '+dm(g.to):'')+': '+g.n+' ليلة × '+m3(g.rate)+' ر.ع')});
  if(q.los)L.push('خصم الإقامة الطويلة '+q.losPct+'%: −'+m3(q.los)+' ر.ع');
  if(q.mn)L.push('خصم خاص '+q.man+'%: −'+m3(q.mn)+' ر.ع');
  L.push('الإجمالي: '+m3(q.total)+' ر.ع (بمتوسط '+m3(q.avg)+' ر.ع لليلة)');
  if(q.dep)L.push('عربون التثبيت: '+m3(q.dep)+' ر.ع');
  L.push('العرض صالح لمدة '+S.validHours+' ساعة من إرساله.','للتأكيد اكتب «تأكيد» وسنرسل العقد ورابط الدفع الرسمي.','نسائم صلالة — حيث تسكن الراحة | nassayem.com');
  return L.join('\n')
}

/* ---------- واتساب واتصال ---------- */
function phone(){var p=String(($('#cPhone')||{}).value||'').replace(/[^\d]/g,'');if(p.length===8)p='968'+p;return p}
function cust(){return{name:(($('#cName')||{}).value||'').trim(),phone:phone()}}
function wa(text){if(EMBED){parent.postMessage({marsa:'insert',text:text},'*');toast('أُدخل في خانة واتساب — راجعه ثم اضغط Enter');return}var p=phone();if(!p){toast('اكتب رقم العميل أولاً');return}window.open('https://wa.me/'+p+'?text='+encodeURIComponent(text),'_blank','noopener')}
function copy(t){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast('تم النسخ')},fb)}else fb();function fb(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('تم النسخ')}catch(e){toast('تعذّر النسخ')}a.remove()}}

/* ---------- الواجهة ---------- */
var TAB='quote',CAT='الكل',LAST=null;
function shell(){
  var tabs=[['quote','عرض السعر'],['replies','الردود السريعة'],['branches','الفروع والمواقع'],['guide','الدليل التفاعلي']];if(isAdmin())tabs.push(['rates','الأسعار والإعدادات']);
  $('#app').innerHTML='<div class="cust"><div><label>اسم العميل</label><input id="cName" autocomplete="off"></div><div><label>رقم العميل (واتساب/اتصال)</label><input id="cPhone" inputmode="tel" placeholder="9XXXXXXX" autocomplete="off"></div><div style="display:flex;align-items:end;gap:6px"><button class="btn wa" id="cWa" type="button">واتساب</button><button class="btn alt" id="cTel" type="button">اتصال</button></div></div>'+
  '<div class="tabs" id="tabs">'+tabs.map(function(t){return '<button type="button" data-t="'+t[0]+'">'+t[1]+'</button>'}).join('')+'</div><div id="pane"></div>';
  $('#cWa').onclick=function(){var p=phone();if(!p){toast('اكتب رقم العميل');return}if(EMBED){parent.postMessage({marsa:'openchat',phone:p},'*')}else window.open('https://wa.me/'+p,'_blank','noopener')};
  $('#cTel').onclick=function(){var p=phone();if(!p){toast('اكتب رقم العميل');return}if(EMBED){parent.postMessage({marsa:'call',phone:p},'*')}else location.href='tel:+'+p};
  $('#tabs').onclick=function(e){var b=e.target.closest('button[data-t]');if(b)go(b.dataset.t)};
  go(TAB)

  '<div class="card"><h2>الخصومات والعربون والصلاحيات</h2><div class="grid"><div><span class="lbl">خصم الإقامة الطويلة: من ليالٍ</span><input type="number" id="lM" value="'+(S.los[0]?S.los[0].min:'')+'"></div><div><span class="lbl">النسبة %</span><input type="number" id="lP" value="'+(S.los[0]?S.los[0].pct:'')+'"></div><div><span class="lbl">العربون %</span><input type="number" id="dP" value="'+S.depositPct+'"></div><div><span class="lbl">صلاحية العرض (ساعة)</span><input type="number" id="vH" value="'+S.validHours+'"></div><div><span class="lbl">أقصى خصم يدوي: الاستقبال %</span><input type="number" id="cR" value="'+S.caps.rcp+'"></div><div><span class="lbl">أقصى خصم يدوي: الحسابات %</span><input type="number" id="cA" value="'+S.caps.acc+'"></div></div>'+
  '<span class="lbl" style="margin-top:10px">البنايات (سطر لكل بناية)</span><textarea id="eB" style="min-height:90px">'+esc(S.buildings.join('\n'))+'</textarea><span class="lbl">أنواع الوحدات</span><textarea id="eT" style="min-height:70px">'+esc(S.types.join('\n'))+'</textarea><div class="row" style="margin-top:10px"><button class="btn" id="sAll" type="button">حفظ الإعدادات</button><button class="btn alt" id="xEx" type="button">تصدير</button><button class="btn alt" id="xIm" type="button">استيراد</button></div></div>';
  $('#rAdd').onclick=function(){var r={building:$('#rB').value,type:$('#rT').value,from:$('#rF').value,to:$('#rO').value,rate:+$('#rR').value,label:$('#rL').value.trim(),prio:+$('#rP').value||0,min:+$('#rM').value||0};
    if(!r.from||!r.to||r.to<r.from||!(r.rate>0)){toast('تحقق من التواريخ والسعر');return}S.rates.push(r);S.rates.sort(function(a,b){return a.from<b.from?-1:1});save();pRates()};
  $$('[data-d]').forEach(function(b){b.onclick=function(){S.rates.splice(+b.dataset.d,1);save();pRates()}});
  $('#pAdd').onclick=function(){var n=$('#pN').value.trim(),f=$('#pF').value,o=$('#pO').value;if(!n||!f||!o){toast('أكمل الحقول');return}S.presets.push({name:n,from:f,to:o});save();pRates()};
  $$('[data-p]').forEach(function(a){a.onclick=function(e){e.preventDefault();S.presets.splice(+a.dataset.p,1);save();pRates()}});
  $('#sAll').onclick=function(){var m=+$('#lM').value,p=+$('#lP').value;S.los=m>0&&p>0?[{min:m,pct:p}]:[];S.depositPct=+$('#dP').value||0;S.validHours=+$('#vH').value||24;S.caps.rcp=+$('#cR').value||0;S.caps.acc=+$('#cA').value||0;
    var b=$('#eB').value.split('\n').map(function(x){return x.trim()}).filter(Boolean),t=$('#eT').value.split('\n').map(function(x){return x.trim()}).filter(Boolean);if(b.length)S.buildings=b;if(t.length)S.types=t;save();toast('تم الحفظ');pRates()};
  $('#xEx').onclick=function(){var d={rates:S.rates,los:S.los,presets:S.presets,depositPct:S.depositPct,validHours:S.validHours,caps:S.caps,buildings:S.buildings,types:S.types,replies:S.replies};copy(JSON.stringify(d))};
  $('#xIm').onclick=function(){var s=prompt('الصق نص التصدير هنا');if(!s)return;try{var d=JSON.parse(s);Object.assign(S,d);save();pRates();toast('تم الاستيراد')}catch(e){toast('النص غير صالح')}}
}

document.addEventListener('keydown',function(e){
  if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'')){e.preventDefault();go('replies');setTimeout(function(){var q=$('#rq');if(q)q.focus()},0)}
  if(e.ctrlKey&&(e.key==='q'||e.key==='Q')){e.preventDefault();go('quote')}});

/* ---------- الدخول: نفس جلسة مرسى (مع نموذج دخول داخلي للوحة الجانبية) ---------- */
function loginForm(msg){
  $('#app').innerHTML='<form class="card" id="lf" style="max-width:380px;margin:30px auto"><h2>تسجيل الدخول إلى مرسى</h2><span class="lbl">اسم المستخدم</span><input id="lU" autocapitalize="none" autocomplete="username"><span class="lbl" style="margin-top:8px">كلمة المرور</span><input id="lP" type="password" autocomplete="current-password">'+(msg?'<div class="note b">'+esc(msg)+'</div>':'')+'<div class="row" style="margin-top:12px"><button class="btn" id="lB">دخول</button></div></form>';
  $('#lf').onsubmit=function(e){e.preventDefault();$('#lB').disabled=true;
    api({action:'login',u:$('#lU').value.trim(),p:$('#lP').value}).then(function(r){
      if(!r||!r.ok){loginForm(r&&r.error==='locked'?'أُوقفت المحاولات مؤقتاً، انتظر 10 دقائق':'اسم المستخدم أو كلمة المرور غير صحيحة');return}
      if(r.user&&r.user.must){loginForm('غيّر كلمة المرور أولاً من تطبيق مرسى ثم ارجع هنا');return}
      TOKEN=r.token;try{localStorage.setItem(TK,r.token);localStorage.setItem('marsa_user',JSON.stringify(r.user))}catch(x){}start(r.user)
    }).catch(function(){loginForm('تعذّر الاتصال بالخادم')})}
}
function start(u){USER=u;
  if(['hr','gm','acc','rcp'].indexOf(USER.role)<0){$('#app').innerHTML='<div class="card">هذا القسم لموظفي الاستقبال والحسابات والإدارة.</div>';return}
  $('#who').textContent=USER.name||'';shell()}
try{TOKEN=localStorage.getItem(TK)}catch(e){}
if(EMBED){document.body.classList.add('embed');window.addEventListener('message',function(e){var d=e.data||{};if(d.marsa!=='chat')return;var n=$('#cName'),p=$('#cPhone');if(n&&d.name&&n.value!==d.name)n.value=d.name;if(p&&d.phone&&p.value!==d.phone)p.value=d.phone})}
if(!API){$('#app').innerHTML='<div class="card">إعدادات الخادم غير موجودة.</div>'}
else if(!TOKEN)loginForm('');
else api({action:'me',t:TOKEN}).then(function(r){if(!r||!r.ok){loginForm('انتهت الجلسة، سجّل الدخول من جديد');return}start(r.user)}).catch(function(){$('#app').innerHTML='<div class="card">تعذّر الاتصال بالخادم. تأكد من الإنترنت ثم أعد المحاولة.</div>'});
})();
</script>
</body>
</html>
